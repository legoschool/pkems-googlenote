      var more = el("button", "btn sm ghost morebtn", expanded[n.id] ? "접기 ▲" : "더 보기 ▼");
      more.addEventListener("click", function () { expanded[n.id] = !expanded[n.id]; render(); });
      card.appendChild(more);
      setTimeout(function () {
        if (!expanded[n.id] && body.scrollHeight <= 320) { more.classList.add("hidden"); body.classList.remove("collapsed"); }
      }, 0);

      // 연결 — 나가는 링크와 들어오는 백링크
      var outs = outLinks(n), ins = backLinks(n);
      if (outs.length || ins.length) {
        var rel = el("div", "rel");
        rel.appendChild(el("div", "relhead", "🔗 연결 — 나감 " + outs.length + " · 들어옴 " + ins.length));
        var chips = el("div", "relchips");
        outs.forEach(function (l) {
          var c = el("button", "relchip out" + (l.to ? "" : " missing"), l.title);

          c.addEventListener("click", function () { if (l.to) gotoEntry(l.to); else startNewFromLink(l.title); });
          chips.appendChild(c);
        });
        ins.forEach(function (x) {
          var c = el("button", "relchip in", x.title);
          c.type = "button";
          c.addEventListener("click", function () { gotoEntry(x.id); });
          chips.appendChild(c);
        });
        rel.appendChild(chips);
        card.appendChild(rel);
      }

      var foot = el("div", "foot");
      var pending = (n.blocks || []).filter(function (b) { return (b.kind === "image" || b.kind === "file") && !b.fileId; }).length;
      foot.appendChild(el("span", "sync-dot " + (n.mdId && !pending ? "ok" : "pending"),
        n.mdId && !pending ? "☁ 드라이브 저장됨" : (connected ? "⏳ 업로드 대기" : "💾 이 기기에만 저장")));
      if (n.mdId) {
        var md = el("a", "btn sm", "📝 .md 열기");
        md.href = driveLink(n.mdId); md.target = "_blank"; md.rel = "noopener noreferrer";
        md.style.textDecoration = "none";
        foot.appendChild(md);
      }
      foot.appendChild(el("span", "spacer"));
      var bE = el("button", "btn sm", "편집"); bE.addEventListener("click", function () { loadIntoComposer(n); });
      var bD = el("button", "btn sm danger", "삭제"); bD.addEventListener("click", function () { removeEntry(n.id); });
      foot.appendChild(bE); foot.appendChild(bD);
      card.appendChild(foot);

      host.appendChild(card);
    });

  /* =========================================================
     12-1. 관계망 (기록끼리 어떻게 이어져 있는지)
     ========================================================= */
  var TYPE_COLORS = ["#2f5fd6", "#1a9e5f", "#d98324", "#a34fc4", "#d64545", "#0f9aa8", "#8a6d3b", "#5b6bd6"];
  function typeColor(key) {
    var i = 0;
    for (var k = 0; k < settings.types.length; k++) if (settings.types[k].key === key) { i = k; break; }
    return TYPE_COLORS[i % TYPE_COLORS.length];

  function openGraph() {
    closeModal();
    invalidateLinks();

    var bg = el("div", "modal-bg");
    var m = el("div", "card modal graphmodal");

    var head = el("div", "mhead");
    head.appendChild(el("h3", null, "🕸️ 관계망"));
    head.appendChild(el("span", "spacer"));
    var x = el("button", "btn sm ghost", "✕"); x.addEventListener("click", closeModal);
    head.appendChild(x);
    m.appendChild(head);

    var body = el("div", "mbody");
    var canvas = el("canvas"); canvas.id = "graphCanvas";
    body.appendChild(canvas);

    var tools = el("div", "graphtools");
    var search = el("input", "inp"); search.placeholder = "제목 찾기";
    var tagBtn = el("button", "btn sm", "🏷️ 태그 ON");
    var labelBtn = el("button", "btn sm", "🔤 이름 ON");
    var fitBtn = el("button", "btn sm", "⛶ 맞춤");
    tools.appendChild(search); tools.appendChild(tagBtn); tools.appendChild(labelBtn); tools.appendChild(fitBtn);
    body.appendChild(tools);

    var legend = el("div", "graphlegend");
    body.appendChild(legend);

    var emptyMsg = el("div", "graphempty");
    body.appendChild(emptyMsg);
    m.appendChild(body);

    var foot = el("div", "mfoot");
    var stat = el("span", "desc"); stat.style.margin = "0";
    foot.appendChild(stat);
    foot.appendChild(el("span", "spacer"));
    foot.appendChild(el("span", "desc", "점을 끌어 옮기고, 누르면 그 기록으로 갑니다"));
    m.appendChild(foot);

    bg.appendChild(m);
    bg.addEventListener("click", function (e) { if (e.target === bg) closeModal(); });
    $("modalHost").appendChild(bg);
    modalEl = bg;

    /* ---- 그래프 데이터 ---- */
    var showTags = true, showLabels = true, query = "";
    var nodes = [], edges = [], byId = {}, raf = null, alive = true;

    function buildGraph() {
      nodes = []; edges = []; byId = {};
      var ld = linkData();
      var w = canvas.clientWidth || 800, h = canvas.clientHeight || 500;
      entries.forEach(function (n, i) {
        var ang = i * 2.399, rad = 30 + 14 * Math.sqrt(i);
        var node = {
          id: n.id, kind: "entry", label: n.title || "(제목 없음)", color: typeColor(n.type),
          x: w / 2 + Math.cos(ang) * rad, y: h / 2 + Math.sin(ang) * rad, vx: 0, vy: 0, deg: 0
        };
        nodes.push(node); byId[n.id] = node;
      });
      // 직접 건 [[링크]]
      entries.forEach(function (n) {
        (ld.out[n.id] || []).forEach(function (l) {
          if (!l.to || l.to === n.id || !byId[l.to]) return;
          edges.push({ a: byId[n.id], b: byId[l.to], kind: "link" });
          byId[n.id].deg++; byId[l.to].deg++;
        });
      });
      // 태그를 통한 연결
      if (showTags) {
        var tagMap = {};
        entries.forEach(function (n) {
          (n.tags || []).forEach(function (t) {
            var k = "#" + normTitle(t);
            (tagMap[k] = tagMap[k] || { label: "#" + t, ids: [] }).ids.push(n.id);
          });
        });
        Object.keys(tagMap).forEach(function (k) {
          var g = tagMap[k];
          if (g.ids.length < 2) return;   // 혼자 쓰는 태그는 그리지 않는다
          var tn = {
            id: k, kind: "tag", label: g.label, color: "#94a3b8",
            x: canvas.clientWidth / 2 + (Math.random() - .5) * 200,
            y: canvas.clientHeight / 2 + (Math.random() - .5) * 200, vx: 0, vy: 0, deg: g.ids.length
          };
          nodes.push(tn); byId[k] = tn;
          g.ids.forEach(function (id) {
            if (!byId[id]) return;
            edges.push({ a: tn, b: byId[id], kind: "tag" });
          });
        });
      }
      emptyMsg.style.display = nodes.length ? "none" : "flex";
      emptyMsg.textContent = "아직 그릴 것이 없습니다.\n글 안에서 [[ 를 쳐서 다른 기록과 연결해 보세요.";
      var linkCount = edges.filter(function (e) { return e.kind === "link"; }).length;
      stat.textContent = "기록 " + entries.length + "개 · 직접 연결 " + linkCount + "개" +
        (showTags ? " · 태그 연결 " + (edges.length - linkCount) + "개" : "");

    function paintLegend() {
      legend.innerHTML = "";
      settings.types.forEach(function (t) {
        var c = entries.filter(function (n) { return n.type === t.key; }).length;
        if (!c) return;

    /* ---- 물리 계산 ---- */
    function tick() {
      var w = canvas.clientWidth, h = canvas.clientHeight, cx = w / 2, cy = h / 2;
      var i, j, a, b, dx, dy, d2, d, f;
      for (i = 0; i < nodes.length; i++) {
        a = nodes[i];
        for (j = i + 1; j < nodes.length; j++) {
          b = nodes[j];
          dx = b.x - a.x; dy = b.y - a.y;
          d2 = dx * dx + dy * dy;
          if (d2 < 1) { d2 = 1; dx = Math.random() - .5; dy = Math.random() - .5; }
          if (d2 > 160000) continue;
          f = 2600 / d2;
          d = Math.sqrt(d2);
          a.vx -= f * dx / d; a.vy -= f * dy / d;
          b.vx += f * dx / d; b.vy += f * dy / d;
        }
      }
      edges.forEach(function (e) {
        dx = e.b.x - e.a.x; dy = e.b.y - e.a.y;
        d = Math.sqrt(dx * dx + dy * dy) || 1;
        var rest = e.kind === "tag" ? 130 : 95;
        f = (d - rest) * (e.kind === "tag" ? 0.006 : 0.014);
        e.a.vx += f * dx / d; e.a.vy += f * dy / d;
        e.b.vx -= f * dx / d; e.b.vy -= f * dy / d;
      });
      nodes.forEach(function (n) {
        n.vx += (cx - n.x) * 0.0016;
        n.vy += (cy - n.y) * 0.0016;
        if (n === dragNode) { n.vx = 0; n.vy = 0; return; }
        n.vx *= 0.85; n.vy *= 0.85;
        n.x += Math.max(-12, Math.min(12, n.vx));
        n.y += Math.max(-12, Math.min(12, n.vy));
      });
    }

    /* ---- 그리기 ---- */
    var scale = 1, panX = 0, panY = 0, dragNode = null, panning = false;
    var lastPt = null, downPt = null, moved = 0;

    // 캔버스 픽셀 크기가 화면 크기와 어긋나면 그림이 눌리고 클릭 위치도 틀어진다
    function resize() {
      var dpr = window.devicePixelRatio || 1;
      var w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
      if (!w || !h) return false;
      if (canvas.width === w && canvas.height === h) return false;
      canvas.width = w; canvas.height = h;
      return true;
    }
    function draw() {
      resize();   // 모달 크기가 뒤늦게 잡히는 경우까지 매 프레임 확인
      var dpr = window.devicePixelRatio || 1;
      var ctx = canvas.getContext("2d");
      var css = getComputedStyle(document.body);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      ctx.save();
      ctx.translate(panX, panY);
      ctx.scale(scale, scale);

      var q = normTitle(query);
      var hi = {};
      if (q) nodes.forEach(function (n) { if (normTitle(n.label).indexOf(q) >= 0) hi[n.id] = 1; });

      edges.forEach(function (e) {
        var dim = q && !hi[e.a.id] && !hi[e.b.id];
        ctx.strokeStyle = e.kind === "tag" ? "rgba(148,163,184,.35)" : "rgba(120,140,190,.55)";
        if (dim) ctx.strokeStyle = "rgba(150,150,160,.12)";
        ctx.lineWidth = (e.kind === "tag" ? 1 : 1.6) / scale * 1;
        if (e.kind === "tag") ctx.setLineDash([4 / scale, 4 / scale]); else ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(e.a.x, e.a.y);
        ctx.lineTo(e.b.x, e.b.y);
        ctx.stroke();
      });
      ctx.setLineDash([]);

      nodes.forEach(function (n) {
        var r = (n.kind === "tag" ? 4 : 6) + Math.min(9, n.deg * 1.3);
        var dim = q && !hi[n.id];
        ctx.globalAlpha = dim ? 0.22 : 1;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fillStyle = n.color;
        ctx.fill();
        if (hi[n.id]) {
          ctx.lineWidth = 3 / scale; ctx.strokeStyle = "#f59e0b"; ctx.stroke();
        }
        if (showLabels && scale > 0.55) {
          ctx.globalAlpha = dim ? 0.25 : 0.92;
          ctx.fillStyle = css.color;
          ctx.font = (n.kind === "tag" ? 11 : 12) + "px system-ui, sans-serif";
          ctx.textAlign = "center";
          var lab = n.label.length > 18 ? n.label.slice(0, 17) + "…" : n.label;
          ctx.fillText(lab, n.x, n.y + r + 13);
        }
        ctx.globalAlpha = 1;
      });
      ctx.restore();
    }
    function loop() {
      if (!alive) return;
      tick(); draw();
      raf = requestAnimationFrame(loop);
    }

    /* ---- 조작 ---- */
    function toWorld(ev) {
      var r = canvas.getBoundingClientRect();
      var p = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
      return { x: (p.clientX - r.left - panX) / scale, y: (p.clientY - r.top - panY) / scale, sx: p.clientX, sy: p.clientY };
    }
    function hitTest(w) {
      for (var i = nodes.length - 1; i >= 0; i--) {
        var n = nodes[i];
        var r = ((n.kind === "tag" ? 4 : 6) + Math.min(9, n.deg * 1.3)) + 6;
        if ((w.x - n.x) * (w.x - n.x) + (w.y - n.y) * (w.y - n.y) <= r * r) return n;
      }
      return null;
    }
    function down(ev) {
      ev.preventDefault();
      var w = toWorld(ev);
      downPt = w; lastPt = w; moved = 0;
      dragNode = hitTest(w);
      panning = !dragNode;
      canvas.classList.add("grabbing");
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
      window.addEventListener("touchmove", move, { passive: false });
      window.addEventListener("touchend", up);
    }
    function move(ev) {
      if (!downPt) return;
      ev.preventDefault();
      var r = canvas.getBoundingClientRect();
      var p = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
      var w = { x: (p.clientX - r.left - panX) / scale, y: (p.clientY - r.top - panY) / scale, sx: p.clientX, sy: p.clientY };
      moved += Math.abs(w.sx - lastPt.sx) + Math.abs(w.sy - lastPt.sy);
      if (dragNode) { dragNode.x = w.x; dragNode.y = w.y; }
      else if (panning) { panX += (w.sx - lastPt.sx); panY += (w.sy - lastPt.sy); }
      lastPt = w;
    }
    function up() {
      canvas.classList.remove("grabbing");
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      window.removeEventListener("touchmove", move);
      window.removeEventListener("touchend", up);
      if (dragNode && moved < 6) {
        var n = dragNode;
        if (n.kind === "entry") gotoEntry(n.id);
        else { query = n.label.replace(/^#/, ""); search.value = query; }
      }
      dragNode = null; panning = false; downPt = null;
    }
    canvas.addEventListener("mousedown", down);
    canvas.addEventListener("touchstart", down, { passive: false });
    canvas.addEventListener("wheel", function (ev) {
      ev.preventDefault();
      var r = canvas.getBoundingClientRect();
      var mx = ev.clientX - r.left, my = ev.clientY - r.top;
      var k = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
      var ns = Math.max(0.2, Math.min(4, scale * k));
      panX = mx - (mx - panX) * (ns / scale);
      panY = my - (my - panY) * (ns / scale);
      scale = ns;
    }, { passive: false });

    function fit() {
      if (!nodes.length) return;
      var x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
      nodes.forEach(function (n) {
        x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
        x2 = Math.max(x2, n.x); y2 = Math.max(y2, n.y);
      });
      // 위쪽 도구막대에 가려지지 않도록 여백을 잡는다
      var w = canvas.clientWidth, h = canvas.clientHeight;
      var padTop = (tools.offsetHeight || 0) + 24, padSide = 46, padBottom = 34;
      var availW = Math.max(80, w - padSide * 2), availH = Math.max(80, h - padTop - padBottom);
      var bw = (x2 - x1) || 1, bh = (y2 - y1) || 1;
      scale = Math.max(0.25, Math.min(2, Math.min(availW / bw, availH / bh)));
      panX = padSide + availW / 2 - ((x1 + x2) / 2) * scale;
      panY = padTop + availH / 2 - ((y1 + y2) / 2) * scale;
    }

    search.addEventListener("input", function () { query = this.value.trim(); });
    tagBtn.addEventListener("click", function () {
      showTags = !showTags;
      tagBtn.textContent = showTags ? "🏷️ 태그 ON" : "🏷️ 태그 OFF";
      buildGraph();
    });
    labelBtn.addEventListener("click", function () {
      showLabels = !showLabels;

    });
    fitBtn.addEventListener("click", fit);

    var onResize = function () { resize(); };
    window.addEventListener("resize", onResize);

    modalCleanup = function () {
      alive = false;

      window.removeEventListener("resize", onResize);
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      window.removeEventListener("touchmove", move);

    };

    setTimeout(function () {

      buildGraph();
      for (var i = 0; i < 220; i++) tick();   // 미리 안정화

      loop();
    }, 30);
  }

    function paintNaming() {
      body.appendChild(el("p", "desc", "드라이브에 저장될 파일 이름을 원하는 대로 정하세요. 태그를 눌러 조립할 수 있습니다."));
      body.appendChild(makePatternField("📝 글(마크다운) 파일 이름", "mdPattern", MD_PRESETS, true));
      body.appendChild(makePatternField("📎 사진·파일 이름", "filePattern", FILE_PRESETS, false));
      var note = el("p", "desc");
      note.textContent =
        "{폴더명} 은 지금 연결된 드라이브 폴더 이름(" + (folder.name || "미연결") + ")이 자동으로 들어갑니다. " +
        "폴더를 바꾸면 이후 저장분에 새 폴더명이 따라붙습니다. " +
        "{확장자} 를 쓰지 않으면 원래 확장자가 자동으로 붙고, 같은 이름이 이미 있으면 -2, -3 이 붙습니다.";
      body.appendChild(note);
    }

    function paintAdvanced() {
      var f = el("div", "field");
      f.appendChild(el("label", null, "구글 OAuth 클라이언트 ID (관리자용)"));
      var r = el("div", "row");
      var inp = el("input", "inp mono");
      inp.style.flex = "1 1 240px"; inp.style.width = "auto";
      inp.value = clientId;
      inp.placeholder = "…apps.googleusercontent.com";
      var b = el("button", "btn", "적용");
      b.addEventListener("click", function () {
        clientId = inp.value.trim();
        localStorage.setItem(LS.cid, clientId);
        tokenClient = null;
        toast("클라이언트 ID를 적용했습니다.");
      });
      r.appendChild(inp); r.appendChild(b);
      f.appendChild(r);
      f.appendChild(el("p", "desc", "보통은 건드릴 필요가 없습니다. 앱에 이미 심어져 있습니다."));
      body.appendChild(f);

      var f2 = el("div", "field");
      f2.appendChild(el("label", null, "이 앱 주소 (구글 콘솔의 '승인된 자바스크립트 원본'에 등록해야 하는 값)"));
      f2.appendChild(el("div", "preview", location.origin));
      body.appendChild(f2);

      var f3 = el("div", "field");
      f3.appendChild(el("label", null, "내보내기"));
      var r3 = el("div", "row");
      var ex = el("button", "btn sm", "전체 기록 JSON 내려받기");
      ex.addEventListener("click", function () {
        var blob = new Blob([JSON.stringify({ version: 2, app: "PKEMS", settings: settings, entries: entries.map(slim) }, null, 2)],
          { type: "application/json" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "PKEMS-backup-" + dateStamp() + ".json";
        a.click();
      });
      r3.appendChild(ex);
      f3.appendChild(r3);
      body.appendChild(f3);

      var f4 = el("div", "field");
      f4.appendChild(el("label", null, "이 브라우저에서 로그아웃"));
      var lo = el("button", "btn sm danger", "연결 해제");
      lo.addEventListener("click", function () {
        accessToken = null; connected = false; userEmail = "";
        localStorage.removeItem(LS.connected);
        updateChrome(); toast("연결을 해제했습니다. 기록은 그대로 남아 있습니다.");
        closeModal();
      });
      f4.appendChild(lo);
      body.appendChild(f4);
    }

    paint();
  }

  /* =========================================================
     13. 이벤트
     ========================================================= */
  $("btnSettings").addEventListener("click", function () { openSettings("storage"); });
  $("btnGraph").addEventListener("click", openGraph);
  $("btnLogin").addEventListener("click", function () {
    if (connected) { autoSync(true).then(function () { toast("동기화했습니다."); }); return; }
    if (folder.id) { connect(""); return; }
    requestToken(true).then(ensureAccount).then(function () {
      updateChrome(); openSettings("storage"); toast("로그인 완료. 저장할 폴더를 지정해 주세요.");
    }).catch(function (e) { toast("로그인 실패: " + e.message); });
  });

  Array.prototype.forEach.call($("addbar").querySelectorAll("[data-add]"), function (b) {
    b.addEventListener("click", function () { addBlock(b.getAttribute("data-add")); });
  });
  $("fileInput").addEventListener("change", function (e) { acceptFiles(e.target.files); e.target.value = ""; });
  $("imgInput").addEventListener("change", function (e) { acceptFiles(e.target.files); e.target.value = ""; });
  $("cropPickInput").addEventListener("change", function (e) { handlePickedImage(e.target.files[0]); e.target.value = ""; });

  // 화면 어디에 놓아도 첨부되도록 (파일을 끌어올 때만 반응)
  var dragDepth = 0;
  function draggingFiles(e) {
    var t = e.dataTransfer && e.dataTransfer.types;
    if (!t) return false;
    for (var i = 0; i < t.length; i++) if (t[i] === "Files") return true;
    return false;
  }
  function showDrop(on) {
    $("dropOverlay").classList.toggle("hidden", !on);
    $("addbar").classList.toggle("hover", on);
  }
  window.addEventListener("dragenter", function (e) {
    if (!draggingFiles(e)) return;
    e.preventDefault(); dragDepth++; showDrop(true);
  });
  window.addEventListener("dragover", function (e) {
    if (!draggingFiles(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
  });
  window.addEventListener("dragleave", function (e) {
    if (!draggingFiles(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) showDrop(false);
  });
  window.addEventListener("drop", function (e) {
    dragDepth = 0; showDrop(false);
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    acceptFiles(e.dataTransfer.files);
  });

  $("title").addEventListener("input", function () {
    if (blocks.some(function (b) { return (b.kind === "image" || b.kind === "file") && !b.name; })) renderBlocks();
  });
  $("btnSave").addEventListener("click", saveEntry);
  $("btnCancelEdit").addEventListener("click", resetComposer);
  $("search").addEventListener("input", function () { searchQ = this.value.trim(); render(); });
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); saveEntry(); }
    if (e.key === "Escape" && modalEl) closeModal();
  });

  /* ---------- 모바일 ↔ PC 자동 동기화 ----------
     휴대폰에서 쓰고 PC로 돌아오면(=탭이 다시 보이면) 알아서 최신을 끌어옵니다. */
  var lastSyncAt = 0, syncing = false;
  function setSyncPill(text, busy) {
    var p = $("syncPill");
    p.textContent = text || "";
    p.className = "syncpill" + (busy ? " busy" : "");
  }
  function syncedAgo() {
    if (!connected) return "";
    if (!lastSyncAt) return "";
    var s = Math.round((Date.now() - lastSyncAt) / 1000);
    if (s < 60) return "☁ 방금 동기화";
    if (s < 3600) return "☁ " + Math.round(s / 60) + "분 전 동기화";
    return "☁ " + Math.round(s / 3600) + "시간 전 동기화";
  }
  function autoSync(force) {
    if (!connected || syncing) return Promise.resolve();
    if (!force && Date.now() - lastSyncAt < 20000) return Promise.resolve();
    if (!navigator.onLine) { setSyncPill("⚠ 오프라인"); return Promise.resolve(); }
    syncing = true;
    setSyncPill("↻ 동기화 중…", true);
    return loadIndex()
      .then(function (remote) {
        absorbIndex(remote);
        saveLocal(); render();
        return syncPending();
      })
      .then(function () {
        lastSyncAt = Date.now(); syncing = false; setSyncPill(syncedAgo());
      })
      .catch(function () {
        syncing = false; setSyncPill("⚠ 동기화 실패");
      });
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) autoSync(); });
  window.addEventListener("focus", function () { autoSync(); });
  window.addEventListener("online", function () { autoSync(true); });
  setInterval(function () { if (!syncing) setSyncPill(syncedAgo()); }, 30000);

  /* =========================================================
     14. 시작
     ========================================================= */
  renderTypeChips();
  renderBlocks();
  render();
  updateChrome();
  rehydratePending();   // 지난번에 못 올린 사진·파일 되살리기

  // 기기에 맞는 버튼 이름
  (function () {
    var b = document.querySelector('[data-add="capture"]');
    if (b && isTouchDevice()) b.textContent = "📸 캡처·촬영";
  })();

  if (clientId && folder.id && localStorage.getItem(LS.connected) === "1") {
    var wait = setInterval(function () {
      if (!gisReady()) return;
      clearInterval(wait);
      requestToken(false).then(ensureAccount)
        .then(function () { return verifyFolder(folder.id); })
        .then(function (f) {
          folder = { id: f.id, name: f.name, link: f.link };
          connected = true; updateChrome();
          return loadSettingsRemote();
        })
        .then(function (rs) {
          if (rs) { settings = normalizeSettings(rs); saveSettingsLocal(); renderTypeChips(); }
          return loadIndex();
        })
        .then(function (remote) {
          absorbIndex(remote);
          saveLocal(); render(); updateChrome();
          return syncPending();
        })
        .then(function () { lastSyncAt = Date.now(); setSyncPill(syncedAgo()); })
        .catch(function () { /* 조용히 실패 — 사용자가 버튼으로 연결 */ });
    }, 300);
    setTimeout(function () { clearInterval(wait); }, 8000);
  }
})();
</script>
</body>
</html>
