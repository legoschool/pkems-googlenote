  // 고른 이미지 파일 → (자르기 화면) → 사진 블록
  var MAX_EDGE = 2400; // 휴대폰 고화질 사진을 자르기 전에 적당히 줄인다
  function imageFileToCanvas(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var s = Math.min(1, MAX_EDGE / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(w * s));
        c.height = Math.max(1, Math.round(h * s));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("이미지를 열 수 없습니다.")); };
      img.src = url;
    });
  }
  /* ---------- 웹캠으로 바로 찍기 (PC) ---------- */
  function openWebcam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast("이 브라우저에서는 웹캠을 쓸 수 없습니다.");
      return;
    }
    var stream = null, alive = true;
    navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })
      .then(function (s) {
        stream = s;
        if (!alive) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
        showCam(s);
      })
      .catch(function (e) {
        var n = (e && e.name) || "";
        if (n === "NotAllowedError") toast("카메라 사용이 거부되었습니다. 주소창의 카메라 아이콘에서 허용해 주세요.");
        else if (n === "NotFoundError") toast("연결된 카메라를 찾지 못했습니다.");
        else toast("카메라를 열 수 없습니다: " + (e && e.message ? e.message : e));
      });

    function stop() {
      alive = false;
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }

    function showCam(s) {
      closeModal();
      var bg = el("div", "modal-bg");
      var m = el("div", "card modal"); m.style.maxWidth = "720px";
      var head = el("div", "mhead");
      head.appendChild(el("h3", null, "📷 웹캠으로 찍기"));
      head.appendChild(el("span", "spacer"));
      var x = el("button", "btn sm ghost", "✕"); x.addEventListener("click", closeModal);
      head.appendChild(x);
      m.appendChild(head);

      var body = el("div", "mbody"); body.style.textAlign = "center";
      var v = document.createElement("video");
      v.autoplay = true; v.playsInline = true; v.muted = true;
      v.className = "camview";
      v.srcObject = s;
      body.appendChild(v);
      body.appendChild(el("p", "crophint", "화면에 담기면 «찍기» 를 누르세요. 찍은 뒤 필요한 부분만 잘라 넣을 수 있습니다."));
      m.appendChild(body);

      var foot = el("div", "mfoot");
      foot.appendChild(el("span", "spacer"));
      var cancel = el("button", "btn", "취소");
      cancel.addEventListener("click", closeModal);
      var shoot = el("button", "btn primary", "📷 찍기");
      shoot.addEventListener("click", function () {
        var w = v.videoWidth, h = v.videoHeight;
        if (!w || !h) { toast("아직 화면이 준비되지 않았습니다. 잠시 후 다시 눌러 주세요."); return; }
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(v, 0, 0, w, h);
        stop();
        openCropModal(c, "웹캠_" + dateStamp() + "_" + timeStamp() + ".png");
      });
      foot.appendChild(cancel); foot.appendChild(shoot);
      m.appendChild(foot);

      bg.appendChild(m);
      bg.addEventListener("click", function (e) { if (e.target === bg) closeModal(); });
      $("modalHost").appendChild(bg);
      modalEl = bg;
      modalCleanup = stop;
    }
  }

  /* ---------- 클립보드에서 바로 붙여넣기 (창 공유 없이) ---------- */
  function pasteFromClipboard() {
    if (!navigator.clipboard || !navigator.clipboard.read) {
      toast("이 브라우저는 버튼으로 붙여넣기를 지원하지 않습니다. 글 칸을 누르고 Ctrl+V 를 눌러 주세요.");
      return;
    }
    navigator.clipboard.read().then(function (items) {
      var files = [], jobs = [];
      items.forEach(function (it) {
        var type = it.types.filter(function (t) { return /^image\//.test(t); })[0];
        if (!type) return;
        jobs.push(it.getType(type).then(function (blob) {
          var ext = "." + (type.split("/")[1] || "png").replace("jpeg", "jpg");
          files.push(new File([blob], "붙여넣기_" + dateStamp() + "_" + timeStamp() + ext, { type: type }));
        }));
      });
      return Promise.all(jobs).then(function () {
        if (!files.length) { toast("클립보드에 이미지가 없습니다. 먼저 Win+Shift+S(맥 ⌘⇧4)로 캡처하세요."); return; }
        acceptFiles(files);
      });
    }).catch(function (e) {
      if (e && e.name === "NotAllowedError") toast("클립보드 읽기 권한이 필요합니다. 주소창 아이콘에서 허용하거나, 글 칸에서 Ctrl+V 를 쓰세요.");
      else toast("클립보드를 읽지 못했습니다. 글 칸에서 Ctrl+V 를 써 주세요.");
    });
  }

  // 카메라 촬영 — 누를 때만 입력칸을 만들고 바로 없앤다
  function pickFromCamera() {
    var inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/*";
    inp.setAttribute("capture", "environment");
    inp.style.display = "none";
    document.body.appendChild(inp);
    inp.addEventListener("change", function () {
      var f = inp.files && inp.files[0];
      setTimeout(function () { if (inp.parentNode) inp.parentNode.removeChild(inp); }, 0);
      handlePickedImage(f);
    });
    inp.click();
  }

  function handlePickedImage(file) {
    if (!file) return;
    if (skipCrop) { acceptFiles([file]); return; }
    imageFileToCanvas(file)
      .then(function (c) { openCropModal(c, file.name); })
      .catch(function (e) { toast(e.message); });
  }

  /* ---------- 화면 캡처 (데스크톱) ---------- */
  function startCapture() { openCaptureSheet(); }

  function startScreenCapture() {
    if (!captureSupported()) {
      toast("이 브라우저·환경은 화면 캡처를 지원하지 않습니다. Win+Shift+S(맥은 ⌘⇧4)로 캡처한 뒤 글 칸에 Ctrl+V 로 붙여넣으세요.");
      return;
    }
    var askedAt = Date.now();
    navigator.mediaDevices.getDisplayMedia({ video: true, audio: false })
      .then(function (stream) {
        var v = document.createElement("video");
        v.srcObject = stream; v.muted = true; v.playsInline = true;
        return v.play().then(function () {
          // 첫 프레임이 실제로 그려질 때까지 잠깐 기다린다
          return new Promise(function (res) { setTimeout(function () { res(v); }, 300); });
        });
      })
      .then(function (v) {
        var w = v.videoWidth, h = v.videoHeight;
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(v, 0, 0, w, h);
        try { v.srcObject.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
        if (!w || !h) { toast("캡처된 화면이 없습니다. 다시 시도해 주세요."); return; }
        openCropModal(c);
      })
      .catch(function (e) {
        var name = (e && e.name) || "";
        // 선택창이 뜰 새도 없이 거절됐다면 사용자가 취소한 게 아니라 브라우저가 막은 것이다
        var blocked = (Date.now() - askedAt) < 600;
        if ((name === "NotAllowedError" || name === "AbortError") && !blocked) return; // 사용자가 취소
        if (name === "NotAllowedError" || name === "NotSupportedError" || name === "AbortError") {
          toast("이 창에서는 화면 캡처가 막혀 있습니다. 크롬 등 일반 브라우저에서 열면 됩니다. (또는 Win+Shift+S 로 캡처 후 글 칸에 Ctrl+V)");
          return;
        }
        toast("화면 캡처 실패: " + (e && e.message ? e.message : e));
      });
  }

  // 캔버스를 PNG(너무 크면 JPEG) Blob 으로
  function canvasToAttachment(canvas, srcName) {
    var base = srcName
      ? safeName(stemOf(srcName), 40) + "_잘라냄"
      : "화면캡처_" + dateStamp() + "_" + timeStamp();
    return new Promise(function (res) {
      canvas.toBlob(function (png) {
        function done(blob, ext) {
          res({ original: base + ext, mime: blob.type, size: blob.size, blob: blob });
        }
        if (png && png.size > 6 * 1024 * 1024) {
          canvas.toBlob(function (jpg) { done(jpg || png, jpg ? ".jpg" : ".png"); }, "image/jpeg", 0.88);
        } else if (png) {
          done(png, ".png");
        } else {
          canvas.toBlob(function (jpg) { done(jpg, ".jpg"); }, "image/jpeg", 0.9);
        }
      }, "image/png");
    });
  }

  function openCropModal(canvas, srcName) {
    closeModal();
    var full = canvas;
    var bg = el("div", "modal-bg");
    var m = el("div", "card modal"); m.style.maxWidth = "min(960px, 96vw)";

    var head = el("div", "mhead");
    head.appendChild(el("h3", null, "📸 캡처 영역 고르기"));
    head.appendChild(el("span", "spacer"));
    var x = el("button", "btn sm ghost", "✕"); x.addEventListener("click", closeModal);
    head.appendChild(x);
    m.appendChild(head);

    var body = el("div", "mbody"); body.style.textAlign = "center";
    var wrap = el("div", "cropwrap");
    var img = el("img");
    img.src = full.toDataURL("image/png");
    img.draggable = false;
    var sel = el("div", "cropsel"); sel.style.display = "none";
    var sizeTag = el("div", "cropsize"); sel.appendChild(sizeTag);
    wrap.appendChild(img); wrap.appendChild(sel);
    body.appendChild(wrap);
    body.appendChild(el("p", "crophint",
      "이미지 위에서 드래그해 저장할 영역을 고르세요. 그냥 전체를 쓰려면 «전체 사용»을 누르면 됩니다."));
    m.appendChild(body);

    var foot = el("div", "mfoot");
    var info = el("span", "desc"); info.style.margin = "0";
    info.textContent = full.width + " × " + full.height + " px";
    foot.appendChild(info);
    foot.appendChild(el("span", "spacer"));
    var again = el("button", "btn", srcName ? "다시 고르기" : "다시 찍기");
    again.addEventListener("click", function () { closeModal(); setTimeout(openCaptureSheet, 200); });
    var whole = el("button", "btn", "전체 사용");
    whole.addEventListener("click", function () { useRegion(0, 0, full.width, full.height); });
    var useSel = el("button", "btn primary", "선택 영역 사용");
    useSel.disabled = true;
    foot.appendChild(again); foot.appendChild(whole); foot.appendChild(useSel);
    m.appendChild(foot);

    bg.appendChild(m);
    bg.addEventListener("click", function (e) { if (e.target === bg) closeModal(); });
    $("modalHost").appendChild(bg);
    modalEl = bg;

    /* --- 드래그로 영역 선택 --- */
    var start = null, rect = null;
    function pos(e) {
      var r = img.getBoundingClientRect();
      var p = (e.touches && e.touches[0]) ? e.touches[0] : e;
      return {
        x: Math.max(0, Math.min(r.width, p.clientX - r.left)),
        y: Math.max(0, Math.min(r.height, p.clientY - r.top))
      };
    }
    function paintSel() {
      if (!rect) { sel.style.display = "none"; useSel.disabled = true; return; }
      sel.style.display = "block";
      sel.style.left = rect.x + "px"; sel.style.top = rect.y + "px";
      sel.style.width = rect.w + "px"; sel.style.height = rect.h + "px";
      var s = full.width / img.clientWidth;
      sizeTag.textContent = Math.round(rect.w * s) + " × " + Math.round(rect.h * s) + " px";
      useSel.disabled = rect.w < 8 || rect.h < 8;
    }
    function down(e) {
      e.preventDefault();
      start = pos(e); rect = { x: start.x, y: start.y, w: 0, h: 0 }; paintSel();
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
      window.addEventListener("touchmove", move, { passive: false });
      window.addEventListener("touchend", up);
    }
    function move(e) {
      if (!start) return;
      e.preventDefault();
      var p = pos(e);
      rect = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) };
      paintSel();
    }
    function up() {
      start = null;
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      window.removeEventListener("touchmove", move);
      window.removeEventListener("touchend", up);
    }
    wrap.addEventListener("mousedown", down);
    wrap.addEventListener("touchstart", down, { passive: false });

    useSel.addEventListener("click", function () {
      if (!rect) return;
      var s = full.width / img.clientWidth;
      useRegion(Math.round(rect.x * s), Math.round(rect.y * s), Math.round(rect.w * s), Math.round(rect.h * s));
    });

    function useRegion(sx, sy, sw, sh) {
      sw = Math.max(1, Math.min(sw, full.width - sx));
      sh = Math.max(1, Math.min(sh, full.height - sy));
      var c = document.createElement("canvas");
      c.width = sw; c.height = sh;
      c.getContext("2d").drawImage(full, sx, sy, sw, sh, 0, 0, sw, sh);
      canvasToAttachment(c, srcName).then(function (att) {
        blocks.push(newBlock("image", att));
        renderBlocks();
        closeModal();
        toast("캡처 " + sw + "×" + sh + " 를 추가했습니다. (" + humanSize(att.size) + ")");
        var last = $("blocks").lastElementChild;
        if (last) last.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    }
  }

  /* ---------- [[ 입력하면 뜨는 기록 고르기 ---------- */
  var wikiState = { field: null, start: -1, items: [], sel: 0 };

  function hideWikiPop() {
    $("wikiPop").classList.add("hidden");
    wikiState.field = null;
  }
  // 커서 바로 앞에 아직 닫히지 않은 "[[" 가 있는지
  function activeWikiQuery(field) {
    var v = field.value.slice(0, field.selectionStart);
    var i = v.lastIndexOf("[[");
    if (i < 0) return null;
    var after = v.slice(i + 2);
    if (after.indexOf("]]") >= 0 || after.indexOf("\n") >= 0 || after.length > 40) return null;
    return { start: i, q: after };
  }
  function paintWikiPop() {
    var pop = $("wikiPop");
    pop.innerHTML = "";
    pop.appendChild(el("div", "cap", "기록 고르기 — ↑↓ 이동, Enter 넣기, Esc 닫기"));
    wikiState.items.forEach(function (it, i) {
      var b = el("button", "wp" + (i === wikiState.sel ? " on" : ""));
      b.type = "button";
      b.appendChild(document.createTextNode(it.label));
      b.appendChild(el("small", null, it.sub));
      b.addEventListener("mousedown", function (e) { e.preventDefault(); applyWikiPick(i); });
      pop.appendChild(b);
    });
    pop.classList.remove("hidden");
    var r = wikiState.field.getBoundingClientRect();
    var top = r.bottom + window.scrollY + 4;
    var left = r.left + window.scrollX;
    pop.style.top = top + "px";
    pop.style.left = Math.min(left, window.innerWidth - 260) + "px";
    pop.style.width = Math.min(r.width, 340) + "px";
  }
  function updateWikiPop(field) {
    var a = activeWikiQuery(field);
    if (!a) { hideWikiPop(); return; }
    var q = normTitle(a.q);
    var items = entries
      .filter(function (n) { return n.id !== editingId && n.title; })
      .filter(function (n) { return !q || normTitle(n.title).indexOf(q) >= 0; })
      .slice(0, 8)
      .map(function (n) { return { label: n.title, sub: typeOf(n.type).icon + " " + typeOf(n.type).label + " · " + formatDate(n.createdAt) }; });
    if (a.q.trim()) items.push({ label: a.q.trim(), sub: "＋ 이 제목으로 새 기록 연결하기", isNew: true });
    if (!items.length) { hideWikiPop(); return; }
    wikiState = { field: field, start: a.start, items: items, sel: 0 };
    paintWikiPop();
  }
  function applyWikiPick(i) {
    var st = wikiState;
    if (!st.field || !st.items[i]) return;
    var f = st.field, title = st.items[i].label;
    var before = f.value.slice(0, st.start);
    var after = f.value.slice(f.selectionStart);
    var insert = "[[" + title + "]]";
    f.value = before + insert + after;
    var caret = before.length + insert.length;
    f.setSelectionRange(caret, caret);
    f.dispatchEvent(new Event("input", { bubbles: true }));
    hideWikiPop();
    f.focus();
  }
  function wikiKeydown(e) {
    var pop = $("wikiPop");
    if (pop.classList.contains("hidden") || !wikiState.field) return;
    if (e.key === "ArrowDown") { e.preventDefault(); wikiState.sel = (wikiState.sel + 1) % wikiState.items.length; paintWikiPop(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); wikiState.sel = (wikiState.sel - 1 + wikiState.items.length) % wikiState.items.length; paintWikiPop(); }
    else if ((e.key === "Enter" && !e.ctrlKey && !e.metaKey) || e.key === "Tab") {
      e.preventDefault(); e.stopPropagation(); applyWikiPick(wikiState.sel);
    }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); hideWikiPop(); }
  }
  // 글·소제목·인용 칸에 자동완성을 붙인다
  function attachWiki(field) {
    field.addEventListener("input", function () { updateWikiPop(field); });
    field.addEventListener("keydown", wikiKeydown);
    field.addEventListener("click", function () { updateWikiPop(field); });
    field.addEventListener("blur", function () { setTimeout(function () { if (wikiState.field === field) hideWikiPop(); }, 120); });
  }

  function handlePaste(e, afterBlock) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file") { var f = items[i].getAsFile(); if (f) files.push(f); }
    }
    if (!files.length) return;
    e.preventDefault();
    acceptFiles(files, afterBlock);
  }

  // 첨부는 Blob 그대로 들고 있는다 (base64 문자열로 부풀리지 않음)
  var objUrls = {};
  function previewUrl(b) {
    if (objUrls[b.id]) return objUrls[b.id];
    if (!(b.blob instanceof Blob)) { if (b.blob) delete b.blob; return null; }
    try { objUrls[b.id] = URL.createObjectURL(b.blob); } catch (e) { return null; }
    return objUrls[b.id];
  }
  function dropPreview(id) {
    if (objUrls[id]) { try { URL.revokeObjectURL(objUrls[id]); } catch (e) {} delete objUrls[id]; }
  }

  function acceptFiles(fileList, afterBlock) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return Promise.resolve();
    var made = [];
    files.forEach(function (f) {
      if (f.size > MAX_FILE_MB * 1024 * 1024) {
        toast("「" + f.name + "」 은 " + MAX_FILE_MB + "MB 를 넘어 건너뜁니다. (" + humanSize(f.size) + ")");
        if (/^video\//.test(f.type || "")) {
          toast2("긴 영상은 유튜브에 «일부공개»로 올리고, ＋코드 삽입 에 주소를 붙여넣는 편이 낫습니다.");
        }
        return;
      }
      var mime = f.type || "application/octet-stream";
      made.push(newBlock(/^image\//.test(mime) ? "image" : "file", {
        original: f.name || "file", mime: mime, size: f.size, blob: f
      }));
    });
    if (!made.length) return Promise.resolve();
    var at = afterBlock ? blocks.findIndex(function (b) { return b.id === afterBlock.id; }) + 1 : blocks.length;
    blocks.splice.apply(blocks, [at, 0].concat(made));
    renderBlocks();
    toast(made.length + "개를 추가했습니다.");
    return Promise.resolve();
  }

  /* =========================================================
     8-9. 임시저장 — 쓰다가 창이 꺼져도 그대로 남는다
     ========================================================= */
  var draftDirty = false, draftRestored = false;
  function touchDraft() { draftDirty = true; }

  function draftHasContent() {
    return !!($("title").value.trim() || $("tags").value.trim() || hasContent());
  }
  var lastDraftBody = null;
  function saveDraft() {
    if (!draftHasContent()) { clearDraft(true); return; }
    var body = {
      editingId: editingId,
      type: currentType,
      title: $("title").value,
      tags: $("tags").value,
      blocks: blocks.map(function (b) { var c = cloneBlock(b); delete c.blob; return c; })
    };
    var json = JSON.stringify(body);
    if (json === lastDraftBody) return;   // 바뀐 게 없으면 그냥 둔다
    lastDraftBody = json;
    var payload = body;
    payload.savedAt = Date.now();
    try { localStorage.setItem(LS.draft, JSON.stringify(payload)); } catch (e) {}
    // 아직 안 올린 파일 본문은 IndexedDB 에 (기록과 같은 방식)
    blocks.forEach(function (b) {
      if ((b.kind === "image" || b.kind === "file") && !b.fileId && b.blob) idbPut(b.id, b.blob);
    });
    showDraftBar(payload.savedAt);
  }
  function clearDraft(silent) {
    var d = safeParse(localStorage.getItem(LS.draft));
    localStorage.removeItem(LS.draft);
    // 저장되지 않고 버려진 임시 파일 정리
    if (d && d.blocks) {
      var keep = {};
      entries.forEach(function (n) { (n.blocks || []).forEach(function (b) { keep[b.id] = 1; }); });
      d.blocks.forEach(function (b) { if (!keep[b.id]) idbDel(b.id); });
    }
    draftDirty = false;
    lastDraftBody = null;
    if (!silent) toast("임시 보관한 내용을 지웠습니다.");
    hideDraftBar();
  }
  function restoreDraft() {
    var d = safeParse(localStorage.getItem(LS.draft));
    if (!d || !d.blocks) return false;
    var hasText = (d.title || "").trim() || (d.tags || "").trim() ||
      d.blocks.some(function (b) { return b.text || b.url || b.name; });
    if (!hasText) { localStorage.removeItem(LS.draft); return false; }

    editingId = d.editingId || null;
    currentType = d.type || currentType;
    $("title").value = d.title || "";
    $("tags").value = d.tags || "";
    blocks = d.blocks.map(cloneBlock);
    if (editingId) {
      $("composerTitle").textContent = "✏️ 기록 편집 (이어 쓰는 중)";
      $("btnSave").textContent = "수정 저장";
      $("btnCancelEdit").classList.remove("hidden");
    }
    renderTypeChips(); renderBlocks();
    // 파일 본문 되살리기
    idbAll().then(function (map) {
      var changed = false;
      blocks.forEach(function (b) {
        if ((b.kind === "image" || b.kind === "file") && !b.fileId && !b.blob && map[b.id] instanceof Blob) {
          b.blob = map[b.id]; changed = true;
        }
      });
      if (changed) renderBlocks();
    });
    draftRestored = true;
    lastDraftBody = null;
    showDraftBar(d.savedAt, true);
    toast("쓰다 만 내용을 되살렸습니다. 이어서 쓰시면 됩니다.");
    return true;
  }

  function showDraftBar(at, restored) {
    var bar = $("draftBar");
    bar.innerHTML = "";
    var t = at ? formatDate(at) : "";
    var txt = el("span", "grow", restored
      ? "⏳ 쓰다 만 내용을 되살렸습니다" + (t ? " (" + t + " 저장)" : "") + " — 이어서 쓰시면 됩니다."
      : "⏳ 임시 보관 중" + (t ? " · " + t : ""));
    bar.appendChild(txt);
    var b2 = el("button", "btn sm", "새로 쓰기");
    b2.title = "지금 쓰던 내용을 버리고 빈 화면으로";
    b2.addEventListener("click", function () {
      if (draftHasContent() && !window.confirm("쓰던 내용을 버리고 새로 시작할까요?")) return;
      clearDraft();
      resetComposer();
    });
    bar.appendChild(b2);
    bar.classList.remove("hidden");
  }
  function hideDraftBar() { $("draftBar").classList.add("hidden"); }

  // 1.5초마다, 그리고 탭을 벗어나거나 닫을 때 저장
  setInterval(function () { if (draftDirty) { draftDirty = false; saveDraft(); } }, 1500);
  window.addEventListener("beforeunload", function () { if (draftDirty) saveDraft(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden && draftDirty) saveDraft(); });
  window.addEventListener("pagehide", function () { if (draftDirty) saveDraft(); });

  /* =========================================================
     9. 저장 / 편집
     ========================================================= */
  function resetComposer() {
    editingId = null;
    currentType = settings.types[0] ? settings.types[0].key : "";
    $("title").value = ""; $("tags").value = "";
    blocks = [];
    renderTypeChips(); renderBlocks();
    $("composerTitle").textContent = "✍️ 새 기록";
    $("btnSave").textContent = "기록 저장";
    $("btnCancelEdit").classList.add("hidden");
  }

  function loadIntoComposer(n) {
    editingId = n.id;
    currentType = n.type;
    $("title").value = n.title || "";
    $("tags").value = (n.tags || []).join(", ");
    blocks = (n.blocks || []).map(cloneBlock);
    renderTypeChips(); renderBlocks();
    $("composerTitle").textContent = "✏️ 기록 편집";
    $("btnSave").textContent = "수정 저장";
    $("btnCancelEdit").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function hasContent() {
    return blocks.some(function (b) {
      if (b.kind === "image" || b.kind === "file") return true;
      if (b.kind === "link") return !!b.url;
      if (b.kind === "embed") return !!(b.code && b.code.trim());
      if (b.kind === "divider") return false;
      return !!(b.text && b.text.trim());
    });
  }

  function saveEntry() {
    var title = $("title").value.trim();
    if (!title && !hasContent()) { toast("제목이나 내용을 입력해 주세요."); return; }

    var now = Date.now(), n;
    if (editingId) {
      n = entries.filter(function (x) { return x.id === editingId; })[0];
      if (!n) { resetComposer(); return; }
      var keep = {}, keepIds = {};
      blocks.forEach(function (b) { if (b.fileId) keep[b.fileId] = 1; keepIds[b.id] = 1; });
      (n.blocks || []).forEach(function (b) {
        if (b.fileId && !keep[b.fileId]) trashFile(b.fileId);
        if (!b.fileId && !keepIds[b.id]) idbDel(b.id);   // 빠진 대기 첨부 정리
      });
    } else {
      n = { id: uid("k_"), createdAt: now };
      entries.unshift(n);
    }

    n.type = currentType;
    n.title = title || "(제목 없음)";
    n.tags = $("tags").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    n.updatedAt = now;
    n._dirty = true;

    // 빈 블록 제거 + 링크 정규화 + 첨부 최종 이름 확정
    var order = 0;
    n.blocks = blocks.filter(function (b) {
      if (b.kind === "divider") return true;
      if (b.kind === "image" || b.kind === "file") return true;
      if (b.kind === "link") return !!(b.url && b.url.trim());
      if (b.kind === "embed") return !!(b.code && b.code.trim());
      return !!(b.text && b.text.trim());
    }).map(function (b) {
      var c = cloneBlock(b);
      if (c.kind === "link" && !/^(https?:|mailto:)/i.test(c.url)) c.url = "https://" + c.url.replace(/^\/+/, "");
      if (c.kind === "image" || c.kind === "file") {
        order++;
        if (!c.name) c.name = attachName(n, order, c.original || "file");
      }
      return c;
    });

    saveLocal();
    localStorage.removeItem(LS.draft);   // 진짜 저장됐으니 임시본은 지운다
    draftDirty = false; lastDraftBody = null;
    hideDraftBar();
    resetComposer();
    render();
    toast(connected ? "저장했습니다. 드라이브에 올리는 중…" : "이 기기에 저장했습니다. (드라이브 미연결)");
    if (connected) syncPending();
  }

  function removeEntry(id) {
    var n = entries.filter(function (x) { return x.id === id; })[0];
    if (!n) return;
    confirmModal("기록을 삭제할까요?",
      "「" + (n.title || "") + "」" + (connected
        ? "\n\n드라이브의 .md 파일과 첨부 자료도 함께 휴지통으로 이동합니다."
        : "\n\n이 기기에서 삭제됩니다."),
      function () {
        if (connected) {
          if (n.folderId) {
            trashFile(n.folderId);        // 기록 폴더째로 (안의 파일도 함께)
          } else {
            trashFile(n.mdId);
            (n.blocks || []).forEach(function (b) { if (b.fileId) trashFile(b.fileId); });
          }
        }
        // 다른 기록이 걸어둔 연결도 정리
        entries.forEach(function (x) {
          if (!x.relations) return;
          var before = x.relations.length;
          x.relations = x.relations.filter(function (r) { return r.to !== id; });
          if (x.relations.length !== before) { x.updatedAt = Date.now(); x._dirty = true; }
        });
        (n.blocks || []).forEach(function (b) { if (!b.fileId) idbDel(b.id); });
        addTomb(id);
        entries = entries.filter(function (x) { return x.id !== id; });
        saveLocal(); render();
        if (connected) saveIndex().catch(function () {});
        if (editingId === id) resetComposer();
        toast("삭제했습니다.");
      });
  }

  /* =========================================================
     10. 목록 렌더
     ========================================================= */
  function loadDriveImage(fileId, imgEl) {
    if (!fileId || !accessToken) return;
    if (imgUrlCache[fileId]) { imgEl.src = imgUrlCache[fileId]; return; }
    driveFetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media&supportsAllDrives=true")
      .then(function (r) { return r.ok ? r.blob() : null; })
      .then(function (b) {
        if (!b) return;
        var u = URL.createObjectURL(b);
        imgUrlCache[fileId] = u;
        imgEl.src = u;
      }).catch(function () {});
  }

  /* ---------- 사진 슬라이드로 크게 보기 ---------- */
  function openLightbox(shots, startAt) {
    if (!shots.length) return;
    var i = Math.max(0, Math.min(startAt || 0, shots.length - 1));
    var box = el("div", "lightbox");

    var top = el("div", "lb-top");
    var count = el("span", "lb-count");
    top.appendChild(count);
    top.appendChild(el("span", "spacer"));
    var openBtn = el("a", "lb-btn", "드라이브에서 열기");
    openBtn.target = "_blank"; openBtn.rel = "noopener noreferrer";
    openBtn.style.textDecoration = "none";
    top.appendChild(openBtn);
    var closeBtn = el("button", "lb-btn", "✕ 닫기");
    top.appendChild(closeBtn);
    box.appendChild(top);

    var stage = el("div", "lb-stage");
    var img = el("img");
    var prev = el("button", "lb-nav prev", "‹");
    var next = el("button", "lb-nav next", "›");
    stage.appendChild(prev); stage.appendChild(img); stage.appendChild(next);
    box.appendChild(stage);

    var cap = el("div", "lb-cap");
    box.appendChild(cap);
    var strip = el("div", "lb-strip");
    box.appendChild(strip);

    shots.forEach(function (s, k) {
      var th = el("img");
      th.addEventListener("click", function () { i = k; show(); });
      strip.appendChild(th);
      if (s.url) th.src = s.url;
      else if (s.fileId) loadDriveImage(s.fileId, th);
    });

    function show() {
      var s = shots[i];
      count.textContent = (i + 1) + " / " + shots.length;
      cap.textContent = [s.caption, s.name].filter(Boolean).join("  ·  ");
      prev.disabled = i === 0;
      next.disabled = i === shots.length - 1;
      img.removeAttribute("src");
      if (s.url) img.src = s.url;
      else if (s.fileId) loadDriveImage(s.fileId, img);
      if (s.fileId) { openBtn.href = driveLink(s.fileId); openBtn.style.display = ""; }
      else openBtn.style.display = "none";
      Array.prototype.forEach.call(strip.children, function (t, k) { t.className = (k === i ? "on" : ""); });
      var on = strip.children[i];
      if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest", inline: "center" });
    }
    function go(d) { var j = i + d; if (j >= 0 && j < shots.length) { i = j; show(); } }
    function close() {
      document.removeEventListener("keydown", key);
      box.remove();
    }
    function key(e) {
      if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
      else if (e.key === "Escape") { e.preventDefault(); close(); }
    }
    prev.addEventListener("click", function () { go(-1); });
    next.addEventListener("click", function () { go(1); });
    closeBtn.addEventListener("click", close);
    box.addEventListener("click", function (e) { if (e.target === box || e.target === stage) close(); });
    document.addEventListener("keydown", key);

    // 손가락으로 넘기기
    var sx = null;
    stage.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
    stage.addEventListener("touchend", function (e) {
      if (sx == null) return;
      var dx = e.changedTouches[0].clientX - sx;
      if (Math.abs(dx) > 45) go(dx < 0 ? 1 : -1);
      sx = null;
    });

    document.body.appendChild(box);
    show();
  }
  // 한 기록 안의 사진들을 슬라이드 목록으로
  function shotsOf(n) {
    return (n.blocks || []).filter(function (b) {
      return b.kind === "image";
    }).map(function (b) {
      return { url: previewUrl(b), fileId: b.fileId, caption: b.caption || "", name: b.name || b.original || "" };
    });
  }

  function renderTypeChips() {
    var host = $("typeChips");
    host.innerHTML = "";
    settings.types.forEach(function (t) {
      var b = el("button", "chip" + (t.key === currentType ? " on" : ""), t.icon + " " + t.label);
      b.type = "button";
      b.addEventListener("click", function () { currentType = t.key; renderTypeChips(); renderBlocks(); });
      host.appendChild(b);
    });
    var add = el("button", "chip", "＋ 유형 만들기");
    add.type = "button";
    add.addEventListener("click", function () { openSettings("types"); });
    host.appendChild(add);
  }

  function renderFilters() {
    var host = $("typeFilters");
    host.innerHTML = "";
    var all = el("button", "chip" + (filterType === "all" ? " on" : ""), "전체 " + entries.length);
    all.type = "button";
    all.addEventListener("click", function () { filterType = "all"; render(); });
    host.appendChild(all);
    settings.types.forEach(function (t) {
      var c = entries.filter(function (n) { return n.type === t.key; }).length;
      if (!c && filterType !== t.key) return;
      var b = el("button", "chip" + (filterType === t.key ? " on" : ""), t.icon + " " + t.label + " " + c);
      b.type = "button";
      b.addEventListener("click", function () { filterType = t.key; render(); });
      host.appendChild(b);
    });
  }

  function entryText(n) {
    return [n.title, (n.tags || []).join(" ")].concat((n.blocks || []).map(function (b) {
      return [b.text, b.url, b.label, b.caption, b.name, b.original].filter(Boolean).join(" ");
    })).join(" ").toLowerCase();
  }
  function matches(n) {
    if (filterType !== "all" && n.type !== filterType) return false;
    if (!searchQ) return true;
    return entryText(n).indexOf(searchQ.toLowerCase()) >= 0;
  }

  /* 삽입 코드는 격리된 틀(sandbox iframe) 안에서 보여 준다.
     allow-same-origin 을 주지 않아, 코드가 이 앱의 데이터나 로그인 정보에 손댈 수 없다. */
  function embedFrame(b) {
    var f = el("iframe", "embedframe");
    f.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox allow-presentation allow-forms");
    f.setAttribute("referrerpolicy", "no-referrer");
    f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture; fullscreen";
    f.setAttribute("allowfullscreen", "");
    f.style.height = (b.height || 360) + "px";
    f.srcdoc = "<!doctype html><meta charset='utf-8'>" +
      "<style>html,body{margin:0;padding:0;background:transparent;font-family:system-ui,sans-serif}" +
      "iframe,img,video{max-width:100%;border:0}*{box-sizing:border-box}</style>" +
      (b.code || "");
    return f;
  }

  function isVideo(b) { return /^video\//.test(b.mime || ""); }
  function isAudio(b) { return /^audio\//.test(b.mime || ""); }

  // 드라이브에 올라간 영상은 구글 미리보기 틀로 재생 (통째로 내려받지 않음)
  function drivePlayer(b) {
    var wrap = el("div");
    var btn = el("button", "playbtn");
    btn.appendChild(el("span", "pi", isAudio(b) ? "🎵" : "▶"));
    var t = el("span");
    t.appendChild(document.createTextNode(b.caption || b.name || b.original || "재생"));
    t.appendChild(el("small", null, humanSize(b.size) + " · 눌러서 재생"));
    btn.appendChild(t);
    btn.addEventListener("click", function () {
      var f = el("iframe", "driveframe");
      f.src = "https://drive.google.com/file/d/" + b.fileId + "/preview";
      f.allow = "autoplay";
      f.setAttribute("allowfullscreen", "");
      if (isAudio(b)) f.style.aspectRatio = "auto", f.style.height = "70px";
      wrap.innerHTML = "";
      wrap.appendChild(f);
    });
    wrap.appendChild(btn);
    return wrap;
  }

  function renderContent(n, host) {
    var imgCount = 0;
    var shots = shotsOf(n);
    var shotIndex = 0;
    var blocks = n.blocks || [];

    // 연달아 놓인 사진은 슬라이드 묶음으로 보여 준다
    var groups = [], run = null;
    blocks.forEach(function (b) {
      if (b.kind === "image") {
        if (!run) { run = { kind: "images", items: [] }; groups.push(run); }
        run.items.push(b);
      } else { run = null; groups.push({ kind: "one", block: b }); }
    });

    groups.forEach(function (g) {
      if (g.kind === "images" && g.items.length > 1) {
        var gal = el("div", "gallery");
        var SHOWN = 8;
        g.items.slice(0, SHOWN).forEach(function (b, k) {
          var at = shotIndex + k;
          var bt = el("button");
          bt.type = "button";
          var im = el("img");
          im.loading = "lazy";
          var u = previewUrl(b);
          if (u) im.src = u;
          else if (b.fileId && imgCount < THUMB_LIMIT) { imgCount++; loadDriveImage(b.fileId, im); }
          bt.appendChild(im);
          if (k === SHOWN - 1 && g.items.length > SHOWN) {
            bt.appendChild(el("span", "more", "+" + (g.items.length - SHOWN)));
          }
          bt.addEventListener("click", function () { openLightbox(shots, at); });
          gal.appendChild(bt);
        });
        host.appendChild(gal);
        host.appendChild(el("div", "galcap", "🖼️ 사진 " + g.items.length + "장 — 누르면 슬라이드로 넘겨 볼 수 있습니다"));
        shotIndex += g.items.length;
        return;
      }
      var b = g.kind === "images" ? g.items[0] : g.block;
      if (g.kind === "images") { renderOne(b, shotIndex); shotIndex += 1; }
      else renderOne(b, -1);
    });

    function renderOne(b, shotAt) {
      if (b.kind === "text") {
        var p = el("p"); appendRichText(p, b.text); host.appendChild(p);
      } else if (b.kind === "heading") {
        var h = el("h4"); appendRichText(h, b.text); host.appendChild(h);
      } else if (b.kind === "quote") {
        var q = el("blockquote"); appendRichText(q, b.text); host.appendChild(q);
      } else if (b.kind === "divider") {
        host.appendChild(el("hr"));
      } else if (b.kind === "image") {
        var fig = el("figure");
        var img = el("img");
        img.alt = b.caption || b.original || "";
        img.loading = "lazy";
        img.style.cursor = "zoom-in";
        var pvu = previewUrl(b);
        if (pvu) img.src = pvu;
        else if (b.fileId && imgCount < THUMB_LIMIT) { imgCount++; loadDriveImage(b.fileId, img); }
        img.addEventListener("click", function () { openLightbox(shots, shotAt < 0 ? 0 : shotAt); });
        fig.appendChild(img);
        var capText = (b.caption || "") + (b.name ? (b.caption ? " · " : "") + b.name : "");
        if (capText) fig.appendChild(el("figcaption", null, capText));
        host.appendChild(fig);

      } else if (b.kind === "file" && (isVideo(b) || isAudio(b))) {
        // 영상·소리는 바로 재생할 수 있게
        var pv = previewUrl(b);
        if (pv) {
          var media = el(isVideo(b) ? "video" : "audio");
          media.src = pv;
          media.controls = true;
          media.preload = "metadata";
          var wm = el("div");
          wm.appendChild(media);
          var cp = (b.caption || b.name || b.original) + " · " + humanSize(b.size) + " · 업로드 대기";
          wm.appendChild(el("figcaption", null, cp));
          host.appendChild(wm);
        } else if (b.fileId) {
          host.appendChild(drivePlayer(b));
        }

      } else if (b.kind === "file") {
        var a = el("a", "fileline", fileIcon(b.mime, b.name) + " " + (b.caption || b.name || b.original) +
          (b.fileId ? "" : " · 업로드 대기"));
        if (b.fileId) { a.href = driveLink(b.fileId); a.target = "_blank"; a.rel = "noopener noreferrer"; }
        else a.href = "javascript:void(0)";
        var w1 = el("div"); w1.appendChild(a); host.appendChild(w1);

      } else if (b.kind === "link") {
        var la = el("a", "linkline", "🔗 " + (b.label || b.url));
        la.href = b.url; la.target = "_blank"; la.rel = "noopener noreferrer";
        var w2 = el("div"); w2.appendChild(la); host.appendChild(w2);

      } else if (b.kind === "embed") {
        if (b.code && b.code.trim()) host.appendChild(embedFrame(b));
      }
    }
  }

  function renderViewSwitch() {
    var host = $("viewSwitch");
    host.innerHTML = "";
    VIEW_MODES.forEach(function (v) {
      var b = el("button", "vbtn" + (settings.viewMode === v.key ? " on" : ""), v.icon + " " + v.label);
      b.type = "button";
      b.title = v.desc;
      b.addEventListener("click", function () {
        settings.viewMode = v.key;
        saveSettingsLocal();
        render();
        saveSettingsRemote();
      });
      host.appendChild(b);
    });
  }

  function render() {
    invalidateLinks();
    renderFilters();
    renderViewSwitch();
    var host = $("list");
    host.innerHTML = "";
    host.className = "";
    var shown = entries.filter(matches);
    $("countText").textContent = entries.length
      ? (shown.length === entries.length ? entries.length + "개" : shown.length + " / " + entries.length + "개") : "";

    if (!shown.length) {
      var e = el("div", "empty");
      if (entries.length) { e.appendChild(el("span", "big", "🔍")); e.appendChild(document.createTextNode("조건에 맞는 기록이 없습니다.")); }
      else {
        e.appendChild(el("span", "big", "🌱"));
        e.appendChild(document.createTextNode("첫 기록을 남겨 보세요."));
        e.appendChild(el("div", "desc", "글은 마크다운(.md)으로, 사진·파일은 정리된 이름으로 드라이브에 쌓입니다."));
      }
      host.appendChild(e);
      return;
    }

    // ---- 목록식: 제목만 한 줄씩 ----
    if (settings.viewMode === "list") {
      var table = el("div", "card listview");
      shown.forEach(function (n) {
        var t = typeOf(n.type);
        var row = el("div", "lrow");
        row.setAttribute("data-eid", n.id);
        row.appendChild(el("span", "lico", t.icon));
        var ttl = el("button", "ltitle", n.title || "(제목 없음)");
        ttl.addEventListener("click", function () { settings.viewMode = "stream"; saveSettingsLocal(); expanded[n.id] = true; render(); gotoEntry(n.id); });
        row.appendChild(ttl);
        var outs = outLinks(n).filter(function (l) { return l.to; }).length;
        var ins = backLinks(n).length;
        if (outs || ins) row.appendChild(el("span", "lmeta", "🔗 " + outs + "/" + ins));
        var att = (n.blocks || []).filter(function (b) { return b.kind === "image" || b.kind === "file"; }).length;
        if (att) row.appendChild(el("span", "lmeta", "📎 " + att));
        row.appendChild(el("span", "lwhen", formatDate(n.createdAt).slice(0, 10)));
        var bd = el("button", "btn xs danger", "✕");
        bd.addEventListener("click", function () { removeEntry(n.id); });
        row.appendChild(bd);
        table.appendChild(row);
      });
      host.appendChild(table);
      return;
    }

    if (settings.viewMode === "grid") host.className = "gridview";
    else host.className = "";

    shown.forEach(function (n) {
      var t = typeOf(n.type);
      var card = el("article", "card entry");
      card.setAttribute("data-eid", n.id);

      var head = el("div", "head");
      head.appendChild(el("span", "badge", t.icon + " " + t.label));
      head.appendChild(el("h3", null, n.title));
      head.appendChild(el("span", "when", formatDate(n.createdAt)));
      card.appendChild(head);

  /* =========================================================
     11-8. 폴더에서 가져오기 — 색인에 없는 .md 를 찾아 목록에 넣는다
     ========================================================= */
  function listChildren(parentId) {
    var q = "'" + parentId + "' in parents and trashed=false";
    return driveJson("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
      "&fields=files(id,name,mimeType,size,createdTime,modifiedTime)&pageSize=1000" +
      "&supportsAllDrives=true&includeItemsFromAllDrives=true")
      .then(function (j) { return j.files || []; })
      .catch(function () { return []; });
  }
  // 폴더와 그 바로 아래 하위 폴더까지 훑는다
  function scanFolder() {
    return listChildren(folder.id).then(function (top) {
      var subs = top.filter(function (f) { return f.mimeType === "application/vnd.google-apps.folder"; });
      var files = top.filter(function (f) { return f.mimeType !== "application/vnd.google-apps.folder"; })
        .map(function (f) { f._parent = folder.id; f._parentName = folder.name; return f; });
      return subs.reduce(function (p, s) {
        return p.then(function () {
          return listChildren(s.id).then(function (kids) {
            kids.forEach(function (k) {
              if (k.mimeType === "application/vnd.google-apps.folder") return;
              k._parent = s.id; k._parentName = s.name;
              files.push(k);
            });
          });
        });
      }, Promise.resolve()).then(function () { return files; });
    });
  }
  function fetchText(id) {
    return driveFetch("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media&supportsAllDrives=true")
      .then(function (r) { return r.ok ? r.text() : ""; })
      .catch(function () { return ""; });
  }
  function unquote(s) {
    s = String(s || "").trim();
    if (/^".*"$/.test(s) || /^'.*'$/.test(s)) return s.slice(1, -1).replace(/\\"/g, '"');
    return s;
  }
  function parseFrontMatter(text) {
    var fm = {}, body = text;
    var m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(text);
    if (m) {
      body = text.slice(m[0].length);
      m[1].split(/\r?\n/).forEach(function (line) {
        var mm = /^([A-Za-z_][\w-]*):\s*(.*)$/.exec(line);
        if (mm) fm[mm[1]] = mm[2].trim();
      });
    }
    return { fm: fm, body: body };
  }
  function parseListValue(v) {
    v = String(v || "").trim();
    if (!/^\[/.test(v)) return v ? [unquote(v)] : [];
    return v.replace(/^\[|\]$/g, "").split(",").map(function (s) { return unquote(s); }).filter(Boolean);
  }
  // 마크다운 본문을 블록으로 되돌린다
  function bodyToBlocks(body, siblings) {
    var out = [], buf = [];
    function flush() {
      var t = buf.join("\n").trim();
      if (t) out.push(newBlock("text", { text: t }));
      buf = [];
    }
    function findSibling(name) {
      var base = String(name || "").split("/").pop().replace(/^<|>$/g, "");
      for (var i = 0; i < siblings.length; i++) if (siblings[i].name === base) return siblings[i];
      return null;
    }
    body.split(/\r?\n/).forEach(function (line) {
      var m;
      if (/^#\s+/.test(line)) { flush(); return; }              // 제목은 이미 title 로
      if ((m = /^##\s+(.*)$/.exec(line))) { flush(); out.push(newBlock("heading", { text: m[1].trim() })); return; }
      if (/^\s*---\s*$/.test(line)) { flush(); out.push(newBlock("divider")); return; }
      if ((m = /^>\s?(.*)$/.exec(line))) {
        var last = out[out.length - 1];
        if (buf.length) flush();
        if (last && last.kind === "quote") last.text += "\n" + m[1];
        else out.push(newBlock("quote", { text: m[1] }));
        return;
      }
      if ((m = /^!\[([^\]]*)\]\(<?([^)>]+)>?\)\s*$/.exec(line))) {
        flush();
        var sf = findSibling(m[2]);
        out.push(newBlock("image", {
          caption: m[1] || "", original: (m[2].split("/").pop() || "").replace(/^<|>$/g, ""),
          name: sf ? sf.name : (m[2].split("/").pop() || ""),
          mime: sf ? sf.mimeType : "image/png", size: sf ? Number(sf.size || 0) : 0,
          fileId: sf ? sf.id : null
        }));
        return;
      }
      if ((m = /^📎\s*\[([^\]]*)\]\(([^)]+)\)/.exec(line))) {
        flush();
        var fid = /\/file\/d\/([\w-]+)/.exec(m[2]);
        var sf2 = fid ? null : findSibling(m[2]);
        out.push(newBlock("file", {
          caption: "", original: m[1], name: sf2 ? sf2.name : m[1],
          mime: sf2 ? sf2.mimeType : "application/octet-stream",
          size: sf2 ? Number(sf2.size || 0) : 0,
          fileId: fid ? fid[1] : (sf2 ? sf2.id : null)
        }));
        return;
      }
      if ((m = /^🔗\s*\[([^\]]*)\]\(([^)]+)\)/.exec(line))) {
        flush(); out.push(newBlock("link", { url: m[2], label: m[1] })); return;
      }
      if (/^\s*<(iframe|embed|video|div)\b/i.test(line)) {
        flush(); out.push(newBlock("embed", { code: line.trim(), height: 360 })); return;
      }
      if (/^##\s*연결\s*$/.test(line)) { flush(); return; }
      buf.push(line);
    });
    flush();
    return out;
  }

  function importFromFolder(status) {
    if (!connected || !folder.id) { toast("먼저 드라이브에 연결해 주세요."); return Promise.resolve(0); }
    var known = {};
    entries.forEach(function (n) {
      if (n.mdId) known[n.mdId] = 1;
      if (n.docId) known[n.docId] = 1;
      if (n.htmlId) known[n.htmlId] = 1;
      (n.blocks || []).forEach(function (b) { if (b.fileId) known[b.fileId] = 1; });
    });
    var byEntryId = {};
    entries.forEach(function (n) { byEntryId[n.id] = 1; });

    if (status) status.textContent = "폴더를 훑는 중…";
    return scanFolder().then(function (files) {
      var mds = files.filter(function (f) {
        return !known[f.id] && /\.md$/i.test(f.name || "");
      });
      if (!mds.length) { if (status) status.textContent = "새로 가져올 .md 파일이 없습니다."; return 0; }
      if (status) status.textContent = mds.length + "개를 읽는 중…";

      var added = 0, skipped = 0;
      return mds.reduce(function (p, f) {
        return p.then(function () {
          return fetchText(f.id).then(function (text) {
            if (!text) { skipped++; return; }
            var parsed = parseFrontMatter(text);
            var fm = parsed.fm;
            if (fm.id && byEntryId[fm.id]) { skipped++; return; }  // 이미 있는 기록

            var title = unquote(fm.title) ||
              (/^#\s+(.*)$/m.exec(parsed.body) || [])[1] ||
              stemOf(f.name);
            var typeKey = settings.types[0] ? settings.types[0].key : "";
            var wanted = unquote(fm.type);
            settings.types.forEach(function (t) { if (t.label === wanted) typeKey = t.key; });

            var siblings = files.filter(function (x) { return x._parent === f._parent && x.id !== f.id; });
            var created = Date.parse(fm.created || f.createdTime) || Date.now();
            var updated = Date.parse(fm.updated || f.modifiedTime) || created;

            var n = {
              id: fm.id && !byEntryId[fm.id] ? fm.id : uid("k_"),
              type: typeKey,
              title: title,
              tags: parseListValue(fm.tags),
              blocks: bodyToBlocks(parsed.body, siblings),
              relations: [],
              createdAt: created,
              updatedAt: updated,
              mdId: f.id,
              mdName: f.name,
              folderId: (f._parent !== folder.id) ? f._parent : null,
              folderName: (f._parent !== folder.id) ? f._parentName : null,
              _imported: true
            };
            byEntryId[n.id] = 1;
            entries.push(n);
            added++;
          });
        });
      }, Promise.resolve()).then(function () {
        if (!added) { if (status) status.textContent = "새로 가져올 것이 없습니다. (건너뜀 " + skipped + ")"; return 0; }
        entries.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
        invalidateLinks(); saveLocal(); render();
        if (status) status.textContent = added + "개를 가져와 색인에 넣었습니다.";
        return saveIndex().then(function () { return added; });
      });
    }).catch(function (e) {
      if (status) status.textContent = "가져오기 실패: " + e.message;
      return 0;
    });
  }

  function appUrl() { return location.origin + location.pathname; }
  function bookmarkletCode() {
    return "javascript:(function(){" +
      "var s=(window.getSelection?String(window.getSelection()):'')||'';" +
      "function m(n){var e=document.querySelector('meta[property=\"'+n+'\"],meta[name=\"'+n+'\"]');return e?e.content:'';}" +
      "var o={t:document.title,u:location.href,s:s.slice(0,5000),d:m('og:description')||m('description'),i:m('og:image')};" +
      "var q=encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(o)))));" +
      "window.open('" + appUrl() + "#clip='+q,'_blank');" +
      "})()";
  }
  function hostOf(u) {

  // 주소창 #clip=... 을 읽어 작성 화면에 채워 넣는다
  function consumeClipHash() {
    var m = /[#&]clip=([^&]+)/.exec(location.hash || "");
    if (!m) return false;
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    var data;
    try { data = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); }
    catch (e) { toast("클리핑 내용을 읽지 못했습니다."); return false; }
    fillFromClip(data);
    return true;
  }

        var ang = i * 2.399, rad = 30 + 14 * Math.sqrt(i);

          id: n.id, kind: "entry", label: n.title || "(제목 없음)", color: typeColor(n.type),
          x: p ? p.x : w / 2 + Math.cos(ang) * rad,

        nodes.push(node); byId[n.id] = node;
      });
      // 글 속 [[링크]] + 관계망에서 이어준 연결
      entries.forEach(function (n) {
        (ld.out[n.id] || []).forEach(function (l) {
          if (!l.to || l.to === n.id || !byId[l.to]) return;
          edges.push({ a: byId[n.id], b: byId[l.to], kind: "link", label: l.label || "", via: l.via });
          byId[n.id].deg++; byId[l.to].deg++;
        });
      });
      // 태그를 통한 연결
      if (showTags) {
        var tagMap = {};
        entries.forEach(function (n) {
          (n.tags || []).forEach(function (t) {
            var k = "#" + normTitle(t);

          });
        });
        Object.keys(tagMap).forEach(function (k) {
          var g = tagMap[k];

          var tn = {

          };

        (showTags ? " · 태그 연결 " + (edges.length - linkCount) + "개" : "");

    /* ---- 물리 계산 ---- */
    function tick() {
      var w = canvas.clientWidth, h = canvas.clientHeight, cx = w / 2, cy = h / 2;

          if (d2 > 160000) continue;
          f = 2600 / d2;
          d = Math.sqrt(d2);

          b.vx += f * dx / d; b.vy += f * dy / d;

      edges.forEach(function (e) {

        n.x += Math.max(-12, Math.min(12, n.vx * heat));

    }

    /* ---- 그리기 ---- */
    var scale = 1, panX = 0, panY = 0, dragNode = null, panning = false;
    var lastPt = null, downPt = null, moved = 0;

    // 캔버스 픽셀 크기가 화면 크기와 어긋나면 그림이 눌리고 클릭 위치도 틀어진다
    function resize() {
      var dpr = window.devicePixelRatio || 1;
      var w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
      if (!w || !h) return false;
      if (canvas.width === w && canvas.height === h) return false;

    }
    function draw() {
      resize();   // 모달 크기가 뒤늦게 잡히는 경우까지 매 프레임 확인
      var dpr = window.devicePixelRatio || 1;
      var ctx = canvas.getContext("2d");
      var css = getComputedStyle(document.body);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      ctx.translate(panX, panY);
      ctx.scale(scale, scale);

      var q = normTitle(query);
      var hi = {};
      if (q) nodes.forEach(function (n) { if (normTitle(n.label).indexOf(q) >= 0) hi[n.id] = 1; });

      function radiusOf(n) { return (n.kind === "tag" ? 4 : 6) + Math.min(9, n.deg * 1.3); }
      // 선택한 점과 이웃을 강조
      var near = {};
      if (selected) {
        near[selected.id] = 1;
        edges.forEach(function (e) {
          if (e.a.id === selected.id) near[e.b.id] = 1;
          if (e.b.id === selected.id) near[e.a.id] = 1;
        });
      }

      edges.forEach(function (e) {
        var touched = selected && (e.a.id === selected.id || e.b.id === selected.id);
        var dim = (q && !hi[e.a.id] && !hi[e.b.id]) || (selected && !touched);

    function makePatternField(labelText, key, presets, isMd) {
      var f = el("div", "field");
      f.appendChild(el("label", null, labelText));
      var sel = el("select", "inp");
      presets.forEach(function (p) {
        var o = el("option", null, p + "   →   " + patternPreview(p, isMd));
        o.value = p; sel.appendChild(o);
      });
      var custom = el("option", null, "직접 만들기…"); custom.value = "__custom__";
      sel.appendChild(custom);

      var ci = el("input", "inp"); ci.style.marginTop = "8px"; ci.placeholder = "예: {날짜}_{유형}_{제목}_{번호}";
      var pv = el("div", "preview");
      var tk = el("div", "tokens");
      TOKENS.forEach(function (t) {
        var b = el("button", "token", t); b.type = "button";
        b.addEventListener("click", function () {
          ci.classList.remove("hidden"); sel.value = "__custom__";
          ci.value = (ci.value || draft[key]) + t;
          draft[key] = ci.value; refresh();
        });
        tk.appendChild(b);
      });

      function refresh() {
        // 폴더 연결 전에는 {폴더명} 자리가 예시라는 걸 분명히 밝힌다
        var hint = (!folder.name && draft[key].indexOf("{폴더명}") >= 0) ? "   ← 폴더 연결 전이라 예시 이름" : "";
        pv.textContent = "미리보기:  " + patternPreview(draft[key], isMd) + hint;
      }

      if (presets.indexOf(draft[key]) >= 0) { sel.value = draft[key]; ci.classList.add("hidden"); }
      else { sel.value = "__custom__"; ci.value = draft[key]; }

      sel.addEventListener("change", function () {
        if (sel.value === "__custom__") { ci.classList.remove("hidden"); ci.value = draft[key]; ci.focus(); }
        else { ci.classList.add("hidden"); draft[key] = sel.value; }
        refresh();
      });
      ci.addEventListener("input", function () { draft[key] = ci.value; refresh(); });

      f.appendChild(sel); f.appendChild(ci); f.appendChild(tk); f.appendChild(pv);
      refresh();
      return f;
    }

    function paintClipper() {

       "담고 싶은 웹페이지에서 필요한 부분을 마우스로 선택합니다. (선택 안 해도 됩니다)",
       "북마크바의 «웹 클리퍼» 를 누르면 이 앱이 새 탭에 열리며 제목·주소·선택한 글이 채워집니다.",

  /* =========================================================
     13. 이벤트
     ========================================================= */
  $("btnSettings").addEventListener("click", function () { openSettings("storage"); });
  $("btnGraph").addEventListener("click", openGraph);
  $("btnHelp").addEventListener("click", function () { openHelp("link"); });
  $("btnLogin").addEventListener("click", function () {
    if (connected) { autoSync(true).then(function () { toast("동기화했습니다."); }); return; }
    if (folder.id) { connect(""); return; }
    requestToken(true).then(ensureAccount).then(function () {
      updateChrome(); openSettings("storage"); toast("로그인 완료. 저장할 폴더를 지정해 주세요.");
    }).catch(function (e) { toast("로그인 실패: " + e.message); });
  });

  Array.prototype.forEach.call($("addbar").querySelectorAll("[data-add]"), function (b) {
    b.addEventListener("click", function () { addBlock(b.getAttribute("data-add")); });
  });
  $("fileInput").addEventListener("change", function (e) { acceptFiles(e.target.files); e.target.value = ""; });
  $("imgInput").addEventListener("change", function (e) { acceptFiles(e.target.files); e.target.value = ""; });
  $("cropPickInput").addEventListener("change", function (e) { handlePickedImage(e.target.files[0]); e.target.value = ""; });

  // 화면 아무 데서나 Ctrl+V 로 이미지 붙여넣기 (글 칸에 커서가 없어도)
  document.addEventListener("paste", function (e) {
    var t = e.target;
    if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT")) return;  // 글 칸은 각자 처리
    if (modalEl) return;
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file") { var f = items[i].getAsFile(); if (f) files.push(f); }
    }
    if (!files.length) return;
    e.preventDefault();
    acceptFiles(files);
  });

  // 화면 어디에 놓아도 첨부되도록 (파일을 끌어올 때만 반응)
  var dragDepth = 0;
  function draggingFiles(e) {
    var t = e.dataTransfer && e.dataTransfer.types;
    if (!t) return false;
    for (var i = 0; i < t.length; i++) if (t[i] === "Files") return true;
    return false;
  }
  function showDrop(on) {
    $("dropOverlay").classList.toggle("hidden", !on);
    $("addbar").classList.toggle("hover", on);
  }
  window.addEventListener("dragenter", function (e) {
    if (!draggingFiles(e)) return;
    e.preventDefault(); dragDepth++; showDrop(true);
  });
  window.addEventListener("dragover", function (e) {
    if (!draggingFiles(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
  });
  window.addEventListener("dragleave", function (e) {
    if (!draggingFiles(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) showDrop(false);
  });
  window.addEventListener("drop", function (e) {
    dragDepth = 0; showDrop(false);
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    acceptFiles(e.dataTransfer.files);
  });

  $("title").addEventListener("input", function () {
    if (blocks.some(function (b) { return (b.kind === "image" || b.kind === "file") && !b.name; })) renderBlocks();
  });
  // 무엇을 고치든 임시저장 대상으로 표시
  $("blocks").addEventListener("input", touchDraft);
  $("title").addEventListener("input", touchDraft);
  $("tags").addEventListener("input", touchDraft);
  $("typeChips").addEventListener("click", touchDraft);

  $("btnSave").addEventListener("click", saveEntry);
  $("btnCancelEdit").addEventListener("click", function () { clearDraft(true); resetComposer(); });
  $("search").addEventListener("input", function () { searchQ = this.value.trim(); render(); });
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); saveEntry(); }
    if (e.key === "Escape" && modalEl) closeModal();
  });

  /* ---------- 모바일 ↔ PC 자동 동기화 ----------
     휴대폰에서 쓰고 PC로 돌아오면(=탭이 다시 보이면) 알아서 최신을 끌어옵니다. */
  var lastSyncAt = 0, syncing = false;
  function setSyncPill(text, busy) {
    var p = $("syncPill");
    p.textContent = text || "";
    p.className = "syncpill" + (busy ? " busy" : "");
  }
  function syncedAgo() {
    if (!connected) return "";
    if (!lastSyncAt) return "";
    var s = Math.round((Date.now() - lastSyncAt) / 1000);
    if (s < 60) return "☁ 방금 동기화";
    if (s < 3600) return "☁ " + Math.round(s / 60) + "분 전 동기화";
    return "☁ " + Math.round(s / 3600) + "시간 전 동기화";
  }
  function autoSync(force) {
    if (!connected || syncing) return Promise.resolve();
    if (!force && Date.now() - lastSyncAt < 20000) return Promise.resolve();
    if (!navigator.onLine) { setSyncPill("⚠ 오프라인"); return Promise.resolve(); }
    syncing = true;
    setSyncPill("↻ 동기화 중…", true);
    return loadIndex()
      .then(function (remote) {
        absorbIndex(remote);
        saveLocal(); render();
        return syncPending();
      })
      .then(function () {
        lastSyncAt = Date.now(); syncing = false; setSyncPill(syncedAgo());
      })
      .catch(function () {
        syncing = false; setSyncPill("⚠ 동기화 실패");
      });
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) autoSync(); });
  window.addEventListener("focus", function () { autoSync(); });
  window.addEventListener("online", function () { autoSync(true); });
  setInterval(function () { if (!syncing) setSyncPill(syncedAgo()); }, 30000);

  /* =========================================================
     14. 시작
     ========================================================= */
  renderTypeChips();
  renderBlocks();
  render();
  updateChrome();
  rehydratePending();   // 지난번에 못 올린 사진·파일 되살리기
  // 웹 클리퍼로 들어온 게 있으면 그걸 우선, 없으면 쓰다 만 내용을 되살린다
  if (!consumeClipHash()) restoreDraft();
  window.addEventListener("hashchange", consumeClipHash);

  // 기기에 맞는 버튼 이름
  (function () {
    var b = document.querySelector('[data-add="capture"]');
    if (b && isTouchDevice()) b.textContent = "📸 캡처·촬영";
  })();

  if (clientId && folder.id && localStorage.getItem(LS.connected) === "1") {
    var wait = setInterval(function () {
      if (!gisReady()) return;
      clearInterval(wait);
      requestToken(false).then(ensureAccount)
        .then(function () { return verifyFolder(folder.id); })
        .then(function (f) {
          folder = { id: f.id, name: f.name, link: f.link };
          connected = true; updateChrome();
          return loadSettingsRemote();
        })
        .then(function (rs) {
          if (rs) { settings = normalizeSettings(rs); saveSettingsLocal(); renderTypeChips(); }
          return loadIndex();
        })
        .then(function (remote) {
          absorbIndex(remote);
          saveLocal(); render(); updateChrome();
          return syncPending();
        })
        .then(function () { lastSyncAt = Date.now(); setSyncPill(syncedAgo()); })
        .catch(function () { /* 조용히 실패 — 사용자가 버튼으로 연결 */ });
    }, 300);
    setTimeout(function () { clearInterval(wait); }, 8000);
  }
})();
</script>
