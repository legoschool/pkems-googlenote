      row.appendChild(cb);
      row.appendChild(el("span", "pico", t.icon));
      row.appendChild(el("span", "pttl", n.title || "(제목 없음)"));
      var links = outLinks(n).filter(function (l) { return l.to; }).length + backLinks(n).length;
      if (links) row.appendChild(el("span", "pmeta", "🔗 " + links));
      // createdAt 은 숫자(epoch)다. .slice() 를 부르면 여기서 터지고,
      // 그러면 아래 modalHost.appendChild 까지 못 가서 «눌러도 아무 일이 없는» 것처럼 보인다.
      row.appendChild(el("span", "pmeta", localDay(n.createdAt)));
      row.__cb = cb; row.__id = n.id;
      listBox.appendChild(row);
    });
    f2.appendChild(listBox);
    body.appendChild(f2);

    // 옵션
    var f3 = el("div", "field");
    f3.appendChild(el("label", null, "묶는 방법"));
    function optRow(checked, text, hint) {
      var r = el("label", "optrow");
      var c = el("input"); c.type = "checkbox"; c.checked = checked;
      r.appendChild(c);
      var w = el("span");
      w.appendChild(el("b", null, text));
      if (hint) w.appendChild(el("small", null, hint));
      r.appendChild(w);
      f3.appendChild(r);
      return c;
    }
    var cWiden = optRow(false, "연결된 기록도 함께 담기",
      "고른 기록에서 [[링크]]·관계망·백링크로 이어진 기록을 한 단계 더 넣습니다");
    var cToc = optRow(true, "목차 넣기", "번호를 눌러 그 자리로 바로 갑니다");
    var cLinks = optRow(true, "연결 정보 함께 적기", "각 편 끝에 «나감 / 들어옴» 을 적습니다");

    var r4 = el("div", "row"); r4.style.marginTop = "8px";
    r4.appendChild(el("span", "desc", "순서"));
    var sel = el("select", "inp"); sel.style.width = "auto";
    [["old", "오래된 것부터 (시간 순)"], ["new", "최근 것부터"], ["title", "제목 순"]].forEach(function (o) {
      var op = document.createElement("option"); op.value = o[0]; op.textContent = o[1]; sel.appendChild(op);
    });
    r4.appendChild(sel);
    f3.appendChild(r4);
    body.appendChild(f3);
    m.appendChild(body);

    var foot = el("div", "mfoot");
    var status = el("span", "desc"); status.style.margin = "0";
    foot.appendChild(status);
    foot.appendChild(el("span", "spacer"));
    var mdBtn = el("button", "btn", "⬇ .md");
    var htmlBtn = el("button", "btn primary", "⬇ .html");
    foot.appendChild(mdBtn); foot.appendChild(htmlBtn);
    m.appendChild(foot);

    bg.appendChild(m);
    bg.addEventListener("click", function (e) { if (e.target === bg) closeModal(); });
    $("modalHost").appendChild(bg);
    modalEl = bg;

    function paintCount() {
      var k = pool.filter(function (n) { return picked[n.id]; }).length;
      cnt.textContent = k + " / " + pool.length + " 편 선택";
    }
    allBtn.addEventListener("click", function () {
      pool.forEach(function (n) { picked[n.id] = true; });
      Array.prototype.forEach.call(listBox.children, function (r) { r.__cb.checked = true; });
      paintCount();
    });
    noneBtn.addEventListener("click", function () {
      pool.forEach(function (n) { picked[n.id] = false; });
      Array.prototype.forEach.call(listBox.children, function (r) { r.__cb.checked = false; });
      paintCount();
    });
    paintCount();

    function gather() {
      var ids = pool.filter(function (n) { return picked[n.id]; }).map(function (n) { return n.id; });
      if (!ids.length) { toast("담을 기록을 하나 이상 골라 주세요."); return null; }
      var list = cWiden.checked ? widenByLinks(ids, 1)
        : ids.map(function (id) { return entries.filter(function (n) { return n.id === id; })[0]; }).filter(Boolean);
      return {
        list: sortForBook(list, sel.value),
        opt: { title: tin.value.trim() || "기록 모음", toc: cToc.checked, links: cLinks.checked }
      };
    }
    function fileStem(o, list) {
      return safeName(o.title, 60) + "_" + list.length + "편_" + dateStamp();
    }

    mdBtn.addEventListener("click", function () {
      var g = gather(); if (!g) return;
      downloadText(fileStem(g.opt, g.list) + ".md", "text/markdown", compileMarkdown(g.list, g.opt));
      status.textContent = g.list.length + "편을 .md 로 내려받았습니다.";
    });
    htmlBtn.addEventListener("click", function () {
      var g = gather(); if (!g) return;
      downloadText(fileStem(g.opt, g.list) + ".html", "text/html", compileHtml(g.list, g.opt));
      status.textContent = g.list.length + "편을 .html 로 내려받았습니다.";
    });
  }

  function renderViewSwitch() {
    var host = $("viewSwitch");
    host.innerHTML = "";
    VIEW_MODES.forEach(function (v) {
      var b = el("button", "vbtn" + (settings.viewMode === v.key ? " on" : ""), v.icon + " " + v.label);
      b.type = "button";
      b.title = v.desc;
      b.addEventListener("click", function () {
        settings.viewMode = v.key;
        saveSettingsLocal();
        render();
        saveSettingsRemote();
      });
      host.appendChild(b);
    });
  }

  // 📌 고정 — 목록 맨 위로 올린다
  function togglePin(n) {
    n.pinned = !n.pinned;
    saveLocal();
    render();
    toast(n.pinned ? "맨 위에 고정했습니다." : "고정을 풀었습니다.");
    if (connected) saveIndex().catch(function () {});
  }

  function render() {
    invalidateLinks();
    renderFilters();
    renderViewSwitch();
    var host = $("list");
    host.innerHTML = "";
    host.className = "";
    var shown = entries.filter(matches);
    // 고정한 기록을 맨 위로. 나머지 순서(최신순)는 그대로 둔다
    shown.sort(function (a, b) { return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0); });
    $("countText").textContent = entries.length
      ? (shown.length === entries.length ? entries.length + "개" : shown.length + " / " + entries.length + "개") : "";

    if (!shown.length) {
      var e = el("div", "empty");
      if (entries.length) { e.appendChild(el("span", "big", "🔍")); e.appendChild(document.createTextNode("조건에 맞는 기록이 없습니다.")); }
      else {
        e.appendChild(el("span", "big", "🌱"));
        e.appendChild(document.createTextNode("첫 기록을 남겨 보세요."));
        e.appendChild(el("div", "desc", "글은 마크다운(.md)으로, 사진·파일은 정리된 이름으로 드라이브에 쌓입니다."));
      }
      host.appendChild(e);
      return;
    }

    // ---- 목록식: 제목만 한 줄씩 ----
    if (settings.viewMode === "list") {
      var table = el("div", "card listview");
      shown.forEach(function (n) {
        var t = typeOf(n.type);
        var row = el("div", "lrow");
        row.setAttribute("data-eid", n.id);
        row.appendChild(el("span", "lico", t.icon));
        var ttl = el("button", "ltitle", n.title || "(제목 없음)");
        ttl.addEventListener("click", function () { settings.viewMode = "stream"; saveSettingsLocal(); expanded[n.id] = true; render(); gotoEntry(n.id); });
        row.appendChild(ttl);
        var outs = outLinks(n).filter(function (l) { return l.to; }).length;
        var ins = backLinks(n).length;
        if (outs || ins) row.appendChild(el("span", "lmeta", "🔗 " + outs + "/" + ins));
        var att = (n.blocks || []).filter(function (b) { return b.kind === "image" || b.kind === "file"; }).length;
        if (att) row.appendChild(el("span", "lmeta", "📎 " + att));
        row.appendChild(el("span", "lwhen", formatDate(n.createdAt).slice(0, 10)));
        var bd = el("button", "btn xs danger", "✕");
        bd.addEventListener("click", function () { removeEntry(n.id); });
        row.appendChild(bd);
        table.appendChild(row);
      });
      host.appendChild(table);
      return;
    }

    if (settings.viewMode === "grid") host.className = "gridview";
    else host.className = "";

    shown.forEach(function (n) {
      var t = typeOf(n.type);
      var card = el("article", "card entry");
      card.setAttribute("data-eid", n.id);

      if (n.pinned) card.classList.add("pinned");

      var head = el("div", "head");
      head.appendChild(el("span", "badge", t.icon + " " + t.label));
      head.appendChild(el("h3", null, n.title));
      var line2 = el("span", "when");
      line2.appendChild(document.createTextNode(formatDate(n.createdAt)));
      var pin = el("button", "pinbtn" + (n.pinned ? " on" : ""), n.pinned ? "📌 고정됨" : "📌 고정");
      pin.type = "button";
      pin.title = n.pinned ? "맨 위 고정을 풉니다" : "이 기록을 목록 맨 위에 둡니다";
      pin.addEventListener("click", function () { togglePin(n); });
      line2.appendChild(pin);
      head.appendChild(line2);
      card.appendChild(head);

      if ((n.tags || []).length) {
        var tg = el("div", "tags");
        n.tags.forEach(function (x) {
          // 태그를 누르면 그 태그로 바로 좁혀 본다
          var on = filterTags.indexOf(x) >= 0;
          var chip = el("button", "tag pick" + (on ? " on" : ""), "#" + x);
          chip.type = "button";
          chip.title = on ? "이 태그 필터 끄기" : "이 태그만 모아 보기";
          chip.addEventListener("click", function () {
            if (on) filterTags = filterTags.filter(function (y) { return y !== x; });
            else filterTags = filterTags.concat([x]);
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
          tg.appendChild(chip);
        });
        card.appendChild(tg);
      }

      var body = el("div", "content" + (expanded[n.id] ? "" : " collapsed"));
      renderContent(n, body, { mediaFirst: true });   // 보드에서는 사진·산출물·코드가 위로
      card.appendChild(body);

      var more = el("button", "btn sm ghost morebtn", expanded[n.id] ? "접기 ▲" : "더 보기 ▼");
      more.addEventListener("click", function () { expanded[n.id] = !expanded[n.id]; render(); });
      card.appendChild(more);
      setTimeout(function () {

      host.appendChild(card);
    });
  }

  var modalEl = null, modalCleanup = null;

  /* =========================================================
     11-8. 폴더에서 가져오기 — 색인에 없는 .md 를 찾아 목록에 넣는다
     ========================================================= */
  function listChildren(parentId) {
    var q = "'" + parentId + "' in parents and trashed=false";
    return driveJson("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
      "&fields=files(id,name,mimeType,size,createdTime,modifiedTime)&pageSize=1000" +
      "&supportsAllDrives=true&includeItemsFromAllDrives=true")
      .then(function (j) { return j.files || []; })
      .catch(function () { return []; });
  }
  /* 연결 폴더 아래를 깊이까지 훑는다.
     학년·학기·과목처럼 여러 겹으로 정리해 두어도 찾아낸다.
     드라이브 요청이 폭주하지 않도록 «깊이»와 «폴더 수»에 상한을 둔다. */
  var SCAN_DEPTH = 5;         // 연결 폴더 아래로 5단계까지
  var SCAN_FOLDER_MAX = 400;  // 훑을 폴더 수 상한
  var SCAN_PARALLEL = 4;      // 동시에 물어볼 폴더 수

  function scanFolder(onStep) {
    var files = [], seen = {}, visited = 0, truncated = false;

    // 한 단계(같은 깊이의 폴더들)를 훑고, 그 아래 단계를 다시 훑는다
    function walk(level) {
      if (!level.length) return Promise.resolve();
      var nextLevel = [], queue = level.slice();

      function worker() {
        if (!queue.length) return Promise.resolve();
        if (visited >= SCAN_FOLDER_MAX) { truncated = true; return Promise.resolve(); }
        var dir = queue.shift();
        visited++;
        if (onStep) onStep(visited, files.length);
        return listChildren(dir.id).then(function (kids) {
          kids.forEach(function (k) {
            if (k.mimeType === "application/vnd.google-apps.folder") {
              if (!seen[k.id]) { seen[k.id] = 1; nextLevel.push({ id: k.id, name: k.name, depth: dir.depth + 1 }); }
              return;
            }
            k._parent = dir.id; k._parentName = dir.name;
            files.push(k);
          });
        }).then(worker);
      }

      var runners = [];
      for (var i = 0; i < SCAN_PARALLEL; i++) runners.push(worker());
      return Promise.all(runners).then(function () {
        var deeper = nextLevel.filter(function (d) { return d.depth <= SCAN_DEPTH; });
        if (nextLevel.length > deeper.length) truncated = true;   // 더 깊은 곳이 남았다
        if (!deeper.length || visited >= SCAN_FOLDER_MAX) return;
        return walk(deeper);
      });
    }

    return walk([{ id: folder.id, name: folder.name, depth: 0 }]).then(function () {
      return { files: files, folders: visited, truncated: truncated };
    });
  }
  function fetchText(id) {
    return driveFetch("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media&supportsAllDrives=true")
      .then(function (r) { return r.ok ? r.text() : ""; })
      .catch(function () { return ""; });
  }
  function unquote(s) {
    s = String(s || "").trim();
    if (/^".*"$/.test(s) || /^'.*'$/.test(s)) return s.slice(1, -1).replace(/\\"/g, '"');
    return s;
  }
  function parseFrontMatter(text) {
    var fm = {}, body = text;
    var m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(text);
    if (m) {
      body = text.slice(m[0].length);
      m[1].split(/\r?\n/).forEach(function (line) {
        var mm = /^([A-Za-z_][\w-]*):\s*(.*)$/.exec(line);
        if (mm) fm[mm[1]] = mm[2].trim();
      });
    }
    return { fm: fm, body: body };
  }
  function parseListValue(v) {
    v = String(v || "").trim();
    if (!/^\[/.test(v)) return v ? [unquote(v)] : [];
    return v.replace(/^\[|\]$/g, "").split(",").map(function (s) { return unquote(s); }).filter(Boolean);
  }
  // 마크다운 본문을 블록으로 되돌린다
  function bodyToBlocks(body, siblings) {
    var out = [], buf = [];
    function flush() {
      var t = buf.join("\n").trim();
      if (t) out.push(newBlock("text", { text: t }));
      buf = [];
    }
    function findSibling(name) {
      var base = String(name || "").split("/").pop().replace(/^<|>$/g, "");
      for (var i = 0; i < siblings.length; i++) if (siblings[i].name === base) return siblings[i];
      return null;
    }
    body.split(/\r?\n/).forEach(function (line) {
      var m;
      if (/^#\s+/.test(line)) { flush(); return; }              // 제목은 이미 title 로
      if ((m = /^##\s+(.*)$/.exec(line))) { flush(); out.push(newBlock("heading", { text: m[1].trim() })); return; }
      if (/^\s*---\s*$/.test(line)) { flush(); out.push(newBlock("divider")); return; }
      if ((m = /^>\s?(.*)$/.exec(line))) {
        var last = out[out.length - 1];
        if (buf.length) flush();
        if (last && last.kind === "quote") last.text += "\n" + m[1];
        else out.push(newBlock("quote", { text: m[1] }));
        return;
      }
      if ((m = /^!\[([^\]]*)\]\(<?([^)>]+)>?\)\s*$/.exec(line))) {
        flush();
        var sf = findSibling(m[2]);
        out.push(newBlock("image", {
          caption: m[1] || "", original: (m[2].split("/").pop() || "").replace(/^<|>$/g, ""),
          name: sf ? sf.name : (m[2].split("/").pop() || ""),
          mime: sf ? sf.mimeType : "image/png", size: sf ? Number(sf.size || 0) : 0,
          fileId: sf ? sf.id : null
        }));
        return;
      }
      if ((m = /^📎\s*\[([^\]]*)\]\(([^)]+)\)/.exec(line))) {
        flush();
        var fid = /\/file\/d\/([\w-]+)/.exec(m[2]);
        var sf2 = fid ? null : findSibling(m[2]);
        out.push(newBlock("file", {
          caption: "", original: m[1], name: sf2 ? sf2.name : m[1],
          mime: sf2 ? sf2.mimeType : "application/octet-stream",
          size: sf2 ? Number(sf2.size || 0) : 0,
          fileId: fid ? fid[1] : (sf2 ? sf2.id : null)
        }));
        return;
      }
      if ((m = /^🔗\s*\[([^\]]*)\]\(([^)]+)\)/.exec(line))) {
        flush(); out.push(newBlock("link", { url: m[2], label: m[1] })); return;
      }
      if (/^\s*<(iframe|embed|video|div)\b/i.test(line)) {
        flush(); out.push(newBlock("embed", { code: line.trim(), height: 360 })); return;
      }
      if (/^##\s*연결\s*$/.test(line)) { flush(); return; }
      buf.push(line);
    });
    flush();
    return out;
  }

  function importFromFolder(status) {
    if (!connected || !folder.id) { toast("먼저 드라이브에 연결해 주세요."); return Promise.resolve(0); }
    var known = {};
    entries.forEach(function (n) {
      if (n.mdId) known[n.mdId] = 1;
      if (n.docId) known[n.docId] = 1;
      if (n.htmlId) known[n.htmlId] = 1;
      (n.blocks || []).forEach(function (b) { if (b.fileId) known[b.fileId] = 1; });
    });
    var byEntryId = {};
    entries.forEach(function (n) { byEntryId[n.id] = 1; });

    if (status) status.textContent = "폴더를 훑는 중…";
    return scanFolder(function (dirs, found) {
      if (status) status.textContent = "폴더를 훑는 중… " + dirs + "곳 · 파일 " + found + "개";
    }).then(function (scan) {
      var files = scan.files;
      if (scan.truncated) {
        toast("폴더 " + scan.folders + "곳까지만 훑었습니다 (5단계·400곳 한도).");
        toast2("더 깊거나 많은 곳에 있는 파일은, 그 폴더를 직접 연결해서 한 번 더 가져오세요.");
      }
      var mds = files.filter(function (f) {
        return !known[f.id] && /\.md$/i.test(f.name || "");
      });
      if (!mds.length) {
        if (status) status.textContent = "폴더 " + scan.folders + "곳을 훑었습니다 — 새로 가져올 .md 파일이 없습니다.";
        return 0;
      }
      if (status) status.textContent = "폴더 " + scan.folders + "곳에서 " + mds.length + "개를 찾았습니다. 읽는 중…";

      var added = 0, skipped = 0;
      return mds.reduce(function (p, f) {
        return p.then(function () {
          return fetchText(f.id).then(function (text) {
            if (!text) { skipped++; return; }
            var parsed = parseFrontMatter(text);
            var fm = parsed.fm;
            if (fm.id && byEntryId[fm.id]) { skipped++; return; }  // 이미 있는 기록

            var title = unquote(fm.title) ||
              (/^#\s+(.*)$/m.exec(parsed.body) || [])[1] ||
              stemOf(f.name);
            var typeKey = settings.types[0] ? settings.types[0].key : "";
            var wanted = unquote(fm.type);
            settings.types.forEach(function (t) { if (t.label === wanted) typeKey = t.key; });

            var siblings = files.filter(function (x) { return x._parent === f._parent && x.id !== f.id; });
            var created = Date.parse(fm.created || f.createdTime) || Date.now();
            var updated = Date.parse(fm.updated || f.modifiedTime) || created;

            var n = {
              id: fm.id && !byEntryId[fm.id] ? fm.id : uid("k_"),
              type: typeKey,
              title: title,
              tags: parseListValue(fm.tags),
              blocks: bodyToBlocks(parsed.body, siblings),
              relations: [],
              createdAt: created,
              updatedAt: updated,
              mdId: f.id,
              mdName: f.name,
              folderId: (f._parent !== folder.id) ? f._parent : null,
              folderName: (f._parent !== folder.id) ? f._parentName : null,
              _imported: true
            };
            byEntryId[n.id] = 1;
            entries.push(n);
            added++;
          });
        });
      }, Promise.resolve()).then(function () {
        if (!added) { if (status) status.textContent = "새로 가져올 것이 없습니다. (건너뜀 " + skipped + ")"; return 0; }
        entries.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
        invalidateLinks(); saveLocal(); render();
        if (status) status.textContent = added + "개를 가져와 색인에 넣었습니다.";
        return saveIndex().then(function () { return added; });
      });
    }).catch(function (e) {
      if (status) status.textContent = "가져오기 실패: " + e.message;
      return 0;
    });
  }

  /* 링크 주소에서 도메인만 뽑는다 (링크 미리보기·태그에 쓴다) */
  function hostOf(u) {
    try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
  }
  var toast2 = function (msg) { setTimeout(function () { toast(msg); }, 3000); };

  /* =========================================================
     11-9. 밖에서 들어온 것 받기 — 웹 캡처 · 공유
     들어오는 길이 두 갈래다.
       ① 📱 안드로이드 «공유» 시트 → 서비스 워커가 받아 캐시에 두고 여기서 꺼낸다
       ② 💻 즐겨찾기 한 줄(북마클릿) → 주소 뒤 #capture= 에 담겨 온다
     둘 다 «쓰던 글에 이어 붙인다». 덮어쓰지 않는다.
     ========================================================= */
  var SHARE_CACHE = "pkems-share-inbox";

  function urlHost(u) {
    try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
  }

  // 받은 것(제목·주소·본문)을 블록으로 바꿔 이어 붙인다
  function absorbShared(s) {
    var title = String(s.title || "").trim();
    var url = String(s.url || "").trim();
    var text = String(s.text || "").trim();

    // 안드로이드 앱 상당수가 주소를 text 에 섞어 보낸다. 거기서 뽑아낸다.
    if (!url) {
      var m = /https?:\/\/[^\s]+/.exec(text);
      if (m) { url = m[0]; text = text.replace(m[0], "").trim(); }
    }
    if (text && url && text === url) text = "";

    var made = [];
    if (url) made.push(newBlock("link", { url: url, label: title || urlHost(url) || url }));
    if (text) made.push(newBlock("quote", { text: text }));
    if (!url && !text && title) made.push(newBlock("text", { text: title }));

    if (made.length) {
      blocks = blocks.concat(made);
      renderBlocks();
    }
    // 제목 칸이 비어 있을 때만 채운다. 쓰던 제목을 밀어내지 않는다.
    var tf = $("title");
    if (tf && !tf.value.trim() && title) { tf.value = title; touchDraft(); }
    return made.length;
  }

  // 서비스 워커가 캐시에 넣어 둔 공유 꾸러미를 꺼낸다
  function pullSharedFromCache() {
    if (!self.caches) return Promise.resolve(0);
    var cache = null;
    return caches.open(SHARE_CACHE)
      .then(function (c) { cache = c; return c.match("/__share__/meta"); })
      .then(function (res) {
        if (!res) return 0;
        return res.json().then(function (meta) {
          var n = absorbShared(meta);
          var list = meta.files || [];
          return list.reduce(function (chain, f) {
            return chain.then(function () {
              return cache.match("/__share__/" + f.key).then(function (r) {
                if (!r) return;
                return r.blob().then(function (blob) {
                  return acceptFiles([new File([blob], f.name, { type: f.type || blob.type })])
                    .then(function () { n++; });
                });
              });
            });
          }, Promise.resolve()).then(function () { return n; });
        });
      })
      .then(function (n) {
        return caches.delete(SHARE_CACHE).catch(function () {}).then(function () { return n; });
      })
      .catch(function () { return 0; });
  }

  // 즐겨찾기 한 줄이 주소 뒤에 붙여 보낸 것
  function pullSharedFromHash() {
    var m = /[#&]capture=([^&]+)/.exec(location.hash || "");
    if (!m) return 0;
    var got = 0;
    try { got = absorbShared(JSON.parse(decodeURIComponent(m[1]))); } catch (e) { got = 0; }
    history.replaceState(null, "", location.pathname + location.search);
    return got;
  }

  function intakeShared() {
    var fromHash = pullSharedFromHash();
    if (fromHash) {
      toast("웹에서 가져온 " + fromHash + "개를 넣었습니다. 이어서 쓰고 «기록 저장» 을 누르세요.");
      touchDraft();
      return;
    }
    if (!/[?&]share=1/.test(location.search)) return;
    history.replaceState(null, "", location.pathname);
    pullSharedFromCache().then(function (n) {
      if (!n) { toast("공유된 내용을 찾지 못했습니다."); return; }
      toast("공유한 " + n + "개를 넣었습니다. 이어서 쓰고 «기록 저장» 을 누르세요.");
      touchDraft();
      var box = $("blocks");
      if (box && box.lastElementChild) box.lastElementChild.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  }

  // 설정 화면에 붙일 «즐겨찾기 한 줄». 지금 이 앱 주소가 그대로 박힌다.
  function bookmarkletCode() {
    var appUrl = location.origin + location.pathname;
    return "javascript:(function(){" +
      "var s=(window.getSelection?String(getSelection()):'').slice(0,4000);" +
      "var d={title:document.title,url:location.href,text:s};" +
      "window.open('" + appUrl + "#capture='+encodeURIComponent(JSON.stringify(d)),'_blank');" +
      "})()";

  var TYPE_COLORS = ["#2f5fd6", "#1a9e5f", "#d98324", "#a34fc4", "#d64545", "#0f9aa8", "#8a6d3b", "#5b6bd6"];

  function openGraph() {

    /* ---- 그래프 데이터 ---- */
    var showTags = false, showLabels = true, query = "";
    var nodes = [], edges = [], byId = {}, raf = null, alive = true;
    var selected = null, connectFrom = null, heat = 1;

    function buildGraph(keepPositions) {
      var prev = {};
      if (keepPositions) nodes.forEach(function (n) { prev[n.id] = { x: n.x, y: n.y }; });
      nodes = []; edges = []; byId = {};
      var ld = linkData();
      var w = canvas.clientWidth || 800, h = canvas.clientHeight || 500;
      entries.forEach(function (n, i) {
        var ang = i * 2.399, rad = 30 + 14 * Math.sqrt(i);
        var p = prev[n.id];
        var node = {
          id: n.id, kind: "entry", label: n.title || "(제목 없음)", color: typeColor(n.type),
          x: p ? p.x : w / 2 + Math.cos(ang) * rad,
          y: p ? p.y : h / 2 + Math.sin(ang) * rad,
          vx: 0, vy: 0, deg: 0
        };
        nodes.push(node); byId[n.id] = node;
      });
      // 글 속 [[링크]] + 관계망에서 이어준 연결
      entries.forEach(function (n) {
        (ld.out[n.id] || []).forEach(function (l) {
          if (!l.to || l.to === n.id || !byId[l.to]) return;
          edges.push({ a: byId[n.id], b: byId[l.to], kind: "link", label: l.label || "", via: l.via });
          byId[n.id].deg++; byId[l.to].deg++;
        });
      });
      // 태그를 통한 연결
      if (showTags) {
        var tagMap = {};
        entries.forEach(function (n) {
          (n.tags || []).forEach(function (t) {
            var k = "#" + normTitle(t);
            (tagMap[k] = tagMap[k] || { label: "#" + t, ids: [] }).ids.push(n.id);
          });
        });
        Object.keys(tagMap).forEach(function (k) {
          var g = tagMap[k];
          if (g.ids.length < 2) return;   // 혼자 쓰는 태그는 그리지 않는다
          var tn = {
            id: k, kind: "tag", label: g.label, color: "#94a3b8",
            x: canvas.clientWidth / 2 + (Math.random() - .5) * 200,
            y: canvas.clientHeight / 2 + (Math.random() - .5) * 200, vx: 0, vy: 0, deg: g.ids.length
          };
          nodes.push(tn); byId[k] = tn;
          g.ids.forEach(function (id) {
            if (!byId[id]) return;
            edges.push({ a: tn, b: byId[id], kind: "tag" });
          });
        });
      }
      emptyMsg.style.display = nodes.length ? "none" : "flex";
      emptyMsg.textContent = "아직 기록이 없습니다. 먼저 하나 써 보세요.";
      var linkCount = edges.filter(function (e) { return e.kind === "link"; }).length;
      stat.textContent = "기록 " + entries.length + "개 · 연결 " + linkCount + "개" +
        (showTags ? " · 태그 연결 " + (edges.length - linkCount) + "개" : "");
      paintLegend();
      heat = 1;   // 배치를 다시 데운다
    }

    function paintLegend() {
      legend.innerHTML = "";
      settings.types.forEach(function (t) {
        var c = entries.filter(function (n) { return n.type === t.key; }).length;
        if (!c) return;
        var row = el("div", "lg");
        var d = el("span", "dot"); d.style.background = typeColor(t.key);

    }

    /* ---- 물리 계산 ---- */
    function tick() {
      var w = canvas.clientWidth, h = canvas.clientHeight, cx = w / 2, cy = h / 2;
      var i, j, a, b, dx, dy, d2, d, f;
      for (i = 0; i < nodes.length; i++) {
        a = nodes[i];
        for (j = i + 1; j < nodes.length; j++) {
          b = nodes[j];
          dx = b.x - a.x; dy = b.y - a.y;
          d2 = dx * dx + dy * dy;
          if (d2 < 1) { d2 = 1; dx = Math.random() - .5; dy = Math.random() - .5; }
          if (d2 > 160000) continue;
          f = 2600 / d2;
          d = Math.sqrt(d2);
          a.vx -= f * dx / d; a.vy -= f * dy / d;
          b.vx += f * dx / d; b.vy += f * dy / d;
        }
      }
      edges.forEach(function (e) {
        dx = e.b.x - e.a.x; dy = e.b.y - e.a.y;
        d = Math.sqrt(dx * dx + dy * dy) || 1;
        var rest = e.kind === "tag" ? 130 : 95;
        f = (d - rest) * (e.kind === "tag" ? 0.006 : 0.014);
        e.a.vx += f * dx / d; e.a.vy += f * dy / d;
        e.b.vx -= f * dx / d; e.b.vy -= f * dy / d;
      });
      nodes.forEach(function (n) {
        n.vx += (cx - n.x) * 0.0016;
        n.vy += (cy - n.y) * 0.0016;
        if (n === dragNode) { n.vx = 0; n.vy = 0; return; }
        n.vx *= 0.85; n.vy *= 0.85;
        // heat 가 식으면 움직임이 잦아들어 자리를 잡는다 (계속 흔들리지 않게)
        n.x += Math.max(-12, Math.min(12, n.vx * heat));
        n.y += Math.max(-12, Math.min(12, n.vy * heat));
      });
      if (!dragNode && heat > 0.02) heat *= 0.985;
    }

    /* ---- 그리기 ---- */
    var scale = 1, panX = 0, panY = 0, dragNode = null, panning = false;
    var lastPt = null, downPt = null, moved = 0;

    // 캔버스 픽셀 크기가 화면 크기와 어긋나면 그림이 눌리고 클릭 위치도 틀어진다
    function resize() {
      var dpr = window.devicePixelRatio || 1;
      var w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
      if (!w || !h) return false;
      if (canvas.width === w && canvas.height === h) return false;
      canvas.width = w; canvas.height = h;
      return true;
    }
    function draw() {
      resize();   // 모달 크기가 뒤늦게 잡히는 경우까지 매 프레임 확인
      var dpr = window.devicePixelRatio || 1;
      var ctx = canvas.getContext("2d");
      var css = getComputedStyle(document.body);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      ctx.save();
      ctx.translate(panX, panY);
      ctx.scale(scale, scale);

      var q = normTitle(query);
      var hi = {};
      if (q) nodes.forEach(function (n) { if (normTitle(n.label).indexOf(q) >= 0) hi[n.id] = 1; });

      function radiusOf(n) { return (n.kind === "tag" ? 4 : 6) + Math.min(9, n.deg * 1.3); }
      // 선택한 점과 이웃을 강조
      var near = {};
      if (selected) {
        near[selected.id] = 1;
        edges.forEach(function (e) {
          if (e.a.id === selected.id) near[e.b.id] = 1;
          if (e.b.id === selected.id) near[e.a.id] = 1;
        });
      }

      edges.forEach(function (e) {
        var touched = selected && (e.a.id === selected.id || e.b.id === selected.id);
        var dim = (q && !hi[e.a.id] && !hi[e.b.id]) || (selected && !touched);
        ctx.strokeStyle = e.kind === "tag" ? "rgba(148,163,184,.35)" : (touched ? "#2f5fd6" : "rgba(120,140,190,.55)");
        if (dim) ctx.strokeStyle = "rgba(150,150,160,.12)";
        ctx.lineWidth = ((e.kind === "tag" ? 1 : (touched ? 2.4 : 1.6))) / scale;
        if (e.kind === "tag") ctx.setLineDash([4 / scale, 4 / scale]); else ctx.setLineDash([]);

        var dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var ux = dx / len, uy = dy / len;
        var rb = radiusOf(e.b) + 2;
        var ex = e.b.x - ux * rb, ey = e.b.y - uy * rb;   // 화살촉이 점에 닿지 않게

        ctx.beginPath();
        ctx.moveTo(e.a.x, e.a.y);
        ctx.lineTo(ex, ey);
        ctx.stroke();

        // 방향 화살촉 (기록끼리의 연결만)
        if (e.kind === "link" && !dim && scale > 0.4) {
          var ah = 7 / scale, aw = 4 / scale;
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.moveTo(ex, ey);
          ctx.lineTo(ex - ux * ah - uy * aw, ey - uy * ah + ux * aw);
          ctx.lineTo(ex - ux * ah + uy * aw, ey - uy * ah - ux * aw);

    if (!draggingFiles(e)) return;

  var lastSyncAt = 0, syncing = false;
  function setSyncPill(text, busy) {
    var p = $("syncPill");
    p.textContent = text || "";
    p.className = "syncpill" + (busy ? " busy" : "");
  }
  function syncedAgo() {
    if (!connected) return "";
    if (!lastSyncAt) return "";
    var s = Math.round((Date.now() - lastSyncAt) / 1000);
    if (s < 60) return "☁ 방금 동기화";
    if (s < 3600) return "☁ " + Math.round(s / 60) + "분 전 동기화";
    return "☁ " + Math.round(s / 3600) + "시간 전 동기화";
  }
  function autoSync(force) {
    if (!connected || syncing) return Promise.resolve();
    if (!force && Date.now() - lastSyncAt < 20000) return Promise.resolve();
    if (!navigator.onLine) { setSyncPill("⚠ 오프라인"); return Promise.resolve(); }
    syncing = true;
    setSyncPill("↻ 동기화 중…", true);
    return loadIndex()
      .then(function (remote) {
        absorbIndex(remote);
        saveLocal(); render();
        return syncPending();
      })
      .then(function () {
        lastSyncAt = Date.now(); syncing = false; setSyncPill(syncedAgo());
      })
      .catch(function () {
        syncing = false; setSyncPill("⚠ 동기화 실패");
      });
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) autoSync(); });
  window.addEventListener("focus", function () { autoSync(); });
  window.addEventListener("online", function () { autoSync(true); });
  setInterval(function () { if (!syncing) setSyncPill(syncedAgo()); }, 30000);

    if (!btn) return;
    var prompt = null;
    // 이미 앱으로 열려 있으면 버튼을 보일 이유가 없다
    var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    window.addEventListener("beforeinstallprompt", function (e) {
      if (standalone) return;
      e.preventDefault();
      prompt = e;
      btn.style.display = "";
    });
    btn.addEventListener("click", function () {
      if (!prompt) return;
      prompt.prompt();
      prompt.userChoice.then(function () { prompt = null; btn.style.display = "none"; });
    });
    window.addEventListener("appinstalled", function () {
      prompt = null; btn.style.display = "none";
      toast("앱으로 설치했습니다. 바탕화면에서 열 수 있습니다.");
    });
  })();

  // 기기에 맞는 버튼 이름
  (function () {
    var b = document.querySelector('[data-add="capture"]');
    if (b && isTouchDevice()) b.textContent = "📸 캡처·촬영";
  })();

  if (clientId && folder.id && localStorage.getItem(LS.connected) === "1") {
    /* 지난번 토큰이 아직 살아 있으면 그대로 이어 쓴다.
       구글에 다시 물어보지 않으니 새로고침해도 «로그인 화면» 이 안 뜬다. */
    var kept = loadToken();
    if (kept) { accessToken = kept; userEmail = localStorage.getItem(LS.email) || ""; }

    var wait = setInterval(function () {
      if (!kept && !gisReady()) return;
      clearInterval(wait);
      (kept ? Promise.resolve(kept) : requestToken(false)).then(ensureAccount)
        .then(function () { return verifyFolder(folder.id); })
        .then(function (f) {
          folder = { id: f.id, name: f.name, link: f.link };
          connected = true; updateChrome();
          return loadSettingsRemote();
        })
        .then(function (rs) {
          if (rs) { settings = normalizeSettings(rs); saveSettingsLocal(); renderTypeChips(); }
          return loadIndex();
        })
        .then(function (remote) {
          absorbIndex(remote);
          saveLocal(); render(); updateChrome();
          return syncPending();
        })
        .then(function () { lastSyncAt = Date.now(); setSyncPill(syncedAgo()); })
        .catch(function () {
          /* 예전에는 여기서 아무 말 없이 끝났다. 그래서 «그냥 로그아웃» 처럼 보였다.
             이제는 «한 번 눌러 다시 연결» 띠를 띄운다. */
          needReconnect = true;
          clearToken();
          updateChrome();
        });
    }, 300);
    setTimeout(function () {
      clearInterval(wait);
      if (!connected) { needReconnect = true; updateChrome(); }
    }, 8000);
  }
})();
</script>
</body>
</html>
