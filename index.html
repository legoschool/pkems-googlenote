<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="글·사진·링크·파일을 블로그처럼 이어 쓰고, 내 구글 드라이브 폴더에 마크다운으로 쌓는 개인 지식·경험 기록장(PKEMS)" />
<meta name="theme-color" content="#2f5fd6" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="기록장" />
<title>PKEMS · 개인 지식·경험 기록장</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #f5f7fb; --panel: #fff; --ink: #1b2130; --ink-soft: #667085;
    --brand: #2f5fd6; --brand-dark: #24499f; --brand-soft: #eaf0ff;
    --line: #e3e8f2; --line-soft: #eef1f7;
    --danger: #d64545; --ok: #1a9e5f; --warn: #b07a00;
    --shadow: 0 1px 3px rgba(20,30,60,.06), 0 8px 24px rgba(20,30,60,.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161f; --panel: #1b202b; --ink: #e8ecf4; --ink-soft: #98a2b3;
      --brand: #7d9dff; --brand-dark: #5f83f0; --brand-soft: #232c44;
      --line: #2b3242; --line-soft: #232936;
      --shadow: 0 1px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    font-size: 15px; line-height: 1.62; -webkit-text-size-adjust: 100%;
  }
  a { color: var(--brand); }
  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; word-break: break-all; }
  .spacer { flex: 1 1 auto; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px 80px; }

  /* ---------- 상단 바 ---------- */
  header.top { position: sticky; top: 0; z-index: 40; background: var(--panel); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1000px; margin: 0 auto; padding: 9px 16px; display: flex; align-items: center; gap: 10px; }
  .logo { font-weight: 800; font-size: 16.5px; letter-spacing: -.3px; display: flex; align-items: center; gap: 7px; }
  .logo small { font-weight: 500; font-size: 12px; color: var(--ink-soft); letter-spacing: 0; }
  @media (max-width: 560px) { .logo small { display: none; } }
  .acct { font-size: 12.5px; color: var(--ink-soft); max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; transition: .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--brand); color: var(--brand); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
  .btn.xs { padding: 2px 7px; font-size: 12px; border-radius: 7px; font-weight: 500; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* ---------- 배너 ---------- */
  .banner { margin: 16px 0; padding: 12px 14px; border-radius: 12px; font-size: 13.5px;
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px solid var(--line); background: var(--panel); }
  .banner.warn { background: #fff8e6; border-color: #f0dca8; color: #6b4e00; }
  .banner.ok { background: #eaf7f0; border-color: #b9e3cd; color: #0f5c39; }
  @media (prefers-color-scheme: dark) {
    .banner.warn { background: #33291180; border-color: #5a4715; color: #f0d78f; }
    .banner.ok { background: #10321f80; border-color: #1e5c3c; color: #97e0bb; }
  }
  .banner .grow { flex: 1 1 240px; }
  .banner.draft { background: var(--brand-soft); border-color: var(--brand); color: var(--brand);
                  font-weight: 600; margin: 16px 0 -6px; padding: 10px 14px; }
  .banner a { color: inherit; }

  /* ---------- 입력 공통 ---------- */
  .inp { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); outline: none; }
  .inp:focus { border-color: var(--brand); background: var(--panel); }
  textarea.inp { resize: vertical; line-height: 1.75; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
  .desc { font-size: 12.5px; color: var(--ink-soft); margin: 4px 0 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
          padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

  /* ---------- 에디터 ---------- */
  .composer { padding: 18px; margin: 16px 0; }
  .composer h2 { margin: 0 0 12px; font-size: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

  #blocks { margin-top: 4px; }
  .block { border: 1px solid var(--line-soft); border-radius: 12px; background: var(--bg); margin-bottom: 8px; }
  .block:focus-within { border-color: var(--brand); }
  .bhead { display: flex; align-items: center; gap: 4px; padding: 5px 8px 3px; }
  .bkind { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); padding-left: 3px; }
  /* 순서 바꾸기 — 끌어서 옮기거나, 큰 화살표로 한 칸씩 */
  .bgrip { cursor: grab; font-size: 15px; color: var(--ink-soft); padding: 4px 7px; border-radius: 8px;
           user-select: none; line-height: 1; }
  .bgrip:hover { background: var(--line-soft); color: var(--brand); }
  .bgrip:active { cursor: grabbing; }
  .btn.bmove { font-size: 18px; font-weight: 800; line-height: 1; min-width: 44px; padding: 7px 10px; }
  .block.dragging { opacity: .4; }
  .block.dropbefore { box-shadow: 0 -3px 0 0 var(--brand); }
  .block.dropafter { box-shadow: 0 3px 0 0 var(--brand); }
  .bbody { padding: 0 8px 8px; }
  .bbody textarea, .bbody input { background: var(--panel); }
  .block.text textarea { min-height: 76px; }
  .block.heading input { font-size: 17px; font-weight: 700; }
  .block.quote textarea { border-left: 3px solid var(--brand); font-style: italic; min-height: 56px; }
  .block.divider .bbody { padding: 10px 12px 16px; }
  .block.divider hr { border: none; border-top: 2px dashed var(--line); margin: 0; }
  .media { display: flex; gap: 10px; align-items: flex-start; }
  .media .thumb { width: 92px; height: 92px; flex: 0 0 auto; border-radius: 10px; object-fit: cover; background: var(--line-soft); }
  .media .ficon { width: 92px; height: 92px; flex: 0 0 auto; border-radius: 10px; background: var(--line-soft);
                  display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .media .minfo { flex: 1 1 auto; min-width: 0; }
  /* 파일 이름이 길어도 한 줄에서 끝나게 (전체 이름은 마우스를 올리면 보인다) */
  .media .savedname { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--brand);
                      display: block; margin-bottom: 2px;
                      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .media .origname { font-size: 11.5px; color: var(--ink-soft); display: block; margin-bottom: 6px;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .addbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px; border: 1px dashed var(--line); border-radius: 12px; background: var(--bg); }
  .addbar .btn { background: var(--panel); }
  .addbar.hover { border-color: var(--brand); background: var(--brand-soft); }
  .addhint { width: 100%; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .composer-actions { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .savehint { font-size: 12px; color: var(--ink-soft); }

  /* ---------- 목록 ---------- */
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 24px 0 10px; }
  .toolbar h2 { margin: 0; font-size: 16px; }
  .count { font-size: 13px; color: var(--ink-soft); }
  .search { flex: 0 1 300px; }
  .filters { margin-bottom: 14px; }
  .tagfilters { margin: -8px 0 14px; align-items: center; }
  .flabel { font-size: 12px; color: var(--ink-soft); font-weight: 700; padding-right: 2px; align-self: center; }
  .chip.tagchip { font-size: 12.5px; padding: 5px 11px; }
  .chip.ghostchip { border-style: dashed; }
  .chip.clearchip { border-color: var(--danger); color: var(--danger); }
  .tag.pick { cursor: pointer; }
  .tag.pick:hover { border-color: var(--brand); color: var(--brand); }
  .tag.pick.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

  /* 기록마다 위쪽에 색 줄을 둬서 어디서 끊기는지 한눈에 보이게 한다 */
  .entry { padding: 16px 18px; margin-bottom: 12px; border-top: 3px solid var(--brand); }
  /* 유형 배지 바로 뒤에 제목이 붙고, 길면 그 자리에서 줄만 바뀐다 */
  .entry .head { display: block; }
  .entry .head .badge { display: inline; margin-right: 7px; white-space: nowrap; }
  .entry .head h3 { display: inline; font-size: 16.5px; line-height: 1.45; }
  .entry .head .when { display: block; margin-top: 6px; }
  /* 📌 맨 위 고정 */
  .pinbtn { border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
            font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px;
            margin-left: 8px; vertical-align: middle; white-space: nowrap; }
  .pinbtn:hover { border-color: var(--brand); color: var(--brand); }
  .pinbtn.on { background: #fff4d6; border-color: var(--warn); color: var(--warn); }
  @media (prefers-color-scheme: dark) { .pinbtn.on { background: #3a2f12; } }
  .entry.pinned { border-top-color: var(--warn); }
  .badge { font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
  .entry h3 { margin: 0; font-size: 16.5px; flex: 1 1 auto; min-width: 0; }
  .when { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .tags { margin: 7px 0 0; display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: 12px; color: var(--ink-soft); background: var(--bg); border: 1px solid var(--line); padding: 1px 8px; border-radius: 999px; }
  .content { margin-top: 10px; }
  .content > * { margin: 0 0 8px; }
  .content p { white-space: pre-wrap; word-break: break-word; font-size: 14.3px; }
  .content h4 { font-size: 15px; margin-top: 14px; }
  .content blockquote { margin: 0 0 8px; padding: 4px 0 4px 12px; border-left: 3px solid var(--brand); color: var(--ink-soft); font-style: italic; white-space: pre-wrap; }
  .content hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  .content figure { margin: 0 0 10px; }
  .content figure img { max-width: 100%; max-height: 420px; border-radius: 10px; display: block; border: 1px solid var(--line); }
  .content figcaption { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }
  .content .fileline, .content .linkline {
    display: inline-block; vertical-align: top; font-size: 13px;
    border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; background: var(--bg);
    text-decoration: none; color: var(--ink); max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .content .fileline:hover, .content .linkline:hover { border-color: var(--brand); color: var(--brand); }
  .collapsed { max-height: 320px; overflow: hidden; position: relative; }
  .collapsed::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 70px;
                      background: linear-gradient(transparent, var(--panel)); }
  .morebtn { display: block; width: 100%; margin-top: 4px; }

  .foot { display: flex; gap: 6px; align-items: center; margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .sync-dot { font-size: 12px; color: var(--ink-soft); }
  .sync-dot.ok { color: var(--ok); }
  .sync-dot.pending { color: var(--warn); }

  .empty { text-align: center; padding: 46px 20px; color: var(--ink-soft); font-size: 14px; }
  .empty .big { font-size: 40px; display: block; margin-bottom: 10px; }

  /* ---------- 토스트/진행 ---------- */
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
           background: #1b2130; color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 14px;
           opacity: 0; pointer-events: none; transition: .22s; z-index: 210; max-width: 90vw; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
           /* 210 인 이유: 「전체 보기」(140)·사진 창(160)·공유 창(170) 위에서도 알림이 보여야 한다 */
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #progress { position: fixed; left: 0; top: 0; height: 3px; background: var(--brand); width: 0; transition: width .3s; z-index: 200; }

  /* ---------- 모달 ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,35,.55); z-index: 90;
              display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { max-width: 620px; width: 100%; max-height: 88vh; display: flex; flex-direction: column; }
  .modal .mhead { display: flex; align-items: center; gap: 8px; padding: 15px 18px; border-bottom: 1px solid var(--line); }
  .modal .mhead h3 { margin: 0; font-size: 17px; }
  .modal .mbody { padding: 18px; overflow: auto; }
  .modal .mfoot { display: flex; gap: 8px; padding: 13px 18px; border-top: 1px solid var(--line); align-items: center; }
  .tabs { display: flex; gap: 4px; padding: 10px 18px 0; flex-wrap: wrap; }
  .tab { border: none; background: transparent; color: var(--ink-soft); font-weight: 700; font-size: 13.5px;
         padding: 7px 12px; border-radius: 9px 9px 0 0; border-bottom: 2px solid transparent; }
  .tab.on { color: var(--brand); border-bottom-color: var(--brand); background: var(--brand-soft); }

  .typerow { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .typerow .ic { width: 52px; text-align: center; flex: 0 0 auto; }
  .typerow .nm { flex: 1 1 auto; }
  .tokens { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .token { font-size: 12px; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 2px 8px; font-family: ui-monospace, Consolas, monospace; }
  .preview { margin-top: 8px; padding: 9px 11px; border-radius: 9px; background: var(--brand-soft); font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; word-break: break-all; color: var(--brand); }

  .steps { font-size: 13px; color: var(--ink-soft); padding-left: 18px; margin: 8px 0 0; }
  .steps li { margin-bottom: 4px; }

  /* ---------- 위키링크 [[제목]] ---------- */
  .wikilink {
    color: var(--brand); text-decoration: none; border-bottom: 1px solid transparent;
    background: var(--brand-soft); padding: 0 4px; border-radius: 5px; cursor: pointer;
  }
  .wikilink:hover { border-bottom-color: var(--brand); }
  .wikilink.missing { color: var(--warn); background: transparent; border: 1px dashed var(--warn); opacity: .85; }
  #wikiPop {
    position: absolute; z-index: 60; min-width: 220px; max-width: 340px; max-height: 240px; overflow: auto;
    background: var(--panel); border: 1px solid var(--brand); border-radius: 10px;
    box-shadow: var(--shadow); padding: 4px;
  }
  #wikiPop .wp {
    display: block; width: 100%; text-align: left; border: none; background: transparent; color: var(--ink);
    padding: 7px 9px; border-radius: 7px; font-size: 13.5px;
  }
  #wikiPop .wp.on, #wikiPop .wp:hover { background: var(--brand-soft); color: var(--brand); }
  #wikiPop .wp small { display: block; color: var(--ink-soft); font-size: 11.5px; }
  #wikiPop .wp.on small, #wikiPop .wp:hover small { color: inherit; }
  #wikiPop .cap { font-size: 11.5px; color: var(--ink-soft); padding: 5px 9px 3px; }

  /* ---------- 연결(백링크) 줄 ---------- */
  .rel { margin-top: 11px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .rel .relhead { font-size: 12px; color: var(--ink-soft); font-weight: 700; margin-bottom: 6px; }
  .rel .relchips { display: flex; gap: 5px; flex-wrap: wrap; }
  .relchip {
    font-size: 12.5px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 999px; padding: 3px 10px; cursor: pointer; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .relchip:hover { border-color: var(--brand); color: var(--brand); }
  .relchip.out::before { content: "→ "; color: var(--ink-soft); }
  .relchip.in::before { content: "← "; color: var(--ink-soft); }
  .relchip.missing { border-style: dashed; color: var(--warn); }
  .entry.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--brand); } 100% { box-shadow: var(--shadow); } }

  /* ---------- 관계망 ---------- */
  .graphmodal { max-width: min(1100px, 96vw); height: min(86vh, 820px); }
  .graphmodal .mbody { padding: 0; flex: 1 1 auto; position: relative; overflow: hidden; }
  #graphCanvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #graphCanvas.grabbing { cursor: grabbing; }
  .graphtools {
    position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: var(--shadow);
    max-width: calc(100% - 20px);
  }
  .graphtools .inp { width: 150px; padding: 5px 9px; }
  .graphlegend {
    position: absolute; right: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); font-size: 12px; max-width: 190px;
  }
  .graphlegend .lg { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .graphlegend .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .graphempty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                text-align: center; color: var(--ink-soft); font-size: 14px; padding: 30px; }

  /* ---------- 영상·소리 미리보기 ---------- */
  .media video, .media audio { width: 200px; border-radius: 8px; background: #000; }
  .media audio { background: transparent; }
  .content video { max-width: 100%; max-height: 360px; border-radius: 10px; background: #000; display: block; border: 1px solid var(--line); }
  .content audio { width: 100%; max-width: 420px; display: block; }
  .driveframe { width: 100%; aspect-ratio: 16/9; border: 1px solid var(--line); border-radius: 10px; background: #000; }
  .playbtn {
    display: flex; align-items: center; gap: 10px; width: 100%; max-width: 420px;
    border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 14px;
    color: var(--ink); font-size: 13.5px; text-align: left;
  }
  .playbtn:hover { border-color: var(--brand); color: var(--brand); }
  .playbtn .pi { font-size: 26px; line-height: 1; }
  .playbtn small { display: block; color: var(--ink-soft); font-size: 11.5px; }

  /* ---------- 사진 여러 장 · 슬라이드 ---------- */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin: 0 0 10px; }
  .gallery button { padding: 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--bg); position: relative; aspect-ratio: 1; }
  .gallery button:hover { border-color: var(--brand); }
  .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery .more { position: absolute; inset: 0; background: rgba(15,20,35,.62); color: #fff;
                   display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; }
  .galcap { font-size: 12px; color: var(--ink-soft); margin: -4px 0 10px; }

  /* 사진 창은 무엇보다 위에. (전체 보기가 140 이라 130 이면 그 뒤에 깔린다) */
  .lightbox { position: fixed; inset: 0; z-index: 160; background: rgba(8,10,18,.94);
              display: flex; flex-direction: column; touch-action: none; }
  .lb-fail { color: #f3c6c6; font-size: 14px; text-align: center; padding: 20px; line-height: 1.7; }
  .lb-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; color: #e8ecf4; font-size: 13.5px; }
  .lb-top .spacer { flex: 1 1 auto; }
  .lb-count { font-variant-numeric: tabular-nums; opacity: .8; }
  .lb-btn { background: rgba(255,255,255,.12); border: none; color: #fff; border-radius: 9px;
            padding: 8px 12px; font-size: 14px; font-weight: 700; }
  .lb-btn:hover { background: rgba(255,255,255,.24); }
  .lb-stage { flex: 1 1 auto; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .lb-stage img { max-width: 94%; max-height: 100%; object-fit: contain; border-radius: 6px; user-select: none; -webkit-user-drag: none; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.14);
            border: none; color: #fff; font-size: 26px; width: 46px; height: 66px; border-radius: 10px; }
  .lb-nav:hover { background: rgba(255,255,255,.28); }
  .lb-nav.prev { left: 10px; } .lb-nav.next { right: 10px; }
  .lb-nav:disabled { opacity: .2; }
  .lb-cap { padding: 10px 16px 16px; color: #cbd5e1; font-size: 13px; text-align: center; min-height: 20px; }
  .lb-strip { display: flex; gap: 6px; padding: 0 12px 14px; overflow-x: auto; justify-content: center; }
  .lb-strip img { width: 54px; height: 54px; object-fit: cover; border-radius: 7px; opacity: .45; cursor: pointer; border: 2px solid transparent; }
  .lb-strip img.on { opacity: 1; border-color: #7d9dff; }
  @media (max-width: 700px) { .lb-nav { width: 38px; height: 56px; font-size: 22px; } .lb-strip { display: none; } }

  /* ---------- 코드 삽입 ---------- */
  /* 삽입한 페이지는 모서리를 끌어 크기를 바꿀 수 있게 한다 */
  .embedbox { position: relative; width: 100%; margin: 0 0 6px; padding-bottom: 15px;
              resize: vertical; overflow: hidden; min-height: 120px;
              border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .embedbox > iframe.embedframe { width: 100%; height: 100%; border: none; border-radius: 10px 10px 0 0; display: block; }
  .embedhint { font-size: 11.5px; color: var(--ink-soft); margin: -2px 0 10px; }
  /* 보드(카드)에서는 삽입한 페이지가 미리보기를 다 차지하지 않게 줄여 둔다.
     원래 크기로 보려면 「전체 보기」에서. */
  #list .entry .content .embedbox { max-height: 170px; }
  #list .entry .content .embedhint { display: none; }
  .embedframe { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); display: block; }
  .block.embed textarea { font-size: 12.5px; }


  /* ---------- 엮어내기 (고른 기록 → 한 권) ---------- */
  .picklist { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .pickrow { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-bottom: 1px solid var(--line-soft);
             font-size: 13.5px; cursor: pointer; }
  .pickrow:last-child { border-bottom: none; }
  .pickrow:hover { background: var(--panel); }
  .pickrow input { width: 17px; height: 17px; flex: 0 0 auto; }
  .pickrow .pico { flex: 0 0 auto; }
  .pickrow .pttl { flex: 1 1 auto; min-width: 0; font-weight: 600;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pickrow .pmeta { flex: 0 0 auto; font-size: 11.5px; color: var(--ink-soft); }
  .optrow { display: flex; align-items: flex-start; gap: 9px; padding: 7px 2px; cursor: pointer; font-size: 13.5px; }
  .optrow input { width: 17px; height: 17px; margin-top: 2px; flex: 0 0 auto; }
  .optrow small { display: block; color: var(--ink-soft); font-size: 12px; font-weight: 400; margin-top: 1px; }

  /* ---------- 링크 미리보기 ---------- */
  .linkcard { display: flex; gap: 10px; align-items: center; max-width: 100%;
              border: 1px solid var(--line); border-radius: 11px; padding: 8px 11px;
              background: var(--bg); text-decoration: none; color: var(--ink); margin: 0 0 8px; }
  .linkcard:hover { border-color: var(--brand); }
  .linkcard .lc-ico { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 7px;
                      object-fit: contain; background: var(--panel); padding: 3px; }
  .linkcard .lc-body { min-width: 0; flex: 1 1 auto; }
  .linkcard .lc-title { font-size: 13.5px; font-weight: 700; line-height: 1.4;
                        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linkcard .lc-host { font-size: 11.5px; color: var(--ink-soft);
                       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linkcard .lc-thumb { width: 92px; height: 58px; flex: 0 0 auto; border-radius: 8px;
                        object-fit: cover; background: var(--line-soft); }
  @media (max-width: 700px) { .linkcard .lc-thumb { width: 68px; height: 44px; } }

  /* ---------- 전체 보기 (한 편을 통째로 읽는 화면) ---------- */
  .viewer { position: fixed; inset: 0; z-index: 140; background: var(--bg); display: flex; flex-direction: column; }
  .vtop { display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
          padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .vtop .spacer { flex: 1 1 auto; }
  .vscroll { flex: 1 1 auto; overflow: auto; }
  .vpaper { max-width: 800px; margin: 24px auto 64px; background: var(--panel);
            border: 1px solid var(--line); border-radius: 14px; padding: 36px 40px; box-shadow: var(--shadow); }
  .vpaper h1 { margin: 8px 0 10px; font-size: 26px; line-height: 1.35; }
  .vmeta { font-size: 13px; color: var(--ink-soft); }
  .vpaper .content { max-height: none; overflow: visible; font-size: 15.5px; }
  .vpaper .content::after { display: none; }
  .vpaper .content figure img { max-height: none; }
  .vrel { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); }
  .vrel h4 { margin: 0 0 8px; font-size: 14px; color: var(--ink-soft); }
  @media (max-width: 700px) { .vpaper { margin: 12px; padding: 22px 18px; } .vpaper h1 { font-size: 21px; } }

  /* 인쇄 = PDF 저장. 전체 보기 화면만 종이에 남긴다 */
  @media print {
    body > *:not(#modalHost) { display: none !important; }
    #modalHost .viewer { position: static; background: #fff; }
    .vtop { display: none !important; }
    .vscroll { overflow: visible; }
    .vpaper { max-width: none; margin: 0; padding: 0; border: none; border-radius: 0; box-shadow: none; background: #fff; }
    .vpaper .content figure img { max-height: 420px; }
    .embedbox, .embedhint, .content video, .content audio { display: none !important; }
  }

  /* ---------- 보기 방식 전환 ---------- */
  .viewswitch { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
  .vbtn { border: none; background: transparent; color: var(--ink-soft); font-size: 12.5px; font-weight: 700;
          padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
  .vbtn.on { background: var(--panel); color: var(--brand); box-shadow: 0 1px 2px rgba(20,30,60,.08); }

  /* 바둑판 — 카드 길이를 하나로 맞춘다 */
  #list.gridview { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
                   gap: 12px; align-items: stretch; }
  #list.gridview .entry { margin-bottom: 0; height: 340px; display: flex; flex-direction: column; overflow: hidden; }
  #list.gridview .head, #list.gridview .tags { flex: 0 0 auto; }
  /* 내용은 남는 높이만큼만 차지하고, 넘치면 아래로 흐리게 잘린다 */
  #list.gridview .content { flex: 1 1 auto; min-height: 0; max-height: none; overflow: hidden; position: relative; }
  #list.gridview .content.collapsed::after { display: none; }
  #list.gridview .content::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0;
                                   height: 44px; background: linear-gradient(transparent, var(--panel)); pointer-events: none; }
  #list.gridview .foot { flex: 0 0 auto; margin-top: 0; flex-wrap: nowrap; gap: 5px; }
  #list.gridview .foot .sdtxt { display: none; }        /* 좁으니 저장 상태는 아이콘만 (툴팁에 전체) */
  #list.gridview .foot .btn { padding: 7px 9px; font-size: 13px; white-space: nowrap; }
  #list.gridview .morebtn { display: none; }
  #list.gridview .content figure img { max-height: 150px; }
  #list.gridview .rel { display: none; }
  @media (max-width: 700px) { #list.gridview { grid-template-columns: 1fr 1fr; gap: 8px; }
    #list.gridview .entry { padding: 11px; height: 290px; }
    #list.gridview .head h3 { font-size: 14.5px; } }

  /* 목록 */
  .listview { padding: 4px; }
  .lrow { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 9px; }
  .lrow:hover { background: var(--bg); }
  .lrow + .lrow { border-top: 1px solid var(--line-soft); }
  .lico { flex: 0 0 auto; font-size: 15px; }
  .ltitle { flex: 1 1 auto; min-width: 0; text-align: left; border: none; background: transparent;
            color: var(--ink); font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ltitle:hover { color: var(--brand); }
  .lmeta { flex: 0 0 auto; font-size: 11.5px; color: var(--ink-soft); }
  .lwhen { flex: 0 0 auto; font-size: 11.5px; color: var(--ink-soft); width: 78px; text-align: right; }
  @media (max-width: 700px) { .lmeta { display: none; } .lwhen { width: 62px; } }

  /* ---------- 관계망 정보 패널 ---------- */
  .graphpanel {
    position: absolute; right: 10px; top: 10px; width: 260px; max-height: calc(100% - 20px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px;
  }
  .gp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
  .gp-title { margin: 0 0 2px; font-size: 15px; }
  .gp-when { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 8px; }
  .gp-preview { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 10px; }
  .gp-sec { border-top: 1px solid var(--line-soft); padding-top: 8px; margin-bottom: 8px; }
  .gp-lab { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 5px; }
  .gp-none { font-size: 12px; color: var(--ink-soft); opacity: .7; padding: 2px 0 4px; }
  .gp-row { display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
  .gp-go { flex: 1 1 auto; min-width: 0; text-align: left; border: none; background: var(--bg); color: var(--ink);
           font-size: 12.5px; padding: 5px 8px; border-radius: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gp-go:hover { background: var(--brand-soft); color: var(--brand); }
  .gp-via { font-size: 10.5px; color: var(--ink-soft); flex: 0 0 auto; }
  .gp-acts { display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line-soft); padding-top: 9px; }
  .gp-acts .btn { flex: 1 1 auto; }
  .graphhint {
    position: absolute; left: 50%; transform: translateX(-50%); top: 10px; z-index: 5;
    background: #1a9e5f; color: #fff; font-size: 12.5px; font-weight: 600;
    padding: 9px 14px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.2); max-width: 92%; text-align: center;
  }
  @media (max-width: 700px) {
    .graphpanel { right: 6px; left: 6px; width: auto; top: auto; bottom: 6px; max-height: 46%; }
    .graphhint { top: auto; bottom: 8px; font-size: 12px; }
  }

  /* ---------- 도움말 ---------- */
  .help-block { margin-bottom: 20px; }
  .help-block h4 { margin: 0 0 7px; font-size: 15px; }
  .help-block p { margin: 0 0 7px; font-size: 13.8px; line-height: 1.72; }
  .help-ex {
    background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--brand);
    border-radius: 8px; padding: 10px 12px; margin: 8px 0 10px; white-space: pre-wrap;
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; line-height: 1.7; color: var(--ink);
  }

  /* ---------- 전체 화면 드래그&드롭 ---------- */
  .dropoverlay { position: fixed; inset: 0; z-index: 120; background: rgba(47,95,214,.18);
                 backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .dropcard { background: var(--panel); border: 3px dashed var(--brand); color: var(--brand);
              border-radius: 18px; padding: 34px 46px; font-size: 18px; font-weight: 800; text-align: center; line-height: 1.7;
              box-shadow: 0 20px 60px rgba(20,30,60,.25); }

  /* ---------- 화면 캡처 · 영역 선택 ---------- */
  .cropwrap { position: relative; display: inline-block; line-height: 0; touch-action: none;
              border-radius: 10px; overflow: hidden; border: 1px solid var(--line); cursor: crosshair; }
  .cropwrap img { display: block; max-width: 100%; max-height: 58vh; width: auto; height: auto;
                  user-select: none; -webkit-user-drag: none; }
  .cropshade { position: absolute; inset: 0; background: rgba(10,15,30,.55); pointer-events: none; }
  .cropsel { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(10,15,30,.55);
             pointer-events: none; border-radius: 2px; }
  .cropsel::after { content: ""; position: absolute; inset: -2px; border: 1px dashed var(--brand); }
  .cropsize { position: absolute; left: 0; top: -22px; font-size: 11.5px; font-weight: 700; color: #fff;
              background: var(--brand); padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
  .crophint { font-size: 12.5px; color: var(--ink-soft); margin: 10px 0 0; }
  .modebar { display: flex; gap: 6px; justify-content: center; margin: 0 0 12px; flex-wrap: wrap; }

  /* 손 메모 판 — 손가락으로 그릴 때 화면이 같이 밀리면 안 된다 */
  .drawwrap { width: 100%; display: flex; justify-content: center; }
  .drawpad { display: block; margin: 0 auto; background: #fff; border: 1px solid var(--line);
             border-radius: 10px; touch-action: none; cursor: crosshair; }

  /* 웹캠 미리보기 — 규칙이 없으면 1920x1080 원본이 그대로 나와 모달을 뚫는다 */
  .camview { display: block; width: 100%; height: auto; max-width: 100%; max-height: 58vh;
             object-fit: contain; background: #000; border-radius: 10px; border: 1px solid var(--line); }
  @media (max-width: 700px) { .camview { max-height: 52vh; } }

  /* ---------- 선택 시트 (사진 넣는 방법 고르기) ---------- */
  .sheet .mbody { padding: 14px 18px 18px; }
  .sheetbtn {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 14px 16px; border-radius: 12px; margin-bottom: 8px; font-weight: 700; font-size: 15px;
  }
  .sheetbtn:hover { border-color: var(--brand); color: var(--brand); }
  .sheetbtn .em { font-size: 24px; line-height: 1; flex: 0 0 auto; }
  .sheetbtn small { display: block; font-weight: 500; font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .sheetbtn:hover small { color: inherit; }
  .sheetnote { font-size: 12.5px; color: var(--ink-soft); background: var(--bg);
               border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
  .sheettoggle { display: flex; align-items: center; gap: 8px; font-size: 13.5px; padding: 4px 2px; }

  /* ---------- 동기화 표시 ---------- */
  .syncpill { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .syncpill.busy { color: var(--brand); }

  /* ---------- 모바일 ---------- */
  @media (max-width: 700px) {
    /* iOS 가 입력칸에서 자동 확대하지 않도록 16px 이상 유지 */
    .inp, input, textarea, select { font-size: 16px; }
    .wrap { padding: 0 12px 96px; }
    .top-inner { padding: 8px 12px; gap: 7px; }
    .acct { display: none; }
    .btn { padding: 9px 13px; }
    .btn.sm { padding: 8px 11px; font-size: 13.5px; }
    .btn.xs { padding: 6px 10px; font-size: 13px; }
    .composer, .entry { padding: 14px; }
    .grid2 { gap: 8px; }
    .addbar { position: sticky; bottom: 0; z-index: 20; background: var(--panel);
              box-shadow: 0 -6px 18px rgba(20,30,60,.08); }
    .addbar .btn { flex: 1 1 30%; text-align: center; }
    .addhint { font-size: 11.5px; }
    .bhead .btn.xs { min-width: 40px; }
    .media .thumb, .media .ficon { width: 72px; height: 72px; }
    .toolbar .search { flex: 1 1 100%; max-width: none; order: 9; }
    .modal-bg { padding: 0; align-items: flex-end; }
    .modal { max-width: none; max-height: 92vh; border-radius: 16px 16px 0 0; }
    .graphmodal { height: 92vh; max-width: none; }
    .graphtools .inp { width: 110px; }
    .graphlegend { display: none; }
    .modal .mhead, .modal .mfoot { padding: 13px 14px; }
    .modal .mbody { padding: 14px; }
    .tabs { padding: 8px 12px 0; }
    .tab { padding: 8px 10px; font-size: 13px; }
    .typerow { flex-wrap: wrap; }
    .typerow .nm { flex: 1 1 120px; }
    .cropwrap { max-width: 100%; }
    .dropcard { padding: 24px 28px; font-size: 16px; }
  }

  footer.site { text-align: center; color: var(--ink-soft); font-size: 12.5px; padding: 30px 0 10px; }
  footer.site a { color: var(--ink-soft); }
</style>
</head>
<body>

<div id="progress"></div>

<header class="top">
  <div class="top-inner">
    <div class="logo">🧠 PKEMS <small>개인 지식·경험 기록장</small></div>
    <div class="spacer"></div>
    <span id="syncPill" class="syncpill"></span>
    <span id="acct" class="acct"></span>
    <button id="btnHelp" class="btn sm" title="연결·백링크·관계망 사용법">❔</button>
    <button id="btnInstall" class="btn sm" style="display:none" title="이 기록장을 내 컴퓨터에 앱으로 설치합니다">⬇ 앱으로 설치</button>
    <button id="btnGraph" class="btn sm">🕸️ 관계망</button>
    <button id="btnSettings" class="btn sm">⚙️ 설정</button>
    <button id="btnLogin" class="btn sm primary">구글 로그인</button>
  </div>
</header>

<div class="wrap">

  <div id="banner" class="banner warn"></div>

  <!-- ================= 에디터 ================= -->
  <div id="draftBar" class="banner draft hidden"></div>

  <section class="card composer">
    <h2 id="composerTitle">✍️ 새 기록</h2>

    <div class="chips" id="typeChips" style="margin-bottom:12px;"></div>

    <div class="grid2">
      <div class="field" style="margin-bottom:12px;">
        <label for="title">제목</label>
        <input id="title" class="inp" placeholder="무엇에 대한 기록인가요?" />
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label for="tags">태그 <span style="font-weight:400;color:var(--ink-soft)">(쉼표로 구분)</span></label>
        <input id="tags" class="inp" placeholder="수업, 에듀테크, 회고" />
      </div>
    </div>

    <div class="field">
      <label>내용 <span style="font-weight:400;color:var(--ink-soft)">— 글·사진·링크를 원하는 순서로 계속 이어 붙이세요</span></label>
      <div id="blocks"></div>
      <div class="addbar" id="addbar">
        <button class="btn sm" data-add="heading">＋ 소제목</button>
        <button class="btn sm" data-add="text">＋ 글</button>
        <button class="btn sm" data-add="quote">＋ 인용</button>
        <button class="btn sm" data-add="capture">＋ 캡처</button>
        <button class="btn sm" data-add="image">＋ 사진</button>
        <button class="btn sm" data-add="draw">＋ 손 메모</button>
        <button class="btn sm" data-add="file">＋ 파일·영상</button>
        <button class="btn sm" data-add="link">＋ 링크</button>
        <button class="btn sm" data-add="embed">＋ 코드 삽입</button>
        <button class="btn sm" data-add="divider">＋ 구분선</button>
        <div class="addhint">
          파일은 <b>화면 아무 곳에나 끌어다 놓으면</b> 추가됩니다. 글 칸에 이미지 붙여넣기(Ctrl+V)도 됩니다.
          영상은 <b>200MB(1080p 기준 약 10~15분)</b> 까지 — 더 길면 유튜브에 «일부공개»로 올리고 <b>＋코드 삽입</b> 에 주소를 붙여넣으세요.

  /* ---- 아직 업로드하지 않은 첨부는 IndexedDB 에 둔다 ----

  var idbOK = true;
  function idb() {
    return new Promise(function (res, rej) {
      if (!idbOK || !window.indexedDB) { rej(new Error("no-idb")); return; }
      var r = indexedDB.open("pkems", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("pending"); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { idbOK = false; rej(r.error); };
    });

  function idbRun(mode, fn) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction("pending", mode);
        var out = fn(tx.objectStore("pending"));
        tx.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function idbPut(k, v) { return idbRun("readwrite", function (s) { s.put(v, k); }).catch(function () { idbOK = false; }); }
  function idbDel(k) { return idbRun("readwrite", function (s) { s.delete(k); }).catch(function () {}); }
  function idbAll() {
    return idb().then(function (db) {
      return new Promise(function (res) {
        var out = {}, tx = db.transaction("pending", "readonly");
        var req = tx.objectStore("pending").openCursor();
        req.onsuccess = function () {
          var c = req.result;
          if (c) { out[c.key] = c.value; c.continue(); } else res(out);
        };
        req.onerror = function () { res(out); };
      });
    }).catch(function () { return {}; });
  }

  function stashPending() {
    if (!idbOK) return Promise.resolve();
    var jobs = [];
    entries.forEach(function (n) {
      (n.blocks || []).forEach(function (b) {

      });
    });
    return Promise.all(jobs);
  }
  function saveLocal() {
    stashPending();

      localStorage.setItem(LS.entries, JSON.stringify(entries, function (k, v) {

  function rehydratePending() {

      entries.forEach(function (n) {

          if ((b.kind === "image" || b.kind === "file") && !b.fileId) {
            used[b.id] = 1;
            if (!b.blob && map[b.id]) {
              // 예전 버전은 base64 문자열로 저장했으므로 Blob 으로 바꿔 준다
              var v = map[b.id];

              if (v instanceof Blob) { b.blob = v; changed = true; }
              else idbDel(b.id);   // 못 쓰는 값이면 버린다
            }

        });

      var d = safeParse(localStorage.getItem(LS.draft));
      if (d && d.blocks) d.blocks.forEach(function (b) { used[b.id] = 1; });
      Object.keys(map).forEach(function (k) { if (!used[k]) idbDel(k); });

    });

    return (list || []).map(function (n) {

        });
      });
      (n.links || []).forEach(function (l) { bl.push({ id: uid(), kind: "link", url: l.url, label: l.label }); });

        .forEach(function (p) {

  function gisReady() { return typeof google !== "undefined" && google.accounts && google.accounts.oauth2; }

  /* ---- 토큰을 브라우저에 보관한다 ----

     «새로고침 = 로그아웃» 이었다. 특히 폰에서 앱으로 설치해 쓰면
     조용히 다시 받는 길(계정 쿠키)이 막혀 있어서 매번 풀렸다.
     이제 만료시각까지 담아 두고, 남은 시간이 있으면 그대로 이어 쓴다.
     ⚠️ 로그아웃하면 반드시 지운다. 이건 드라이브를 열 수 있는 열쇠다. */
  function saveToken(tok, expiresIn) {
    try {

  /* =========================================================
     4. 드라이브 기본 동작
     ========================================================= */
  function parseFolderId(input) {
    var s = String(input || "").trim();
    if (!s) return "";
    var m = /\/folders\/([A-Za-z0-9_-]+)/.exec(s); if (m) return m[1];
    m = /[?&]id=([A-Za-z0-9_-]+)/.exec(s); if (m) return m[1];
    m = /\/d\/([A-Za-z0-9_-]+)/.exec(s); if (m) return m[1];
    if (/^[A-Za-z0-9_-]{10,}$/.test(s)) return s;
    return "";
  }
  function verifyFolder(id) {
    return driveJson("https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(id) +
      "?fields=id,name,mimeType,webViewLink&supportsAllDrives=true").then(function (f) {
        if (f.mimeType !== "application/vnd.google-apps.folder") throw new Error("폴더가 아닙니다. 폴더 링크를 넣어 주세요.");

  function qEsc(s) { return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }

    var q = "name='" + qEsc(name) + "' and '" + parentId + "' in parents and trashed=false";
    return driveJson("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
      "&fields=files(id,name)&supportsAllDrives=true&includeItemsFromAllDrives=true")
      .then(function (j) { return (j.files && j.files.length) ? j.files[0].id : null; });
  }
  function createFolder(name, parentId) {
    return driveJson("https://www.googleapis.com/drive/v3/files?fields=id,name&supportsAllDrives=true", {
      method: "POST", headers: { "Content-Type": "application/json" },

  var folderCache = {};

    var key = parentId + "/" + name;

    return findInFolder(name, parentId).then(function (id) {

      .then(function (f) {

  function resolveTargets(n) {
    var mode = settings.folderMode;
    if (mode === "flat") return Promise.resolve({ md: folder.id, file: folder.id });
    if (mode === "materials") {

        .then(function (sub) { return { md: folder.id, file: sub }; });
    }
    if (mode === "monthly") {
      var m = dateStamp(n.createdAt).slice(0, 7);
      return ensureNamedFolder(m, folder.id).then(function (id) { return { md: id, file: id }; });
    }

      .then(function (nm) { return createFolder(nm, folder.id); })
      .then(function (f) {

    var jobs = [];
    if (n.mdId) jobs.push(moveToParent(n.mdId, t.md));
    (n.blocks || []).forEach(function (b) {

  // mediaType 을 따로 주면 "저장될 형식"과 "올리는 본문 형식"을 다르게 할 수 있다.

  /* ---- 조각 하나를 보낸다 ----
     ⚠️ fetch 가 아니라 XMLHttpRequest 를 쓴다. fetch 는 «올라가는 중» 진행률을

        폰에서 8MB 한 조각은 20~60초다 — 그동안 0% 에 붙어 있었던 것.

  function putChunk(sessionUrl, body, contentRange, onBytes) {

  function putChunks(sessionUrl, blob, onProgress) {

    function askPosition() {
      return putChunk(sessionUrl, null, "bytes */" + total, null).then(function (r) {
        if (r.status === 200 || r.status === 201) return { finished: safeParse(r.text) || {} };
        if (r.status === 308) {

        function (loaded) { report(start + loaded); })
        .then(function (r) {

          }
          if (r.status === 200 || r.status === 201) { report(total); return safeParse(r.text) || {}; }
          if (r.status === 401) {
            return renewQuietly().then(function () { return step(start, fails); });
          }
          // 429·5xx·사용량 초과 — 기다렸다 «받은 데까지» 확인하고 이어 붙인다
          if (r.status === 429 || r.status >= 500 || (r.status === 403 && /rate|quota|limit/i.test(r.text))) {

            throw e;
          }
          return waitThenResume(fails);
        });

      function waitThenResume(n) {
        var wait = Math.min(15000, 800 * Math.pow(2, n)) + Math.random() * 500;
        if (onProgress) onProgress(-1);   // «잠시 기다리는 중» 표시
        return sleep(wait)
          .then(waitOnline)
          .then(askPosition)
          .then(function (p) {
            if (p.finished) { report(total); return p.finished; }
            report(p.at);
            return step(p.at, n + 1);
          });

      return new Promise(function (res) {

  function uploadAttachment(b, parentId, onProgress) {

      .catch(function (e) {

        // 한도를 훨씬 낮게 잡는다. 여기까지 왔다는 건 이미 여러 번 이어 붙이기를 시도한 뒤다.

  function trashFile(id) {

  // 같은 폴더에 같은 이름이 있으면 -2, -3 … 을 붙인다

      .then(function (j) {

        if (!used[name]) return name;
        var i = 2;
        while (used[stem + "-" + i + ext]) i++;
        return stem + "-" + i + ext;

  /* =========================================================
     5. 파일 이름 규칙
     ========================================================= */
  // 연결된 드라이브 폴더 이름 (파일명 앞머리에 붙이는 용도)
  function folderLabel() { return safeName(folder.name, 30); }
  function subfolderLabel() {
    if (settings.folderMode === "materials") return safeName(settings.materialsFolderName, 30);
    if (settings.folderMode === "monthly") return dateStamp().slice(0, 7);
    return "";
  }

  function applyPattern(pattern, ctx) {
    var out = String(pattern || "").replace(/\{([^}]*)\}/g, function (m, k) {
      switch (k) {
        case "폴더명": return ctx.folder;
        case "하위폴더": return ctx.subfolder;
        case "날짜": return ctx.date;
        case "시간": return ctx.time;
        case "유형": return ctx.type;
        case "제목": return ctx.title;
        case "번호": return ctx.no;
        case "원본이름": return ctx.stem;
        case "확장자": return ctx.ext.replace(/^\./, "");
        default: return "";
      }
    });
    out = safeName(out, 110);
    // 빈 토큰 때문에 생긴 중복 구분자를 정리한다 (예: 폴더 미연결 시 "_2026-08-16_…")
    out = out.replace(/_{2,}/g, "_").replace(/^[_\s-]+/, "").replace(/[_\s-]+$/, "");
    return out || "무제";
  }
  function nameContext(entry, order, original, ext) {
    return {
      folder: folderLabel(), subfolder: subfolderLabel(),
      date: dateStamp(entry.createdAt), time: timeStamp(entry.createdAt),
      type: typeOf(entry.type).label,
      title: safeName(entry.title, 40) || "무제",
      no: pad2(order || 1),
      stem: safeName(stemOf(original || ""), 40),
      ext: ext || ""
    };
  }
  function attachName(entry, order, original) {
    var ext = extOf(original);
    var ctx = nameContext(entry, order, original, ext);
    if (!ctx.stem) ctx.stem = "파일";
    var name = applyPattern(settings.filePattern, ctx);
    if (settings.filePattern.indexOf("{확장자}") < 0) name += ext;
    return name;
  }
  function mdName(entry) {
    var ctx = nameContext(entry, 1, "", ".md");

    return applyPattern(settings.mdPattern, ctx) + ".md";
  }
  function patternPreview(pattern, isMd) {
    var ctx = {
      folder: folderLabel() || "기록폴더", subfolder: subfolderLabel() || "자료",
      date: dateStamp(), time: timeStamp(),
      type: typeOf(currentType).label,
      title: safeName($("title") && $("title").value, 40) || "수업 회고",
      no: "01", stem: "IMG_4821", ext: isMd ? ".md" : ".png"

    if (isMd) return out + ".md";

  }

  /* =========================================================
     5-2. 위키링크 [[제목]] · 백링크
     ========================================================= */
  // [[제목]] 또는 [[제목|보일 글자]]
  function wikiRe() { return /\[\[([^\[\]|]+?)(?:\|([^\[\]]*?))?\]\]/g; }
  function normTitle(s) { return String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g, " "); }
  function isTextBlock(b) { return b.kind === "text" || b.kind === "quote" || b.kind === "heading"; }

  var _linkCache = null;   // { byTitle, out, back } — 렌더 한 번당 한 번만 계산
  function invalidateLinks() { _linkCache = null; }

  function linkData() {
    if (_linkCache) return _linkCache;
    var byTitle = {}, out = {}, back = {};
    entries.forEach(function (n) {
      var k = normTitle(n.title);
      if (k && !byTitle[k]) byTitle[k] = n;
    });
    var byId = {};
    entries.forEach(function (n) { byId[n.id] = n; });
    entries.forEach(function (n) {
      var seen = {}, list = [];
      // ① 글 안에 쓴 [[제목]]
      (n.blocks || []).forEach(function (b) {
        if (!isTextBlock(b)) return;
        var re = wikiRe(), m;
        while ((m = re.exec(b.text || ""))) {
          var target = (m[1] || "").trim();
          var k = normTitle(target);
          if (!k || seen[k]) continue;
          seen[k] = 1;
          list.push({ title: target, key: k, to: byTitle[k] ? byTitle[k].id : null, via: "text", label: "" });
        }
      });
      // ② 관계망에서 직접 이어준 연결 (설명이 붙을 수 있음)
      (n.relations || []).forEach(function (r) {
        var tgt = byId[r.to];
        if (!tgt) return;
        var k = normTitle(tgt.title);
        var already = null;
        for (var i = 0; i < list.length; i++) if (list[i].key === k) { already = list[i]; break; }
        if (already) {
          already.via = "both";
          if (r.label && !already.label) already.label = r.label;
          return;
        }
        seen[k] = 1;
        list.push({ title: tgt.title, key: k, to: tgt.id, via: "relation", label: r.label || "" });
      });
      out[n.id] = list;
      list.forEach(function (l) {
        if (!l.to || l.to === n.id) return;
        (back[l.to] = back[l.to] || []).push({ from: n.id, label: l.label || "" });
      });
    });
    _linkCache = { byTitle: byTitle, out: out, back: back };
    return _linkCache;
  }
  function outLinks(n) { return linkData().out[n.id] || []; }
  function backLinks(n) {
    var list = linkData().back[n.id] || [];
    return list.map(function (b) {
      var e = entries.filter(function (x) { return x.id === b.from; })[0];
      return e ? { entry: e, label: b.label || "" } : null;
    }).filter(Boolean);
  }
  // 관계망에서 만든 연결 추가·삭제
  function addRelation(fromId, toId, label) {
    if (!fromId || !toId || fromId === toId) return false;
    var n = entries.filter(function (x) { return x.id === fromId; })[0];
    if (!n) return false;
    n.relations = n.relations || [];
    var found = null;
    n.relations.forEach(function (r) { if (r.to === toId) found = r; });
    if (found) found.label = label || found.label;
    else n.relations.push({ to: toId, label: label || "" });
    n.updatedAt = Date.now(); n._dirty = true;
    invalidateLinks(); saveLocal(); render();
    if (connected) syncPending();
    return true;
  }
  function removeRelation(fromId, toId) {
    var n = entries.filter(function (x) { return x.id === fromId; })[0];
    if (!n || !n.relations) return;
    n.relations = n.relations.filter(function (r) { return r.to !== toId; });
    n.updatedAt = Date.now(); n._dirty = true;
    invalidateLinks(); saveLocal(); render();
    if (connected) syncPending();
  }

  // 목록에서 해당 기록으로 이동 + 잠깐 강조
  function gotoEntry(id) {
    closeModal();
    if (filterType !== "all" || searchQ || filterTags.length) {
      filterType = "all"; searchQ = ""; filterTags = []; $("search").value = ""; render();
    }
    expanded[id] = true;
    render();
    setTimeout(function () {
      var card = document.querySelector('[data-eid="' + id + '"]');
      if (!card) return;
      card.scrollIntoView({ behavior: "smooth", block: "center" });
      card.classList.add("flash");
      setTimeout(function () { card.classList.remove("flash"); }, 1500);
    }, 30);
  }
  // 아직 없는 제목을 눌렀을 때 — 그 제목으로 새 기록 시작
  function startNewFromLink(title) {
    if (editingId || hasContent() || $("title").value.trim()) {
      if (!window.confirm("작성 중인 내용을 두고 「" + title + "」 새 기록을 시작할까요?")) return;
    }
    closeModal();
    resetComposer();
    $("title").value = title;
    addBlock("text");
    window.scrollTo({ top: 0, behavior: "smooth" });
    toast("「" + title + "」 기록을 새로 시작합니다.");
  }
  function wikiLinkEl(target, label) {
    var found = findByTitle(target);
    var a = el("a", "wikilink" + (found ? "" : " missing"), label || target);
    a.href = "javascript:void(0)";
    a.title = found ? "이동: " + found.title : "아직 없는 기록 — 눌러서 만들기";
    a.addEventListener("click", function (e) {

  }
  // 텍스트를 [[링크]] 가 살아 있는 노드들로 붙인다
  function appendRichText(host, text) {

    while ((m = re.exec(s))) {

  /* =========================================================
     6. 마크다운 생성
     ========================================================= */
  function yq(s) { return '"' + String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"'; }
  function mediaPath(f) {
    // .md 파일이 있는 위치에서 자료까지의 상대 경로
    var dir = (settings.folderMode === "materials") ? ((settings.materialsFolderName || "자료") + "/") : "";
    var p = dir + (f.name || "");
    // 마크다운 링크 안의 공백은 <> 로 감싸야 대부분의 뷰어에서 깨지지 않는다

  function driveLink(id) { return "https://drive.google.com/file/d/" + id + "/view"; }

  /* ---------- 링크로 공유 ----------
     구글 문서에 «링크가 있는 사람 = 읽기» 권한을 얹고 그 주소를 준다.
     ⚠️ HTML 파일로는 안 된다. 드라이브는 2016년에 웹페이지로 열어주는 기능을 없앴다.
        .md 도 글자만 보이는 화면이라, 사람에게 보내는 것은 구글 문서가 맞다. */
  function shareToAnyone(fileId) {
    return driveJson("https://www.googleapis.com/drive/v3/files/" + fileId +
      "/permissions?supportsAllDrives=true&fields=id", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ role: "reader", type: "anyone" })

  }
  function stopSharing(fileId) {
    return driveJson("https://www.googleapis.com/drive/v3/files/" + fileId +
      "/permissions?supportsAllDrives=true&fields=permissions(id,type)")
      .then(function (j) {
        var open = (j.permissions || []).filter(function (p) { return p.type === "anyone"; });
        return open.reduce(function (chain, p) {
          return chain.then(function () {
            return driveFetch("https://www.googleapis.com/drive/v3/files/" + fileId +
              "/permissions/" + p.id + "?supportsAllDrives=true", { method: "DELETE" });
          });
        }, Promise.resolve());
      });
  }
  function copyText(s) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(s);
    return new Promise(function (res, rej) {
      var ta = document.createElement("textarea");
      ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove();
      ok ? res() : rej(new Error("복사하지 못했습니다"));
    });
  }

  /* 블록 → 마크다운 본문 줄들. h 는 소제목 단계(2 = "##").
     기록 한 편을 그대로 뽑을 때와, 여러 편을 한 권으로 엮을 때 같이 쓴다. */
  // base: 사진·첨부의 상대경로 앞에 붙일 폴더 (엮어내기에서 쓴다).
  // 한 편짜리 .md 는 자료와 같은 폴더에 있으므로 base 없이 파일 이름만 쓴다.
  function blocksToMarkdown(n, h, base) {
    var hh = new Array((h || 2) + 1).join("#");
    var pre = base || "";
    var L = [];
    (n.blocks || []).forEach(function (b) {
      if (b.kind === "text") {
        if (b.text && b.text.trim()) { L.push(b.text.trim()); L.push(""); }
      } else if (b.kind === "heading") {
        if (b.text && b.text.trim()) { L.push(hh + " " + b.text.trim()); L.push(""); }
      } else if (b.kind === "quote") {
        if (b.text && b.text.trim()) {
          b.text.trim().split("\n").forEach(function (line) { L.push("> " + line); });
          L.push("");
        }
      } else if (b.kind === "divider") {
        L.push("---"); L.push("");
      } else if (b.kind === "image") {
        L.push("![" + (b.caption || b.original || "") + "](" + pre + mediaPath(b) + ")");
        if (b.caption) L.push("*" + b.caption + "*");
        if (b.fileId) L.push("<!-- drive: " + driveLink(b.fileId) + " -->");
        L.push("");
      } else if (b.kind === "file") {
        var line = "📎 [" + (b.caption || b.name || b.original) + "](" + (b.fileId ? driveLink(b.fileId) : pre + mediaPath(b)) + ")";
        if (b.original && b.name && b.original !== b.name) line += " <!-- 원본: " + b.original + " -->";
        L.push(line); L.push("");
      } else if (b.kind === "link") {
        if (b.url) { L.push("🔗 [" + (b.label || b.url) + "](" + b.url + ")"); L.push(""); }
      } else if (b.kind === "embed") {
        // 마크다운은 HTML 을 그대로 품는다 (옵시디언에서도 보임)
        if (b.code && b.code.trim()) { L.push(b.code.trim()); L.push(""); }
      }
    });
    return L;
  }

  function buildMarkdown(n) {
    var media = (n.blocks || []).filter(function (b) { return b.kind === "image" || b.kind === "file"; });
    var links = (n.blocks || []).filter(function (b) { return b.kind === "link"; });
    var L = [];
    L.push("---");
    L.push("id: " + n.id);
    L.push("type: " + typeOf(n.type).label);
    L.push("title: " + yq(n.title));
    // 파일명이 "{날짜}_{유형}_{제목}.md" 라서, 별칭이 없으면 옵시디언이 [[제목]] 을 못 찾습니다
    L.push("aliases: [" + [n.title, n.id].filter(Boolean).map(yq).join(", ") + "]");
    L.push("tags: [" + (n.tags || []).map(yq).join(", ") + "]");
    L.push("created: " + isoDate(n.createdAt));
    L.push("updated: " + isoDate(n.updatedAt));
    if (links.length) {
      L.push("links:");
      links.forEach(function (b) { L.push("  - url: " + yq(b.url)); L.push("    label: " + yq(b.label || "")); });
    }
    if (media.length) {
      L.push("attachments:");
      media.forEach(function (b) {
        L.push("  - file: " + yq(b.name || ""));
        L.push("    original: " + yq(b.original || ""));
        L.push("    mime: " + yq(b.mime || ""));
        if (b.fileId) L.push("    driveId: " + yq(b.fileId));
      });
    }
    L.push("---");
    L.push("");
    L.push("# " + (n.title || "(제목 없음)"));
    L.push("");

    blocksToMarkdown(n, 2).forEach(function (line) { L.push(line); });

    // 관계망에서 이어준 연결 — 옵시디언에서도 링크로 읽힌다
    var rels = (n.relations || []).map(function (r) {
      var t = null;
      entries.forEach(function (x) { if (x.id === r.to) t = x; });
      return t ? { title: t.title, label: r.label || "" } : null;
    }).filter(Boolean);
    if (rels.length) {
      L.push("## 연결"); L.push("");
      rels.forEach(function (r) { L.push("- [[" + r.title + "]]" + (r.label ? " — " + r.label : "")); });
      L.push("");
    }
    return L.join("\n").replace(/\n{3,}/g, "\n\n");
  }

  /* ---------- 사람이 읽기 좋은 형식 (구글 문서 / HTML) ---------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // 사람이 읽는 문서에서는 [[제목]] 대괄호를 벗겨 준다
  function plainLinks(s) {
    return String(s == null ? "" : s).replace(/\[\[([^\[\]|]+?)(?:\|([^\[\]]*?))?\]\]/g, function (m, a, b) {
      return (b && b.trim()) ? b.trim() : a.trim();
    });
  }
  /* 블록 → HTML 조각들. h 는 소제목 단계(2 = h2). 한 편 뽑기와 엮어내기에서 같이 쓴다. */
  function blocksToHtml(n, h) {
    var hn = "h" + (h || 2);
    var H = [];
    (n.blocks || []).forEach(function (b) {
      if (b.kind === "text") {
        plainLinks(b.text).split(/\n{2,}/).forEach(function (para) {
          if (para.trim()) H.push("<p>" + esc(para).replace(/\n/g, "<br />") + "</p>");
        });
      } else if (b.kind === "heading") {
        if (b.text) H.push("<" + hn + ">" + esc(plainLinks(b.text)) + "</" + hn + ">");
      } else if (b.kind === "quote") {
        if (b.text) H.push('<blockquote><p>' + esc(plainLinks(b.text)).replace(/\n/g, "<br />") + "</p></blockquote>");
      } else if (b.kind === "divider") {
        H.push("<hr />");
      } else if (b.kind === "image") {
        var cap = b.caption || b.original || "";
        if (b.fileId) {
          H.push('<p><a href="' + driveLink(b.fileId) + '">🖼️ ' + esc(cap || b.name) + "</a></p>");
        } else {
          H.push("<p>🖼️ " + esc(cap || b.name || "") + "</p>");
        }
      } else if (b.kind === "file") {
        var nm = b.caption || b.name || b.original;
        H.push('<p>📎 ' + (b.fileId ? '<a href="' + driveLink(b.fileId) + '">' + esc(nm) + "</a>" : esc(nm)) + "</p>");
      } else if (b.kind === "link") {
        if (b.url) H.push('<p>🔗 <a href="' + esc(b.url) + '">' + esc(b.label || b.url) + "</a></p>");
      } else if (b.kind === "embed") {
        if (b.code && b.code.trim()) H.push(b.code.trim());
      }
    });
    return H;
  }

  function buildHtml(n) {
    var t = typeOf(n.type);
    var H = [];
    H.push('<h1>' + esc(n.title || "(제목 없음)") + '</h1>');
    var meta = [t.icon + " " + t.label, formatDate(n.createdAt)];
    if ((n.tags || []).length) meta.push(n.tags.map(function (x) { return "#" + x; }).join(" "));
    H.push('<p><i>' + esc(meta.join("  ·  ")) + '</i></p>');
    H.push("<hr />");

    blocksToHtml(n, 2).forEach(function (x) { H.push(x); });

    var rels = (n.relations || []).map(function (r) {
      var tt = null;
      entries.forEach(function (x) { if (x.id === r.to) tt = x; });

  // 브라우저로 바로 열어 읽을 수 있게 서식을 입힌 한 장짜리 HTML

  // 구글 문서로 변환 저장 (mimeType 은 문서, 올리는 본문은 HTML)
  function saveAsGoogleDoc(n, parentId) {

  /* =========================================================
     7. 동기화
     ========================================================= */
  function slimBlock(b) {
    var o = { id: b.id, kind: b.kind };
    if (b.kind === "text" || b.kind === "heading" || b.kind === "quote") o.text = b.text || "";
    if (b.kind === "link") { o.url = b.url || ""; o.label = b.label || ""; }
    if (b.kind === "embed") { o.code = b.code || ""; o.height = b.height || 360; }
    if (b.kind === "image" || b.kind === "file") {
      o.original = b.original || ""; o.mime = b.mime || ""; o.size = b.size || 0;
      o.name = b.name || ""; o.caption = b.caption || ""; o.fileId = b.fileId || null;
    }
    return o;
  }
  function slim(n) {
    return {
      id: n.id, type: n.type, title: n.title, tags: n.tags || [],
      blocks: (n.blocks || []).filter(function (b) { return b.kind !== "image" && b.kind !== "file" ? true : !!b.fileId; }).map(slimBlock),
      relations: (n.relations || []).map(function (r) { return { to: r.to, label: r.label || "" }; }),
      pinned: !!n.pinned,
      createdAt: n.createdAt, updatedAt: n.updatedAt,
      mdId: n.mdId || null, mdName: n.mdName || null,
      docId: n.docId || null, htmlId: n.htmlId || null,
      folderId: n.folderId || null, folderName: n.folderName || null,
      shareUrl: n.shareUrl || null
    };
  }
  function findIndexFile() {
    if (indexFileId) return Promise.resolve(indexFileId);
    return findInFolder(INDEX_NAME, folder.id).then(function (id) { indexFileId = id; return id; });
  }
  function saveIndex() {
    pruneTombs();
    var content = JSON.stringify(
      { version: 3, app: "PKEMS", entries: entries.map(slim), deleted: tombstones }, null, 2);
    return findIndexFile().then(function (id) {
      return uploadFile(INDEX_NAME, "application/json", content, false, id, folder.id);
    }).then(function (r) { if (r && r.id) indexFileId = r.id; });
  }
  // 원격 색인을 { entries, deleted } 로 읽는다 (구버전은 deleted 가 없음)
  function loadIndex() {
    return findIndexFile().then(function (id) {
      if (!id) return { entries: [], deleted: [] };
      return driveFetch("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media&supportsAllDrives=true")
        .then(function (r) { return r.json(); })
        .then(function (j) { return { entries: migrate((j && j.entries) || []), deleted: (j && j.deleted) || [] }; })
        .catch(function () { return { entries: [], deleted: [] }; });
    });
  }
  function addTomb(id) {
    tombstones = tombstones.filter(function (t) { return t.id !== id; });
    tombstones.push({ id: id, at: Date.now() });
  }
  function mergeTombs(remote) {
    var map = {};
    tombstones.concat(remote || []).forEach(function (t) {
      if (!t || !t.id) return;
      if (!map[t.id] || (t.at || 0) > map[t.id].at) map[t.id] = { id: t.id, at: t.at || 0 };
    });
    tombstones = Object.keys(map).map(function (k) { return map[k]; });
    return tombstones;
  }
  function pruneTombs() {
    var cut = Date.now() - TOMB_KEEP_DAYS * 86400000;
    tombstones = tombstones.filter(function (t) { return (t.at || 0) > cut; });
  }
  function saveSettingsRemote() {
    if (!connected || !folder.id) return Promise.resolve();
    var content = JSON.stringify(settings, null, 2);
    var p = settingsFileId ? Promise.resolve(settingsFileId) : findInFolder(SETTINGS_NAME, folder.id);
    return p.then(function (id) {
      settingsFileId = id;
      return uploadFile(SETTINGS_NAME, "application/json", content, false, id, folder.id);
    }).then(function (r) { if (r && r.id) settingsFileId = r.id; }).catch(function () {});
  }
  function loadSettingsRemote() {
    return findInFolder(SETTINGS_NAME, folder.id).then(function (id) {
      if (!id) return null;
      settingsFileId = id;
      return driveFetch("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media&supportsAllDrives=true")
        .then(function (r) { return r.json(); }).catch(function () { return null; });
    }).catch(function () { return null; });
  }
  function mergeEntries(local, remote) {
    var map = {};
    (remote || []).forEach(function (n) { map[n.id] = n; });
    (local || []).forEach(function (n) {
      var r = map[n.id];
      if (!r || (n.updatedAt || 0) >= (r.updatedAt || 0)) map[n.id] = n;
    });
    // 다른 기기에서 지운 기록은 되살아나지 않게 한다
    tombstones.forEach(function (t) {
      var n = map[t.id];
      if (n && (n.updatedAt || 0) <= (t.at || 0)) delete map[t.id];
    });
    var arr = Object.keys(map).map(function (k) { return map[k]; });
    arr.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    return arr;
  }
  // 원격 색인을 받아 로컬과 합친다 (삭제 기록 포함)
  function absorbIndex(remote) {
    mergeTombs(remote.deleted);
    entries = mergeEntries(entries, remote.entries);
    return entries;
  }

  function syncPending() {
    if (!connected || !folder.id) return Promise.resolve();

    // 손볼 게 있는 기록만 추린다
    var todo = entries.filter(function (n) {
      if (n._dirty || !n.mdId) return true;
      return (n.blocks || []).some(function (b) {
        return (b.kind === "image" || b.kind === "file") && !b.fileId && b.blob;
      });
    });
    if (!todo.length) return Promise.resolve();

    var total = todo.length + 1, done = 0;
    function tick() { done++; progress(Math.round(done / total * 100)); }

    return todo.reduce(function (chain, n) {
      return chain.then(function () {
        var t;
        return resolveTargets(n)
          .then(function (target) {
            t = target;
            // 폴더가 새로 생겼거나 정리 방식을 바꿨으면 기존 파일도 옮겨 담는다
            if (!t.created && !n._relocate) return;
            var oldFolder = (settings.folderMode !== "perEntry") ? n.folderId : null;
            delete n._relocate;
            return relocateEntryFiles(n, t).then(function () {
              if (oldFolder) { trashFile(oldFolder); n.folderId = null; n.folderName = null; }
            });
          })
          .then(function () {
            // 대기 중인 첨부 업로드
            var pending = (n.blocks || []).filter(function (b) {
              return (b.kind === "image" || b.kind === "file") && !b.fileId && b.blob;
            });
            return pending.reduce(function (p, b) {
              return p.then(function () {
                // 진행률은 «큰 파일만» 이 아니라 항상 보여 준다.
                // 폰에서는 1MB 짜리도 몇십 초가 걸리는데, 아무 표시가 없으면 멈춘 줄 안다.
                var label = b.name.length > 14 ? b.name.slice(0, 14) + "…" : b.name;
                setSyncPill("↑ " + label + " 0%", true);
                return uploadAttachment(b, t.file, function (f) {
                  if (f < 0) { setSyncPill("↑ " + label + " 연결을 기다리는 중…", true); return; }
                  setSyncPill("↑ " + label + " " + Math.round(f * 100) + "%", true);
                })
                  .then(function (r) {
                    b.fileId = r.id; delete b.blob; dropPreview(b.id);
                    n._dirty = true; idbDel(b.id);
                  })
                  .catch(function (e) {
                    console.warn("첨부 업로드 실패", b.name, e);
                    toast("「" + b.name + "」 업로드 실패: " + errText(e));
                    toast2("이 기록은 «⏳ 업로드 대기» 로 남습니다. [동기화] 를 다시 누르면 재시도합니다.");
                  });
              });
            }, Promise.resolve());
          })
          .then(function () {
            if (!n._dirty && n.mdId) return;
            var want = mdName(n);
            var pre = n.mdId ? Promise.resolve(want) : uniqueName(want, t.md);
            return pre.then(function (finalName) {
              return uploadFile(finalName, "text/markdown", buildMarkdown(n), false, n.mdId || null, t.md)
                .then(function (r) { n.mdId = r.id; n.mdName = finalName; });
            }).then(function () {
              // 사람이 읽기 좋은 사본도 함께
              var extra = [];
              if (settings.alsoGdoc) extra.push(saveAsGoogleDoc(n, t.md));
              if (settings.alsoHtml) extra.push(saveAsHtml(n, t.md));
              return Promise.all(extra);
            }).then(function () { delete n._dirty; });
          })
          .catch(function (e) { console.warn("저장 실패", n.title, e); })
          .then(tick);
      });
    }, Promise.resolve())
      .then(function () { return saveIndex(); })
      .then(function () { tick(); saveLocal(); render(); })
      .catch(function (e) { console.warn(e); progress(0); toast("동기화 중 오류: " + e.message); });
  }

  function connect(folderInputValue) {
    if (!clientId) { toast("앱에 구글 클라이언트 ID가 설정되지 않았습니다. 설정 → 고급에서 입력해 주세요."); return Promise.resolve(); }
    progress(10);
    return requestToken(!accessToken)
      .then(ensureAccount)
      .then(function () {
        var id = parseFolderId(folderInputValue) || folder.id;
        if (!id) { var e = new Error("NO_FOLDER"); e.noFolder = true; throw e; }
        return verifyFolder(id);
      })
      .then(function (f) {
        folder = { id: f.id, name: f.name, link: f.link };
        localStorage.setItem(LS.folder, JSON.stringify(folder));
        connected = true;
        localStorage.setItem(LS.connected, "1");
        subFolderId = null; indexFileId = null; settingsFileId = null;
        updateChrome();
        return loadSettingsRemote();
      })
      .then(function (remoteSettings) {
        if (remoteSettings) { settings = normalizeSettings(remoteSettings); saveSettingsLocal(); }
        else saveSettingsRemote();
        if (!typeOf(currentType) || typeOf(currentType).label === "미분류") currentType = settings.types[0].key;
        renderTypeChips();
        return loadIndex();
      })
      .then(function (remote) {
        absorbIndex(remote);
        saveLocal(); render();
        return syncPending();
      })
      .then(function () {
        progress(100);
        lastSyncAt = Date.now(); setSyncPill(syncedAgo());
        toast("「" + folder.name + "」 폴더에 연결되었습니다.");
        closeModal();
      })
      .catch(function (e) {
        progress(0);
        if (e && e.noFolder) { updateChrome(); openSettings("storage"); toast("저장할 폴더를 지정해 주세요."); return; }
        connected = false; updateChrome();
        toast("연결 실패: " + (e && e.message ? e.message : e));
      });
  }

  /* =========================================================
     8. 블록 에디터
     ========================================================= */
  var BLOCK_META = {
    text:    { icon: "📝", label: "글" },
    heading: { icon: "🔠", label: "소제목" },
    quote:   { icon: "❝", label: "인용" },
    image:   { icon: "🖼️", label: "사진" },
    file:    { icon: "📎", label: "파일·영상" },
    link:    { icon: "🔗", label: "링크" },
    embed:   { icon: "🧩", label: "코드 삽입" },
    divider: { icon: "➖", label: "구분선" }
  };
  // 유튜브 등 주소만 넣어도 알아서 삽입 코드로 바꿔 준다
  function urlToEmbed(u) {
    u = String(u || "").trim();
    var m = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,})/.exec(u);
    if (m) return '<iframe width="560" height="315" src="https://www.youtube.com/embed/' + m[1] +
      '" title="YouTube" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    m = /vimeo\.com\/(\d+)/.exec(u);
    if (m) return '<iframe src="https://player.vimeo.com/video/' + m[1] + '" width="640" height="360" frameborder="0" allowfullscreen></iframe>';
    m = /docs\.google\.com\/[^\s"']+/.exec(u);
    if (m) return '<iframe src="' + m[0].replace(/\/(edit|view)[^\s"']*$/, "/preview") + '" width="100%" height="480" frameborder="0"></iframe>';
    m = /drive\.google\.com\/file\/d\/([\w-]+)/.exec(u);
    if (m) return '<iframe src="https://drive.google.com/file/d/' + m[1] + '/preview" width="100%" height="420" frameborder="0" allowfullscreen></iframe>';
    return null;
  }

  // 블록 복사 — JSON 복제를 쓰면 Blob(파일 본문)이 빈 객체로 뭉개진다
  function cloneBlock(b) {
    var c = {};
    for (var k in b) if (Object.prototype.hasOwnProperty.call(b, k)) c[k] = b[k];
    return c;
  }

  function newBlock(kind, data) {
    var b = { id: uid(), kind: kind };
    if (kind === "text" || kind === "heading" || kind === "quote") b.text = "";
    if (kind === "link") { b.url = ""; b.label = ""; }
    if (kind === "embed") { b.code = ""; b.height = 360; }
    if (kind === "image" || kind === "file") { b.caption = ""; }
    if (data) for (var k in data) if (Object.prototype.hasOwnProperty.call(data, k)) b[k] = data[k];
    return b;
  }
  function addBlock(kind, data, focus) {
    if (kind === "image") { $("imgInput").click(); return; }
    if (kind === "file") { $("fileInput").click(); return; }
    if (kind === "capture") { startCapture(); return; }
    if (kind === "draw") { openDrawModal(); return; }
    var b = newBlock(kind, data);
    blocks.push(b);
    renderBlocks();
    if (focus !== false) {
      var node = document.querySelector('[data-bid="' + b.id + '"]');
      var f = node && node.querySelector("textarea, input");
      if (f) f.focus();
    }
    return b;
  }
  function moveBlock(id, dir) {
    var i = blocks.findIndex(function (b) { return b.id === id; });
    var j = i + dir;
    if (i < 0 || j < 0 || j >= blocks.length) return;
    var t = blocks[i]; blocks[i] = blocks[j]; blocks[j] = t;
    renderBlocks();
  }
  // 끌어서 옮기기 — 지금 끌고 있는 블록
  var dragBlockId = null;
  function clearDropMarks() {
    Array.prototype.forEach.call(document.querySelectorAll(".block.dropbefore, .block.dropafter"), function (e) {
      e.classList.remove("dropbefore", "dropafter");
    });
  }
  function dropBlockOn(movingId, targetId, after) {
    var from = blocks.findIndex(function (b) { return b.id === movingId; });
    if (from < 0) return;
    var moved = blocks.splice(from, 1)[0];
    var to = blocks.findIndex(function (b) { return b.id === targetId; });
    if (to < 0) { blocks.splice(from, 0, moved); return; }
    blocks.splice(after ? to + 1 : to, 0, moved);
    dragBlockId = null;
    clearDropMarks();
    renderBlocks();
    touchDraft();
  }
  function removeBlock(id) {
    blocks = blocks.filter(function (b) { return b.id !== id; });
    renderBlocks();
  }
  function mediaOrder(b) {
    var n = 0;
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].kind === "image" || blocks[i].kind === "file") {
        n++;
        if (blocks[i].id === b.id) return n;
      }
    }
    return n;
  }
  function previewAttachName(b) {
    if (b.name) return b.name;
    return attachName({ createdAt: Date.now(), title: $("title").value, type: currentType }, mediaOrder(b), b.original || "file");
  }

  function renderBlocks() {
    touchDraft();
    var host = $("blocks");
    host.innerHTML = "";
    if (!blocks.length) {
      var hint = el("div", "desc", "아래 버튼으로 글·사진·링크를 원하는 순서대로 추가하세요.");
      hint.style.padding = "6px 2px 10px";
      host.appendChild(hint);
    }
    blocks.forEach(function (b, idx) {
      var meta = BLOCK_META[b.kind] || BLOCK_META.text;
      var wrap = el("div", "block " + b.kind);
      wrap.setAttribute("data-bid", b.id);

      var head = el("div", "bhead");
      var grip = el("span", "bgrip", "⠿");
      grip.title = "끌어서 순서 옮기기";
      head.appendChild(grip);
      head.appendChild(el("span", "bkind", meta.icon + " " + meta.label));
      head.appendChild(el("span", "spacer"));

        ta.rows = 3;

  /* ---------- 사진 넣는 방법 고르기 (PC / 모바일 공통 입구) ---------- */
  function isTouchDevice() {
    return (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) ||
      /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "");
  }
  function captureSupported() {
    // 모바일 브라우저는 API 가 있어도 실제로는 막혀 있는 경우가 많다
    return !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) && !isTouchDevice();
  }
  var skipCrop = false;

  function openCaptureSheet() {
    closeModal();
    var mobile = isTouchDevice();
    var bg = el("div", "modal-bg");
    var m = el("div", "card modal sheet"); m.style.maxWidth = "460px";

    head.appendChild(x);
    m.appendChild(head);

    var body = el("div", "mbody");
    body.appendChild(el("p", "sheetnote", mobile
      ? "휴대폰 브라우저는 화면을 직접 캡처할 수 없습니다. 전원 + 음량↓(아이폰은 전원 + 음량↑)로 스크린샷을 찍은 뒤 갤러리에서 고르면 PC와 똑같이 영역을 잘라 넣을 수 있습니다."
      : "가장 빠른 방법은 Win+Shift+S(맥 ⌘⇧4)로 캡처한 뒤 아래 «클립보드에서 붙여넣기» 입니다. 창 공유 화면이 뜨지 않습니다."));

    function sheetBtn(emoji, title, sub, onClick) {

      b.appendChild(el("span", "em", emoji));
