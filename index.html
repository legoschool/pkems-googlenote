<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="글·사진·링크·파일을 블로그처럼 이어 쓰고, 내 구글 드라이브 폴더에 마크다운으로 쌓는 개인 지식·경험 기록장(PKEMS)" />
<meta name="theme-color" content="#2f5fd6" />
<title>PKEMS · 개인 지식·경험 기록장</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #f5f7fb; --panel: #fff; --ink: #1b2130; --ink-soft: #667085;
    --brand: #2f5fd6; --brand-dark: #24499f; --brand-soft: #eaf0ff;
    --line: #e3e8f2; --line-soft: #eef1f7;
    --danger: #d64545; --ok: #1a9e5f; --warn: #b07a00;
    --shadow: 0 1px 3px rgba(20,30,60,.06), 0 8px 24px rgba(20,30,60,.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161f; --panel: #1b202b; --ink: #e8ecf4; --ink-soft: #98a2b3;
      --brand: #7d9dff; --brand-dark: #5f83f0; --brand-soft: #232c44;
      --line: #2b3242; --line-soft: #232936;
      --shadow: 0 1px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    font-size: 15px; line-height: 1.62; -webkit-text-size-adjust: 100%;
  }
  a { color: var(--brand); }
  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; word-break: break-all; }
  .spacer { flex: 1 1 auto; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px 80px; }

  /* ---------- 상단 바 ---------- */
  header.top { position: sticky; top: 0; z-index: 40; background: var(--panel); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1000px; margin: 0 auto; padding: 9px 16px; display: flex; align-items: center; gap: 10px; }
  .logo { font-weight: 800; font-size: 16.5px; letter-spacing: -.3px; display: flex; align-items: center; gap: 7px; }
  .logo small { font-weight: 500; font-size: 12px; color: var(--ink-soft); letter-spacing: 0; }
  @media (max-width: 560px) { .logo small { display: none; } }
  .acct { font-size: 12.5px; color: var(--ink-soft); max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; transition: .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--brand); color: var(--brand); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
  .btn.xs { padding: 2px 7px; font-size: 12px; border-radius: 7px; font-weight: 500; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* ---------- 배너 ---------- */
  .banner { margin: 16px 0; padding: 12px 14px; border-radius: 12px; font-size: 13.5px;
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px solid var(--line); background: var(--panel); }
  .banner.warn { background: #fff8e6; border-color: #f0dca8; color: #6b4e00; }
  .banner.ok { background: #eaf7f0; border-color: #b9e3cd; color: #0f5c39; }
  @media (prefers-color-scheme: dark) {
    .banner.warn { background: #33291180; border-color: #5a4715; color: #f0d78f; }
    .banner.ok { background: #10321f80; border-color: #1e5c3c; color: #97e0bb; }
  }
  .banner .grow { flex: 1 1 240px; }
  .banner a { color: inherit; }

  /* ---------- 입력 공통 ---------- */
  .inp { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); outline: none; }
  .inp:focus { border-color: var(--brand); background: var(--panel); }
  textarea.inp { resize: vertical; line-height: 1.75; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
  .desc { font-size: 12.5px; color: var(--ink-soft); margin: 4px 0 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
          padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

  /* ---------- 에디터 ---------- */
  .composer { padding: 18px; margin: 16px 0; }
  .composer h2 { margin: 0 0 12px; font-size: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

  #blocks { margin-top: 4px; }
  .block { border: 1px solid var(--line-soft); border-radius: 12px; background: var(--bg); margin-bottom: 8px; }
  .block:focus-within { border-color: var(--brand); }
  .bhead { display: flex; align-items: center; gap: 4px; padding: 5px 8px 3px; }
  .bkind { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); padding-left: 3px; }
  .bbody { padding: 0 8px 8px; }
  .bbody textarea, .bbody input { background: var(--panel); }
  .block.text textarea { min-height: 76px; }
  .block.heading input { font-size: 17px; font-weight: 700; }
  .block.quote textarea { border-left: 3px solid var(--brand); font-style: italic; min-height: 56px; }
  .block.divider .bbody { padding: 10px 12px 16px; }
  .block.divider hr { border: none; border-top: 2px dashed var(--line); margin: 0; }
  .media { display: flex; gap: 10px; align-items: flex-start; }
  .media .thumb { width: 92px; height: 92px; flex: 0 0 auto; border-radius: 10px; object-fit: cover; background: var(--line-soft); }
  .media .ficon { width: 92px; height: 92px; flex: 0 0 auto; border-radius: 10px; background: var(--line-soft);
                  display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .media .minfo { flex: 1 1 auto; min-width: 0; }
  .media .savedname { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--brand); word-break: break-all; display: block; margin-bottom: 2px; }
  .media .origname { font-size: 11.5px; color: var(--ink-soft); display: block; margin-bottom: 6px; }

  .addbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px; border: 1px dashed var(--line); border-radius: 12px; background: var(--bg); }
  .addbar .btn { background: var(--panel); }
  .addbar.hover { border-color: var(--brand); background: var(--brand-soft); }
  .addhint { width: 100%; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .composer-actions { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .savehint { font-size: 12px; color: var(--ink-soft); }

  /* ---------- 목록 ---------- */
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 24px 0 10px; }
  .toolbar h2 { margin: 0; font-size: 16px; }
  .count { font-size: 13px; color: var(--ink-soft); }
  .search { flex: 0 1 300px; }
  .filters { margin-bottom: 14px; }

  .entry { padding: 16px 18px; margin-bottom: 12px; }
  .entry .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
  .entry h3 { margin: 0; font-size: 16.5px; flex: 1 1 auto; min-width: 0; }
  .when { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .tags { margin: 7px 0 0; display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: 12px; color: var(--ink-soft); background: var(--bg); border: 1px solid var(--line); padding: 1px 8px; border-radius: 999px; }
  .content { margin-top: 10px; }
  .content > * { margin: 0 0 8px; }
  .content p { white-space: pre-wrap; word-break: break-word; font-size: 14.3px; }
  .content h4 { font-size: 15px; margin-top: 14px; }
  .content blockquote { margin: 0 0 8px; padding: 4px 0 4px 12px; border-left: 3px solid var(--brand); color: var(--ink-soft); font-style: italic; white-space: pre-wrap; }
  .content hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  .content figure { margin: 0 0 10px; }
  .content figure img { max-width: 100%; max-height: 420px; border-radius: 10px; display: block; border: 1px solid var(--line); }
  .content figcaption { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }
  .content .fileline, .content .linkline {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
    border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; background: var(--bg);
    text-decoration: none; color: var(--ink); max-width: 100%; word-break: break-all;
  }
  .content .fileline:hover, .content .linkline:hover { border-color: var(--brand); color: var(--brand); }
  .collapsed { max-height: 320px; overflow: hidden; position: relative; }
  .collapsed::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 70px;
                      background: linear-gradient(transparent, var(--panel)); }
  .morebtn { display: block; width: 100%; margin-top: 4px; }

  .foot { display: flex; gap: 6px; align-items: center; margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .sync-dot { font-size: 12px; color: var(--ink-soft); }
  .sync-dot.ok { color: var(--ok); }
  .sync-dot.pending { color: var(--warn); }

  .empty { text-align: center; padding: 46px 20px; color: var(--ink-soft); font-size: 14px; }
  .empty .big { font-size: 40px; display: block; margin-bottom: 10px; }

  /* ---------- 토스트/진행 ---------- */
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
           background: #1b2130; color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 14px;
           opacity: 0; pointer-events: none; transition: .22s; z-index: 100; max-width: 90vw; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #progress { position: fixed; left: 0; top: 0; height: 3px; background: var(--brand); width: 0; transition: width .3s; z-index: 200; }

  /* ---------- 모달 ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,35,.55); z-index: 90;
              display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { max-width: 620px; width: 100%; max-height: 88vh; display: flex; flex-direction: column; }
  .modal .mhead { display: flex; align-items: center; gap: 8px; padding: 15px 18px; border-bottom: 1px solid var(--line); }
  .modal .mhead h3 { margin: 0; font-size: 17px; }
  .modal .mbody { padding: 18px; overflow: auto; }
  .modal .mfoot { display: flex; gap: 8px; padding: 13px 18px; border-top: 1px solid var(--line); align-items: center; }
  .tabs { display: flex; gap: 4px; padding: 10px 18px 0; flex-wrap: wrap; }
  .tab { border: none; background: transparent; color: var(--ink-soft); font-weight: 700; font-size: 13.5px;
         padding: 7px 12px; border-radius: 9px 9px 0 0; border-bottom: 2px solid transparent; }
  .tab.on { color: var(--brand); border-bottom-color: var(--brand); background: var(--brand-soft); }

  .typerow { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .typerow .ic { width: 52px; text-align: center; flex: 0 0 auto; }
  .typerow .nm { flex: 1 1 auto; }
  .tokens { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .token { font-size: 12px; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 2px 8px; font-family: ui-monospace, Consolas, monospace; }
  .preview { margin-top: 8px; padding: 9px 11px; border-radius: 9px; background: var(--brand-soft); font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; word-break: break-all; color: var(--brand); }

  .steps { font-size: 13px; color: var(--ink-soft); padding-left: 18px; margin: 8px 0 0; }
  .steps li { margin-bottom: 4px; }

  /* ---------- 위키링크 [[제목]] ---------- */
  .wikilink {
    color: var(--brand); text-decoration: none; border-bottom: 1px solid transparent;
    background: var(--brand-soft); padding: 0 4px; border-radius: 5px; cursor: pointer;
  }
  .wikilink:hover { border-bottom-color: var(--brand); }
  .wikilink.missing { color: var(--warn); background: transparent; border: 1px dashed var(--warn); opacity: .85; }
  #wikiPop {
    position: absolute; z-index: 60; min-width: 220px; max-width: 340px; max-height: 240px; overflow: auto;
    background: var(--panel); border: 1px solid var(--brand); border-radius: 10px;
    box-shadow: var(--shadow); padding: 4px;
  }
  #wikiPop .wp {
    display: block; width: 100%; text-align: left; border: none; background: transparent; color: var(--ink);
    padding: 7px 9px; border-radius: 7px; font-size: 13.5px;
  }
  #wikiPop .wp.on, #wikiPop .wp:hover { background: var(--brand-soft); color: var(--brand); }
  #wikiPop .wp small { display: block; color: var(--ink-soft); font-size: 11.5px; }
  #wikiPop .wp.on small, #wikiPop .wp:hover small { color: inherit; }
  #wikiPop .cap { font-size: 11.5px; color: var(--ink-soft); padding: 5px 9px 3px; }

  /* ---------- 연결(백링크) 줄 ---------- */
  .rel { margin-top: 11px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .rel .relhead { font-size: 12px; color: var(--ink-soft); font-weight: 700; margin-bottom: 6px; }
  .rel .relchips { display: flex; gap: 5px; flex-wrap: wrap; }
  .relchip {
    font-size: 12.5px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 999px; padding: 3px 10px; cursor: pointer; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .relchip:hover { border-color: var(--brand); color: var(--brand); }
  .relchip.out::before { content: "→ "; color: var(--ink-soft); }
  .relchip.in::before { content: "← "; color: var(--ink-soft); }
  .relchip.missing { border-style: dashed; color: var(--warn); }
  .entry.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--brand); } 100% { box-shadow: var(--shadow); } }

  /* ---------- 관계망 ---------- */
  .graphmodal { max-width: min(1100px, 96vw); height: min(86vh, 820px); }
  .graphmodal .mbody { padding: 0; flex: 1 1 auto; position: relative; overflow: hidden; }
  #graphCanvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #graphCanvas.grabbing { cursor: grabbing; }
  .graphtools {
    position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: var(--shadow);
    max-width: calc(100% - 20px);
  }
  .graphtools .inp { width: 150px; padding: 5px 9px; }
  .graphlegend {
    position: absolute; right: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); font-size: 12px; max-width: 190px;
  }
  .graphlegend .lg { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .graphlegend .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .graphempty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                text-align: center; color: var(--ink-soft); font-size: 14px; padding: 30px; }

  /* ---------- 전체 화면 드래그&드롭 ---------- */
  .dropoverlay { position: fixed; inset: 0; z-index: 120; background: rgba(47,95,214,.18);
                 backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .dropcard { background: var(--panel); border: 3px dashed var(--brand); color: var(--brand);
              border-radius: 18px; padding: 34px 46px; font-size: 18px; font-weight: 800; text-align: center; line-height: 1.7;
              box-shadow: 0 20px 60px rgba(20,30,60,.25); }

  /* ---------- 화면 캡처 · 영역 선택 ---------- */
  .cropwrap { position: relative; display: inline-block; line-height: 0; touch-action: none;
              border-radius: 10px; overflow: hidden; border: 1px solid var(--line); cursor: crosshair; }
  .cropwrap img { display: block; max-width: 100%; max-height: 58vh; width: auto; height: auto;
                  user-select: none; -webkit-user-drag: none; }
  .cropshade { position: absolute; inset: 0; background: rgba(10,15,30,.55); pointer-events: none; }
  .cropsel { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(10,15,30,.55);
             pointer-events: none; border-radius: 2px; }
  .cropsel::after { content: ""; position: absolute; inset: -2px; border: 1px dashed var(--brand); }
  .cropsize { position: absolute; left: 0; top: -22px; font-size: 11.5px; font-weight: 700; color: #fff;
              background: var(--brand); padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
  .crophint { font-size: 12.5px; color: var(--ink-soft); margin: 10px 0 0; }

  /* ---------- 선택 시트 (사진 넣는 방법 고르기) ---------- */
  .sheet .mbody { padding: 14px 18px 18px; }
  .sheetbtn {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 14px 16px; border-radius: 12px; margin-bottom: 8px; font-weight: 700; font-size: 15px;
  }
  .sheetbtn:hover { border-color: var(--brand); color: var(--brand); }
  .sheetbtn .em { font-size: 24px; line-height: 1; flex: 0 0 auto; }
  .sheetbtn small { display: block; font-weight: 500; font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .sheetbtn:hover small { color: inherit; }
  .sheetnote { font-size: 12.5px; color: var(--ink-soft); background: var(--bg);
               border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
  .sheettoggle { display: flex; align-items: center; gap: 8px; font-size: 13.5px; padding: 4px 2px; }

  /* ---------- 동기화 표시 ---------- */
  .syncpill { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .syncpill.busy { color: var(--brand); }

  /* ---------- 모바일 ---------- */
  @media (max-width: 700px) {
    /* iOS 가 입력칸에서 자동 확대하지 않도록 16px 이상 유지 */
    .inp, input, textarea, select { font-size: 16px; }
    .wrap { padding: 0 12px 96px; }
    .top-inner { padding: 8px 12px; gap: 7px; }
    .acct { display: none; }
    .btn { padding: 9px 13px; }
    .btn.sm { padding: 8px 11px; font-size: 13.5px; }
    .btn.xs { padding: 6px 10px; font-size: 13px; }
    .composer, .entry { padding: 14px; }
    .grid2 { gap: 8px; }
    .addbar { position: sticky; bottom: 0; z-index: 20; background: var(--panel);
              box-shadow: 0 -6px 18px rgba(20,30,60,.08); }
    .addbar .btn { flex: 1 1 30%; text-align: center; }
    .addhint { font-size: 11.5px; }
    .bhead .btn.xs { min-width: 40px; }
    .media .thumb, .media .ficon { width: 72px; height: 72px; }
    .toolbar .search { flex: 1 1 100%; max-width: none; order: 9; }
    .modal-bg { padding: 0; align-items: flex-end; }
    .modal { max-width: none; max-height: 92vh; border-radius: 16px 16px 0 0; }
    .graphmodal { height: 92vh; max-width: none; }
    .graphtools .inp { width: 110px; }
    .graphlegend { display: none; }
    .modal .mhead, .modal .mfoot { padding: 13px 14px; }
    .modal .mbody { padding: 14px; }
    .tabs { padding: 8px 12px 0; }
    .tab { padding: 8px 10px; font-size: 13px; }
    .typerow { flex-wrap: wrap; }
    .typerow .nm { flex: 1 1 120px; }
    .cropwrap { max-width: 100%; }
    .dropcard { padding: 24px 28px; font-size: 16px; }
  }

  footer.site { text-align: center; color: var(--ink-soft); font-size: 12.5px; padding: 30px 0 10px; }
  footer.site a { color: var(--ink-soft); }
</style>
</head>
<body>

<div id="progress"></div>

<header class="top">
  <div class="top-inner">
    <div class="logo">🧠 PKEMS <small>개인 지식·경험 기록장</small></div>
    <div class="spacer"></div>
    <span id="syncPill" class="syncpill"></span>
    <span id="acct" class="acct"></span>
    <button id="btnGraph" class="btn sm">🕸️ 관계망</button>
    <button id="btnSettings" class="btn sm">⚙️ 설정</button>
    <button id="btnLogin" class="btn sm primary">구글 로그인</button>
  </div>

<script>
(function () {

  var OWNER_CLIENT_ID = "255330405723-v0hdhjapm5aph1ht4eme11cmimn3o6kg.apps.googleusercontent.com";

  function uid(p) { return (p || "b_") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function fileIcon(mime, name) {

  }

  /* =========================================================
     2. 상태
     ========================================================= */
  var settings = normalizeSettings(safeParse(localStorage.getItem(LS.settings)));
  var entries = migrate(safeParse(localStorage.getItem(LS.entries)) || []);
  var tombstones = safeParse(localStorage.getItem(LS.tombs)) || []; // 기기 간 삭제 전파용
  var folder = safeParse(localStorage.getItem(LS.folder)) || { id: "", name: "" };
  var clientId = OWNER_CLIENT_ID || localStorage.getItem(LS.cid) || "";

  var blocks = [];          // 작성 중인 블록
  var editingId = null;
  var currentType = settings.types[0] ? settings.types[0].key : "";
  var filterType = "all";
  var searchQ = "";
  var expanded = {};

  var tokenClient = null, accessToken = null, connected = false, userEmail = "";
  var indexFileId = null, settingsFileId = null, subFolderId = null;
  var imgUrlCache = {};

  function normalizeSettings(s) {
    var out = JSON.parse(JSON.stringify(DEFAULTS));
    if (!s) return out;
    if (Array.isArray(s.types) && s.types.length) {
      out.types = s.types.filter(function (t) { return t && t.key && t.label; })
        .map(function (t) { return { key: t.key, label: t.label, icon: t.icon || "🏷️" }; });
      if (!out.types.length) out.types = JSON.parse(JSON.stringify(DEFAULTS.types));
    }
    ["filePattern", "mdPattern", "subfolderName"].forEach(function (k) {
      if (typeof s[k] === "string" && s[k].trim()) out[k] = s[k].trim();
    });
    out.useSubfolder = !!s.useSubfolder;
    return out;
  }
  function typeOf(key) {
    for (var i = 0; i < settings.types.length; i++) if (settings.types[i].key === key) return settings.types[i];
    return { key: key || "", label: "미분류", icon: "🏷️" };
  }
  function saveSettingsLocal() { localStorage.setItem(LS.settings, JSON.stringify(settings)); }

  /* ---- 아직 업로드하지 않은 첨부는 IndexedDB 에 둔다 ----
     사진 한 장이 base64 로 수 MB 라, localStorage(보통 5MB)에 담으면
     휴대폰에서 금방 한도를 넘겨 기록이 통째로 날아갑니다.            */
  var idbOK = true;
  function idb() {
    return new Promise(function (res, rej) {
      if (!idbOK || !window.indexedDB) { rej(new Error("no-idb")); return; }
      var r = indexedDB.open("pkems", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("pending"); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { idbOK = false; rej(r.error); };
    });
  }
  function idbRun(mode, fn) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction("pending", mode);
        var out = fn(tx.objectStore("pending"));
        tx.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function idbPut(k, v) { return idbRun("readwrite", function (s) { s.put(v, k); }).catch(function () { idbOK = false; }); }
  function idbDel(k) { return idbRun("readwrite", function (s) { s.delete(k); }).catch(function () {}); }
  function idbAll() {
    return idb().then(function (db) {
      return new Promise(function (res) {
        var out = {}, tx = db.transaction("pending", "readonly");
        var req = tx.objectStore("pending").openCursor();
        req.onsuccess = function () {
          var c = req.result;
          if (c) { out[c.key] = c.value; c.continue(); } else res(out);
        };
        req.onerror = function () { res(out); };
      });
    }).catch(function () { return {}; });
  }
  // 저장 전에 대기 중인 첨부 본문을 IndexedDB 로 옮긴다
  function stashPending() {
    if (!idbOK) return Promise.resolve();
    var jobs = [];
    entries.forEach(function (n) {
      (n.blocks || []).forEach(function (b) {
        if ((b.kind === "image" || b.kind === "file") && !b.fileId && b.dataUrl) jobs.push(idbPut(b.id, b.dataUrl));
      });
    });
    return Promise.all(jobs);
  }
  function saveLocal() {
    stashPending();
    try {
      // dataUrl 은 IndexedDB 로 빠졌으므로 localStorage 에는 넣지 않는다
      localStorage.setItem(LS.entries, JSON.stringify(entries, function (k, v) {
        return (k === "dataUrl" && idbOK) ? undefined : v;
      }));
      localStorage.setItem(LS.tombs, JSON.stringify(tombstones));
    } catch (e) {
      toast("브라우저 저장 공간이 가득 찼습니다. 드라이브에 연결하면 해결됩니다.");
    }
  }
  // 새로고침 후 대기 중인 첨부 본문을 되살린다
  function rehydratePending() {
    return idbAll().then(function (map) {
      var used = {}, changed = false;
      entries.forEach(function (n) {
        (n.blocks || []).forEach(function (b) {
          if ((b.kind === "image" || b.kind === "file") && !b.fileId) {
            used[b.id] = 1;
            if (!b.dataUrl && map[b.id]) { b.dataUrl = map[b.id]; changed = true; }
          }
        });
      });
      // 고아 데이터 청소
      Object.keys(map).forEach(function (k) { if (!used[k]) idbDel(k); });
      if (changed) render();
    });
  }

  // 예전 버전(본문+첨부 분리)을 블록 구조로 변환
  function migrate(list) {
    return (list || []).map(function (n) {
      if (n.blocks) return n;
      var bl = [];
      if (n.body) bl.push({ id: uid(), kind: "text", text: n.body });
      (n.files || []).forEach(function (f) {
        bl.push({
          id: uid(), kind: /^image\//.test(f.mime || "") ? "image" : "file",
          original: f.original, mime: f.mime, size: f.size, name: f.name,
          fileId: f.fileId || null, dataUrl: f.dataUrl || null, caption: ""
        });
      });
      (n.links || []).forEach(function (l) { bl.push({ id: uid(), kind: "link", url: l.url, label: l.label }); });
      [["상황 (Context)", n.context], ["배운 점 (Insight)", n.insight], ["다음 행동 (Action)", n.action], ["출처 (Source)", n.source]]
        .forEach(function (p) {
          if (!p[1]) return;
          bl.push({ id: uid(), kind: "heading", text: p[0] });
          bl.push({ id: uid(), kind: "text", text: p[1] });
        });
      n.blocks = bl;
      return n;
    });
  }

  /* =========================================================
     3. 구글 인증
     ========================================================= */
  function gisReady() { return typeof google !== "undefined" && google.accounts && google.accounts.oauth2; }
  function initTokenClient() {
    if (!clientId || !gisReady()) return false;

    return true;
  }
  function requestToken(interactive) {
    return new Promise(function (resolve, reject) {

      tokenClient.callback = function (r) {
        if (r && r.error) { reject(new Error(r.error_description || r.error)); return; }

        resolve(accessToken);
      };

      catch (e) { reject(e); }

    return fetch(url, opts).then(function (res) {
      if (res.status === 401 && !retried) return requestToken(false).then(function () { return driveFetch(url, opts, true); });
      return res;
    });
  }
  function driveJson(url, opts) {
    return driveFetch(url, opts).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j && j.error && j.error.message) || ("HTTP " + r.status));
        return j;
      });
    });
  }
  function ensureAccount() {
    return driveFetch("https://www.googleapis.com/oauth2/v3/userinfo")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (i) { if (i && i.email) userEmail = i.email; })
      .catch(function () {});
  }

  /* =========================================================
     4. 드라이브 기본 동작
     ========================================================= */
  function parseFolderId(input) {
    var s = String(input || "").trim();
    if (!s) return "";
    var m = /\/folders\/([A-Za-z0-9_-]+)/.exec(s); if (m) return m[1];
    m = /[?&]id=([A-Za-z0-9_-]+)/.exec(s); if (m) return m[1];
    m = /\/d\/([A-Za-z0-9_-]+)/.exec(s); if (m) return m[1];
    if (/^[A-Za-z0-9_-]{10,}$/.test(s)) return s;
    return "";
  }
  function verifyFolder(id) {
    return driveJson("https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(id) +
      "?fields=id,name,mimeType,webViewLink&supportsAllDrives=true").then(function (f) {
        if (f.mimeType !== "application/vnd.google-apps.folder") throw new Error("폴더가 아닙니다. 폴더 링크를 넣어 주세요.");
        return { id: f.id, name: f.name, link: f.webViewLink };
      });
  }
  function qEsc(s) { return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }

  function findInFolder(name, parentId) {
    var q = "name='" + qEsc(name) + "' and '" + parentId + "' in parents and trashed=false";
    return driveJson("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
      "&fields=files(id,name)&supportsAllDrives=true&includeItemsFromAllDrives=true")
      .then(function (j) { return (j.files && j.files.length) ? j.files[0].id : null; });
  }
  function ensureSubfolder() {
    if (!settings.useSubfolder) return Promise.resolve(folder.id);
    if (subFolderId) return Promise.resolve(subFolderId);
    var nm = settings.subfolderName || "자료";
    return findInFolder(nm, folder.id).then(function (id) {
      if (id) { subFolderId = id; return id; }
      return driveJson("https://www.googleapis.com/drive/v3/files?fields=id&supportsAllDrives=true", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: nm, mimeType: "application/vnd.google-apps.folder", parents: [folder.id] })
      }).then(function (f) { subFolderId = f.id; return f.id; });
    });
  }
  function uploadFile(name, mimeType, payload, isBase64, fileId, parentId) {
    var boundary = "pkems" + Math.random().toString(36).slice(2);
    var d = "\r\n--" + boundary + "\r\n", c = "\r\n--" + boundary + "--";
    var meta = fileId ? { name: name } : { name: name, mimeType: mimeType, parents: [parentId || folder.id] };
    var body = d + "Content-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(meta) +
      d + "Content-Type: " + mimeType + "\r\n" + (isBase64 ? "Content-Transfer-Encoding: base64\r\n" : "") + "\r\n" +
      payload + c;
    var url = "https://www.googleapis.com/upload/drive/v3/files" + (fileId ? "/" + fileId : "") +
      "?uploadType=multipart&fields=id,name&supportsAllDrives=true";
    return driveJson(url, {
      method: fileId ? "PATCH" : "POST",
      headers: { "Content-Type": 'multipart/related; boundary="' + boundary + '"' },
      body: body
    });
  }
  function trashFile(id) {
    if (!id) return Promise.resolve();
    return driveFetch("https://www.googleapis.com/drive/v3/files/" + id + "?supportsAllDrives=true", {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ trashed: true })
    }).catch(function () {});
  }
  // 같은 폴더에 같은 이름이 있으면 -2, -3 … 을 붙인다
  function uniqueName(name, parentId) {
    var stem = stemOf(name), ext = extOf(name);
    var q = "'" + parentId + "' in parents and trashed=false and name contains '" + qEsc(stem) + "'";
    return driveJson("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
      "&fields=files(name)&pageSize=100&supportsAllDrives=true&includeItemsFromAllDrives=true")
      .then(function (j) {
        var used = {};
        (j.files || []).forEach(function (f) { used[f.name] = 1; });
        if (!used[name]) return name;
        var i = 2;
        while (used[stem + "-" + i + ext]) i++;
        return stem + "-" + i + ext;
      })
      .catch(function () { return name; });
  }

  /* =========================================================
     5. 파일 이름 규칙
     ========================================================= */
  // 연결된 드라이브 폴더 이름 (파일명 앞머리에 붙이는 용도)
  function folderLabel() { return safeName(folder.name, 30); }
  function subfolderLabel() { return settings.useSubfolder ? safeName(settings.subfolderName, 30) : ""; }

  function applyPattern(pattern, ctx) {
    var out = String(pattern || "").replace(/\{([^}]*)\}/g, function (m, k) {
      switch (k) {
        case "폴더명": return ctx.folder;
        case "하위폴더": return ctx.subfolder;
        case "날짜": return ctx.date;
        case "시간": return ctx.time;
        case "유형": return ctx.type;
        case "제목": return ctx.title;
        case "번호": return ctx.no;
        case "원본이름": return ctx.stem;
        case "확장자": return ctx.ext.replace(/^\./, "");
        default: return "";
      }
    });
    out = safeName(out, 110);
    // 빈 토큰 때문에 생긴 중복 구분자를 정리한다 (예: 폴더 미연결 시 "_2026-08-16_…")
    out = out.replace(/_{2,}/g, "_").replace(/^[_\s-]+/, "").replace(/[_\s-]+$/, "");
    return out || "무제";
  }
  function nameContext(entry, order, original, ext) {
    return {
      folder: folderLabel(), subfolder: subfolderLabel(),
      date: dateStamp(entry.createdAt), time: timeStamp(entry.createdAt),
      type: typeOf(entry.type).label,
      title: safeName(entry.title, 40) || "무제",
      no: pad2(order || 1),
      stem: safeName(stemOf(original || ""), 40),
      ext: ext || ""
    };
  }
  function attachName(entry, order, original) {
    var ext = extOf(original);
    var ctx = nameContext(entry, order, original, ext);
    if (!ctx.stem) ctx.stem = "파일";
    var name = applyPattern(settings.filePattern, ctx);
    if (settings.filePattern.indexOf("{확장자}") < 0) name += ext;
    return name;
  }
  function mdName(entry) {
    var ctx = nameContext(entry, 1, "", ".md");
    ctx.title = safeName(entry.title, 50) || "무제";
    return applyPattern(settings.mdPattern, ctx) + ".md";
  }
  function patternPreview(pattern, isMd) {
    var ctx = {
      folder: folderLabel() || "기록폴더", subfolder: subfolderLabel() || "자료",
      date: dateStamp(), time: timeStamp(),
      type: typeOf(currentType).label,
      title: safeName($("title") && $("title").value, 40) || "수업 회고",
      no: "01", stem: "IMG_4821", ext: isMd ? ".md" : ".png"
    };
    var out = applyPattern(pattern, ctx);
    if (isMd) return out + ".md";
    return out + (pattern.indexOf("{확장자}") < 0 ? ".png" : "");
  }

  /* =========================================================
     5-2. 위키링크 [[제목]] · 백링크
     ========================================================= */
  // [[제목]] 또는 [[제목|보일 글자]]
  function wikiRe() { return /\[\[([^\[\]|]+?)(?:\|([^\[\]]*?))?\]\]/g; }
  function normTitle(s) { return String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g, " "); }
  function isTextBlock(b) { return b.kind === "text" || b.kind === "quote" || b.kind === "heading"; }

  var _linkCache = null;   // { byTitle, out, back } — 렌더 한 번당 한 번만 계산
  function invalidateLinks() { _linkCache = null; }

  function linkData() {
    if (_linkCache) return _linkCache;
    var byTitle = {}, out = {}, back = {};
    entries.forEach(function (n) {
      var k = normTitle(n.title);
      if (k && !byTitle[k]) byTitle[k] = n;
    });
    entries.forEach(function (n) {
      var seen = {}, list = [];
      (n.blocks || []).forEach(function (b) {
        if (!isTextBlock(b)) return;
        var re = wikiRe(), m;
        while ((m = re.exec(b.text || ""))) {
          var target = (m[1] || "").trim();
          var k = normTitle(target);
          if (!k || seen[k]) continue;
          seen[k] = 1;
          list.push({ title: target, key: k, to: byTitle[k] ? byTitle[k].id : null });
        }
      });
      out[n.id] = list;
      list.forEach(function (l) {
        if (!l.to || l.to === n.id) return;
        (back[l.to] = back[l.to] || []).push(n.id);
      });
    });
    _linkCache = { byTitle: byTitle, out: out, back: back };
    return _linkCache;
  }
  function outLinks(n) { return linkData().out[n.id] || []; }
  function backLinks(n) {
    var ids = linkData().back[n.id] || [];
    return ids.map(function (id) { return entries.filter(function (x) { return x.id === id; })[0]; }).filter(Boolean);
  }
  function findByTitle(t) { return linkData().byTitle[normTitle(t)] || null; }

  // 목록에서 해당 기록으로 이동 + 잠깐 강조
  function gotoEntry(id) {
    closeModal();
    if (filterType !== "all" || searchQ) { filterType = "all"; searchQ = ""; $("search").value = ""; render(); }
    expanded[id] = true;
    render();
    setTimeout(function () {
      var card = document.querySelector('[data-eid="' + id + '"]');
      if (!card) return;
      card.scrollIntoView({ behavior: "smooth", block: "center" });
      card.classList.add("flash");
      setTimeout(function () { card.classList.remove("flash"); }, 1500);
    }, 30);
  }
  // 아직 없는 제목을 눌렀을 때 — 그 제목으로 새 기록 시작
  function startNewFromLink(title) {
    if (editingId || hasContent() || $("title").value.trim()) {
      if (!window.confirm("작성 중인 내용을 두고 「" + title + "」 새 기록을 시작할까요?")) return;
    }
    closeModal();
    resetComposer();
    $("title").value = title;
    addBlock("text");
    window.scrollTo({ top: 0, behavior: "smooth" });
    toast("「" + title + "」 기록을 새로 시작합니다.");
  }
  function wikiLinkEl(target, label) {
    var found = findByTitle(target);
    var a = el("a", "wikilink" + (found ? "" : " missing"), label || target);
    a.href = "javascript:void(0)";
    a.title = found ? "이동: " + found.title : "아직 없는 기록 — 눌러서 만들기";
    a.addEventListener("click", function (e) {
      e.preventDefault();
      if (found) gotoEntry(found.id); else startNewFromLink(target);
    });
    return a;
  }
  // 텍스트를 [[링크]] 가 살아 있는 노드들로 붙인다
  function appendRichText(host, text) {
    var s = String(text == null ? "" : text);
    var re = wikiRe(), last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) host.appendChild(document.createTextNode(s.slice(last, m.index)));
      var target = (m[1] || "").trim();
      var label = (m[2] != null && m[2].trim()) ? m[2].trim() : target;
      host.appendChild(wikiLinkEl(target, label));
      last = re.lastIndex;
    }
    if (last < s.length) host.appendChild(document.createTextNode(s.slice(last)));
  }

  /* =========================================================
     6. 마크다운 생성
     ========================================================= */
  function yq(s) { return '"' + String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"'; }
  function mediaPath(f) {
    var dir = settings.useSubfolder ? ((settings.subfolderName || "자료") + "/") : "";
    var p = dir + (f.name || "");
    // 마크다운 링크 안의 공백은 <> 로 감싸야 대부분의 뷰어에서 깨지지 않는다
    return /\s/.test(p) ? "<" + p + ">" : p;
  }
  function driveLink(id) { return "https://drive.google.com/file/d/" + id + "/view"; }

  function buildMarkdown(n) {
    var media = (n.blocks || []).filter(function (b) { return b.kind === "image" || b.kind === "file"; });
    var links = (n.blocks || []).filter(function (b) { return b.kind === "link"; });
    var L = [];
    L.push("---");
    L.push("id: " + n.id);
    L.push("type: " + typeOf(n.type).label);
    L.push("title: " + yq(n.title));
    // 파일명이 "{날짜}_{유형}_{제목}.md" 라서, 별칭이 없으면 옵시디언이 [[제목]] 을 못 찾습니다
    L.push("aliases: [" + [n.title, n.id].filter(Boolean).map(yq).join(", ") + "]");
    L.push("tags: [" + (n.tags || []).map(yq).join(", ") + "]");
    L.push("created: " + isoDate(n.createdAt));
    L.push("updated: " + isoDate(n.updatedAt));
    if (links.length) {
      L.push("links:");
      links.forEach(function (b) { L.push("  - url: " + yq(b.url)); L.push("    label: " + yq(b.label || "")); });
    }
    if (media.length) {
      L.push("attachments:");
      media.forEach(function (b) {
        L.push("  - file: " + yq(b.name || ""));
        L.push("    original: " + yq(b.original || ""));
        L.push("    mime: " + yq(b.mime || ""));
        if (b.fileId) L.push("    driveId: " + yq(b.fileId));
      });
    }
    L.push("---");
    L.push("");
    L.push("# " + (n.title || "(제목 없음)"));
    L.push("");

    (n.blocks || []).forEach(function (b) {
      if (b.kind === "text") {
        if (b.text && b.text.trim()) { L.push(b.text.trim()); L.push(""); }
      } else if (b.kind === "heading") {
        if (b.text && b.text.trim()) { L.push("## " + b.text.trim()); L.push(""); }
      } else if (b.kind === "quote") {
        if (b.text && b.text.trim()) {
          b.text.trim().split("\n").forEach(function (line) { L.push("> " + line); });
          L.push("");
        }
      } else if (b.kind === "divider") {
        L.push("---"); L.push("");
      } else if (b.kind === "image") {
        L.push("![" + (b.caption || b.original || "") + "](" + mediaPath(b) + ")");
        if (b.caption) L.push("*" + b.caption + "*");
        if (b.fileId) L.push("<!-- drive: " + driveLink(b.fileId) + " -->");
        L.push("");
      } else if (b.kind === "file") {
        var line = "📎 [" + (b.caption || b.name || b.original) + "](" + (b.fileId ? driveLink(b.fileId) : mediaPath(b)) + ")";
        if (b.original && b.name && b.original !== b.name) line += " <!-- 원본: " + b.original + " -->";
        L.push(line); L.push("");
      } else if (b.kind === "link") {
        if (b.url) { L.push("🔗 [" + (b.label || b.url) + "](" + b.url + ")"); L.push(""); }
      }
    });
    return L.join("\n").replace(/\n{3,}/g, "\n\n");
  }

  /* =========================================================
     7. 동기화
     ========================================================= */
  function slimBlock(b) {
    var o = { id: b.id, kind: b.kind };
    if (b.kind === "text" || b.kind === "heading" || b.kind === "quote") o.text = b.text || "";
    if (b.kind === "link") { o.url = b.url || ""; o.label = b.label || ""; }
    if (b.kind === "image" || b.kind === "file") {
      o.original = b.original || ""; o.mime = b.mime || ""; o.size = b.size || 0;
      o.name = b.name || ""; o.caption = b.caption || ""; o.fileId = b.fileId || null;
    }
    return o;
  }
  function slim(n) {
    return {
      id: n.id, type: n.type, title: n.title, tags: n.tags || [],
      blocks: (n.blocks || []).filter(function (b) { return b.kind !== "image" && b.kind !== "file" ? true : !!b.fileId; }).map(slimBlock),
      createdAt: n.createdAt, updatedAt: n.updatedAt, mdId: n.mdId || null, mdName: n.mdName || null
    };
  }
  function findIndexFile() {
    if (indexFileId) return Promise.resolve(indexFileId);
    return findInFolder(INDEX_NAME, folder.id).then(function (id) { indexFileId = id; return id; });
  }
  function saveIndex() {
    pruneTombs();
    var content = JSON.stringify(
      { version: 3, app: "PKEMS", entries: entries.map(slim), deleted: tombstones }, null, 2);
    return findIndexFile().then(function (id) {
      return uploadFile(INDEX_NAME, "application/json", content, false, id, folder.id);
    }).then(function (r) { if (r && r.id) indexFileId = r.id; });
  }
  // 원격 색인을 { entries, deleted } 로 읽는다 (구버전은 deleted 가 없음)
  function loadIndex() {
    return findIndexFile().then(function (id) {
      if (!id) return { entries: [], deleted: [] };
      return driveFetch("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media&supportsAllDrives=true")
        .then(function (r) { return r.json(); })
        .then(function (j) { return { entries: migrate((j && j.entries) || []), deleted: (j && j.deleted) || [] }; })
        .catch(function () { return { entries: [], deleted: [] }; });
    });
  }
  function addTomb(id) {
    tombstones = tombstones.filter(function (t) { return t.id !== id; });
    tombstones.push({ id: id, at: Date.now() });
  }
  function mergeTombs(remote) {
    var map = {};
    tombstones.concat(remote || []).forEach(function (t) {
      if (!t || !t.id) return;
      if (!map[t.id] || (t.at || 0) > map[t.id].at) map[t.id] = { id: t.id, at: t.at || 0 };
    });
    tombstones = Object.keys(map).map(function (k) { return map[k]; });
    return tombstones;
  }
  function pruneTombs() {
    var cut = Date.now() - TOMB_KEEP_DAYS * 86400000;
    tombstones = tombstones.filter(function (t) { return (t.at || 0) > cut; });
  }
  function saveSettingsRemote() {
    if (!connected || !folder.id) return Promise.resolve();
    var content = JSON.stringify(settings, null, 2);
    var p = settingsFileId ? Promise.resolve(settingsFileId) : findInFolder(SETTINGS_NAME, folder.id);
    return p.then(function (id) {
      settingsFileId = id;
      return uploadFile(SETTINGS_NAME, "application/json", content, false, id, folder.id);
    }).then(function (r) { if (r && r.id) settingsFileId = r.id; }).catch(function () {});
  }
  function loadSettingsRemote() {
    return findInFolder(SETTINGS_NAME, folder.id).then(function (id) {
      if (!id) return null;
      settingsFileId = id;
      return driveFetch("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media&supportsAllDrives=true")
        .then(function (r) { return r.json(); }).catch(function () { return null; });
    }).catch(function () { return null; });
  }
  function mergeEntries(local, remote) {
    var map = {};
    (remote || []).forEach(function (n) { map[n.id] = n; });
    (local || []).forEach(function (n) {
      var r = map[n.id];
      if (!r || (n.updatedAt || 0) >= (r.updatedAt || 0)) map[n.id] = n;
    });
    // 다른 기기에서 지운 기록은 되살아나지 않게 한다
    tombstones.forEach(function (t) {
      var n = map[t.id];
      if (n && (n.updatedAt || 0) <= (t.at || 0)) delete map[t.id];
    });
    var arr = Object.keys(map).map(function (k) { return map[k]; });
    arr.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    return arr;
  }
  // 원격 색인을 받아 로컬과 합친다 (삭제 기록 포함)
  function absorbIndex(remote) {
    mergeTombs(remote.deleted);
    entries = mergeEntries(entries, remote.entries);
    return entries;
  }

  function syncPending() {
    if (!connected || !folder.id) return Promise.resolve();
    var uploads = [];
    entries.forEach(function (n) {
      (n.blocks || []).forEach(function (b) {
        if ((b.kind === "image" || b.kind === "file") && !b.fileId && b.dataUrl) uploads.push({ n: n, b: b });
      });
    });
    var docs = entries.filter(function (n) { return n._dirty || !n.mdId; });
    var total = uploads.length + docs.length + 1, done = 0;
    function tick() { done++; progress(Math.round(done / total * 100)); }

    return ensureSubfolder().then(function (parent) {
      return uploads.reduce(function (p, job) {
        return p.then(function () {
          return uploadFile(job.b.name, job.b.mime || "application/octet-stream", b64of(job.b.dataUrl), true, null, parent)
            .then(function (r) {
              job.b.fileId = r.id; delete job.b.dataUrl; job.n._dirty = true;
              idbDel(job.b.id);   // 올라갔으니 임시 보관본 삭제
              tick();
            })
            .catch(function (e) { console.warn("첨부 업로드 실패", job.b.name, e); tick(); });
        });
      }, Promise.resolve());
    }).then(function () {
      return docs.reduce(function (p, n) {
        return p.then(function () {
          var want = mdName(n);
          var pre = n.mdId ? Promise.resolve(want) : uniqueName(want, folder.id);
          return pre.then(function (finalName) {
            return uploadFile(finalName, "text/markdown", buildMarkdown(n), false, n.mdId || null, folder.id)
              .then(function (r) { n.mdId = r.id; n.mdName = finalName; delete n._dirty; tick(); });
          }).catch(function (e) { console.warn("md 저장 실패", n.title, e); tick(); });
        });
      }, Promise.resolve());
    }).then(function () {
      return saveIndex();
    }).then(function () {
      tick(); saveLocal(); render();
    }).catch(function (e) {
      console.warn(e); progress(0); toast("동기화 중 오류: " + e.message);
    });
  }

  function connect(folderInputValue) {
    if (!clientId) { toast("앱에 구글 클라이언트 ID가 설정되지 않았습니다. 설정 → 고급에서 입력해 주세요."); return Promise.resolve(); }
    progress(10);
    return requestToken(!accessToken)
      .then(ensureAccount)
      .then(function () {
        var id = parseFolderId(folderInputValue) || folder.id;
        if (!id) { var e = new Error("NO_FOLDER"); e.noFolder = true; throw e; }
        return verifyFolder(id);
      })
      .then(function (f) {
        folder = { id: f.id, name: f.name, link: f.link };
        localStorage.setItem(LS.folder, JSON.stringify(folder));
        connected = true;
        localStorage.setItem(LS.connected, "1");
        subFolderId = null; indexFileId = null; settingsFileId = null;
        updateChrome();
        return loadSettingsRemote();
      })
      .then(function (remoteSettings) {
        if (remoteSettings) { settings = normalizeSettings(remoteSettings); saveSettingsLocal(); }
        else saveSettingsRemote();
        if (!typeOf(currentType) || typeOf(currentType).label === "미분류") currentType = settings.types[0].key;
        renderTypeChips();
        return loadIndex();
      })
      .then(function (remote) {
        absorbIndex(remote);
        saveLocal(); render();
        return syncPending();
      })
      .then(function () {
        progress(100);
        lastSyncAt = Date.now(); setSyncPill(syncedAgo());
        toast("「" + folder.name + "」 폴더에 연결되었습니다.");
        closeModal();
      })
      .catch(function (e) {
        progress(0);
        if (e && e.noFolder) { updateChrome(); openSettings("storage"); toast("저장할 폴더를 지정해 주세요."); return; }
        connected = false; updateChrome();
        toast("연결 실패: " + (e && e.message ? e.message : e));
      });
  }

  /* =========================================================
     8. 블록 에디터
     ========================================================= */
  var BLOCK_META = {
    text:    { icon: "📝", label: "글" },
    heading: { icon: "🔠", label: "소제목" },
    quote:   { icon: "❝", label: "인용" },
    image:   { icon: "🖼️", label: "사진" },
    file:    { icon: "📎", label: "파일" },
    link:    { icon: "🔗", label: "링크" },
    divider: { icon: "➖", label: "구분선" }
  };

  function newBlock(kind, data) {
    var b = { id: uid(), kind: kind };
    if (kind === "text" || kind === "heading" || kind === "quote") b.text = "";
    if (kind === "link") { b.url = ""; b.label = ""; }
    if (kind === "image" || kind === "file") { b.caption = ""; }
    if (data) for (var k in data) if (Object.prototype.hasOwnProperty.call(data, k)) b[k] = data[k];
    return b;
  }
  function addBlock(kind, data, focus) {
    if (kind === "image") { $("imgInput").click(); return; }
    if (kind === "file") { $("fileInput").click(); return; }
    if (kind === "capture") { startCapture(); return; }
    var b = newBlock(kind, data);
    blocks.push(b);
    renderBlocks();
    if (focus !== false) {
      var node = document.querySelector('[data-bid="' + b.id + '"]');
      var f = node && node.querySelector("textarea, input");
      if (f) f.focus();
    }
    return b;
  }
  function moveBlock(id, dir) {
    var i = blocks.findIndex(function (b) { return b.id === id; });
    var j = i + dir;
    if (i < 0 || j < 0 || j >= blocks.length) return;
    var t = blocks[i]; blocks[i] = blocks[j]; blocks[j] = t;
    renderBlocks();
  }
  function removeBlock(id) {
    blocks = blocks.filter(function (b) { return b.id !== id; });
    renderBlocks();
  }
  function mediaOrder(b) {
    var n = 0;
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].kind === "image" || blocks[i].kind === "file") {
        n++;
        if (blocks[i].id === b.id) return n;
      }
    }
    return n;
  }
  function previewAttachName(b) {
    if (b.name) return b.name;
    return attachName({ createdAt: Date.now(), title: $("title").value, type: currentType }, mediaOrder(b), b.original || "file");
  }

  function renderBlocks() {
    var host = $("blocks");
    host.innerHTML = "";
    if (!blocks.length) {
      var hint = el("div", "desc", "아래 버튼으로 글·사진·링크를 원하는 순서대로 추가하세요.");
      hint.style.padding = "6px 2px 10px";
      host.appendChild(hint);
    }
    blocks.forEach(function (b, idx) {
      var meta = BLOCK_META[b.kind] || BLOCK_META.text;
      var wrap = el("div", "block " + b.kind);
      wrap.setAttribute("data-bid", b.id);

      var head = el("div", "bhead");
      head.appendChild(el("span", "bkind", meta.icon + " " + meta.label));
      head.appendChild(el("span", "spacer"));
      var up = el("button", "btn xs", "↑"); up.type = "button"; up.disabled = idx === 0;
      up.addEventListener("click", function () { moveBlock(b.id, -1); });
      var dn = el("button", "btn xs", "↓"); dn.type = "button"; dn.disabled = idx === blocks.length - 1;
      dn.addEventListener("click", function () { moveBlock(b.id, 1); });
      var rm = el("button", "btn xs danger", "✕"); rm.type = "button";
      rm.addEventListener("click", function () { removeBlock(b.id); });
      head.appendChild(up); head.appendChild(dn); head.appendChild(rm);
      wrap.appendChild(head);

      var body = el("div", "bbody");

      if (b.kind === "text" || b.kind === "quote") {
        var ta = el("textarea", "inp");
        ta.value = b.text || "";
        ta.placeholder = b.kind === "quote" ? "인용할 문장" : "내용을 적으세요.  [[ 를 치면 다른 기록과 연결됩니다";
        ta.rows = 3;
        ta.addEventListener("input", function () { b.text = ta.value; autoGrow(ta); });
        ta.addEventListener("paste", function (e) { handlePaste(e, b); });
        attachWiki(ta);
        body.appendChild(ta);
        setTimeout(function () { autoGrow(ta); }, 0);

      } else if (b.kind === "heading") {
        var hi = el("input", "inp");
        hi.value = b.text || ""; hi.placeholder = "소제목";
        hi.addEventListener("input", function () { b.text = hi.value; });
        attachWiki(hi);
        body.appendChild(hi);

      } else if (b.kind === "link") {
        var r1 = el("div", "row");
        var u = el("input", "inp"); u.style.flex = "2 1 55%"; u.style.width = "auto";
        u.placeholder = "https://…"; u.value = b.url || "";
        u.addEventListener("input", function () { b.url = u.value; });
        var lb = el("input", "inp"); lb.style.flex = "1 1 35%"; lb.style.width = "auto";
        lb.placeholder = "설명(선택)"; lb.value = b.label || "";
        lb.addEventListener("input", function () { b.label = lb.value; });
        r1.appendChild(u); r1.appendChild(lb);
        body.appendChild(r1);

      } else if (b.kind === "divider") {
        body.appendChild(el("hr"));

      } else { // image / file
        var m = el("div", "media");
        if (b.kind === "image" && (b.dataUrl || b.fileId)) {
          var img = el("img", "thumb");
          if (b.dataUrl) img.src = b.dataUrl; else loadDriveImage(b.fileId, img);
          m.appendChild(img);
        } else {
          m.appendChild(el("div", "ficon", fileIcon(b.mime, b.original)));
        }
        var info = el("div", "minfo");
        info.appendChild(el("span", "savedname", previewAttachName(b)));
        info.appendChild(el("span", "origname", "원본: " + (b.original || "") + " · " + humanSize(b.size) +
          (b.fileId ? " · ☁ 저장됨" : " · 업로드 대기")));
        var cap = el("input", "inp");
        cap.placeholder = "설명·캡션(선택)"; cap.value = b.caption || "";
        cap.addEventListener("input", function () { b.caption = cap.value; });
        info.appendChild(cap);
        m.appendChild(info);
        body.appendChild(m);
      }

      wrap.appendChild(body);
      host.appendChild(wrap);
    });
  }

  /* ---------- 사진 넣는 방법 고르기 (PC / 모바일 공통 입구) ---------- */
  function isTouchDevice() {
    return (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) ||
      /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "");
  }
  function captureSupported() {
    // 모바일 브라우저는 API 가 있어도 실제로는 막혀 있는 경우가 많다
    return !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) && !isTouchDevice();
  }
  var skipCrop = false;

  function openCaptureSheet() {
    closeModal();
    var mobile = isTouchDevice();
    var bg = el("div", "modal-bg");
    var m = el("div", "card modal sheet"); m.style.maxWidth = "460px";

    var head = el("div", "mhead");
    head.appendChild(el("h3", null, "📸 화면 캡처 · 사진 넣기"));
    head.appendChild(el("span", "spacer"));
    var x = el("button", "btn sm ghost", "✕"); x.addEventListener("click", closeModal);
    head.appendChild(x);
    m.appendChild(head);

    var body = el("div", "mbody");
    body.appendChild(el("p", "sheetnote", mobile
      ? "휴대폰 브라우저는 화면을 직접 캡처할 수 없습니다. 전원 + 음량↓(아이폰은 전원 + 음량↑)로 스크린샷을 찍은 뒤 갤러리에서 고르면 PC와 똑같이 영역을 잘라 넣을 수 있습니다."
      : "화면을 직접 캡처하거나, 이미 가지고 있는 이미지 파일에서 필요한 부분만 잘라 넣을 수 있습니다."));

    function sheetBtn(emoji, title, sub, onClick) {
      var b = el("button", "sheetbtn");
      b.type = "button";
      b.appendChild(el("span", "em", emoji));
      var t = el("span");
      t.appendChild(document.createTextNode(title));
      t.appendChild(el("small", null, sub));
      b.appendChild(t);
      b.addEventListener("click", function () { closeModal(); onClick(); });
      body.appendChild(b);
      return b;
    }

    if (mobile) {
      sheetBtn("🖼️", "갤러리에서 고르기", "스크린샷·사진을 골라 영역을 자릅니다", function () { $("cropPickInput").click(); });
      sheetBtn("📷", "카메라로 찍기", "칠판·유인물을 바로 찍어 넣습니다", pickFromCamera);
    } else {
      sheetBtn("🖥️", "화면 캡처하기", "창·탭을 고른 뒤 영역을 자릅니다", startScreenCapture);
      sheetBtn("🖼️", "이미지 파일에서 고르기", "가지고 있는 사진의 일부만 잘라 넣습니다", function () { $("cropPickInput").click(); });
      sheetBtn("📷", "웹캠·휴대폰 카메라", "기기에 카메라가 있으면 바로 촬영합니다", pickFromCamera);
    }

    var tg = el("label", "sheettoggle");
    var cb = el("input"); cb.type = "checkbox"; cb.checked = skipCrop;
    cb.addEventListener("change", function () { skipCrop = cb.checked; });
    tg.appendChild(cb);
    tg.appendChild(document.createTextNode("자르지 않고 원본 그대로 넣기"));
    body.appendChild(tg);
    m.appendChild(body);

    bg.appendChild(m);
    bg.addEventListener("click", function (e) { if (e.target === bg) closeModal(); });
    $("modalHost").appendChild(bg);
    modalEl = bg;
  }

  // 고른 이미지 파일 → (자르기 화면) → 사진 블록
  var MAX_EDGE = 2400; // 휴대폰 고화질 사진을 자르기 전에 적당히 줄인다
  function imageFileToCanvas(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var s = Math.min(1, MAX_EDGE / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(w * s));
        c.height = Math.max(1, Math.round(h * s));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("이미지를 열 수 없습니다.")); };
      img.src = url;
    });
  }
  // 카메라 촬영 — 누를 때만 입력칸을 만들고 바로 없앤다
  function pickFromCamera() {
    var inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/*";
    inp.setAttribute("capture", "environment");
    inp.style.display = "none";
    document.body.appendChild(inp);
    inp.addEventListener("change", function () {
      var f = inp.files && inp.files[0];
      setTimeout(function () { if (inp.parentNode) inp.parentNode.removeChild(inp); }, 0);
      handlePickedImage(f);
    });
    inp.click();
  }

  function handlePickedImage(file) {
    if (!file) return;
    if (skipCrop) { acceptFiles([file]); return; }
    imageFileToCanvas(file)
      .then(function (c) { openCropModal(c, file.name); })
      .catch(function (e) { toast(e.message); });
  }

  /* ---------- 화면 캡처 (데스크톱) ---------- */
  function startCapture() { openCaptureSheet(); }

  function startScreenCapture() {
    if (!captureSupported()) {
      toast("이 브라우저·환경은 화면 캡처를 지원하지 않습니다. Win+Shift+S(맥은 ⌘⇧4)로 캡처한 뒤 글 칸에 Ctrl+V 로 붙여넣으세요.");
      return;
    }
    var askedAt = Date.now();
    navigator.mediaDevices.getDisplayMedia({ video: true, audio: false })
      .then(function (stream) {
        var v = document.createElement("video");
        v.srcObject = stream; v.muted = true; v.playsInline = true;
        return v.play().then(function () {
          // 첫 프레임이 실제로 그려질 때까지 잠깐 기다린다
          return new Promise(function (res) { setTimeout(function () { res(v); }, 300); });
        });
      })
      .then(function (v) {
        var w = v.videoWidth, h = v.videoHeight;
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(v, 0, 0, w, h);
        try { v.srcObject.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
        if (!w || !h) { toast("캡처된 화면이 없습니다. 다시 시도해 주세요."); return; }
        openCropModal(c);
      })
      .catch(function (e) {
        var name = (e && e.name) || "";
        // 선택창이 뜰 새도 없이 거절됐다면 사용자가 취소한 게 아니라 브라우저가 막은 것이다
        var blocked = (Date.now() - askedAt) < 600;
        if ((name === "NotAllowedError" || name === "AbortError") && !blocked) return; // 사용자가 취소
        if (name === "NotAllowedError" || name === "NotSupportedError" || name === "AbortError") {
          toast("이 창에서는 화면 캡처가 막혀 있습니다. 크롬 등 일반 브라우저에서 열면 됩니다. (또는 Win+Shift+S 로 캡처 후 글 칸에 Ctrl+V)");
          return;
        }
        toast("화면 캡처 실패: " + (e && e.message ? e.message : e));
      });
  }

  // 캔버스를 PNG(너무 크면 JPEG)로 변환
  function canvasToAttachment(canvas, srcName) {
    var url = canvas.toDataURL("image/png");
    var mime = "image/png", ext = ".png";
    if (url.length > 8 * 1024 * 1024) {
      url = canvas.toDataURL("image/jpeg", 0.88);
      mime = "image/jpeg"; ext = ".jpg";
    }
    var base = srcName
      ? safeName(stemOf(srcName), 40) + "_잘라냄"
      : "화면캡처_" + dateStamp() + "_" + timeStamp();
    var bytes = Math.round((url.length - url.indexOf(",") - 1) * 0.75);
    return { original: base + ext, mime: mime, size: bytes, dataUrl: url };
  }

  function openCropModal(canvas, srcName) {
    closeModal();
    var full = canvas;
    var bg = el("div", "modal-bg");
    var m = el("div", "card modal"); m.style.maxWidth = "min(960px, 96vw)";

    var head = el("div", "mhead");
    head.appendChild(el("h3", null, "📸 캡처 영역 고르기"));
    head.appendChild(el("span", "spacer"));
    var x = el("button", "btn sm ghost", "✕"); x.addEventListener("click", closeModal);
    head.appendChild(x);
    m.appendChild(head);

    var body = el("div", "mbody"); body.style.textAlign = "center";
    var wrap = el("div", "cropwrap");
    var img = el("img");
    img.src = full.toDataURL("image/png");
    img.draggable = false;
    var sel = el("div", "cropsel"); sel.style.display = "none";
    var sizeTag = el("div", "cropsize"); sel.appendChild(sizeTag);
    wrap.appendChild(img); wrap.appendChild(sel);
    body.appendChild(wrap);
    body.appendChild(el("p", "crophint",
      "이미지 위에서 드래그해 저장할 영역을 고르세요. 그냥 전체를 쓰려면 «전체 사용»을 누르면 됩니다."));
    m.appendChild(body);

    var foot = el("div", "mfoot");
    var info = el("span", "desc"); info.style.margin = "0";
    info.textContent = full.width + " × " + full.height + " px";
    foot.appendChild(info);
    foot.appendChild(el("span", "spacer"));
    var again = el("button", "btn", srcName ? "다시 고르기" : "다시 찍기");
    again.addEventListener("click", function () { closeModal(); setTimeout(openCaptureSheet, 200); });
    var whole = el("button", "btn", "전체 사용");
    whole.addEventListener("click", function () { useRegion(0, 0, full.width, full.height); });
    var useSel = el("button", "btn primary", "선택 영역 사용");
    useSel.disabled = true;
    foot.appendChild(again); foot.appendChild(whole); foot.appendChild(useSel);
    m.appendChild(foot);

    bg.appendChild(m);
    bg.addEventListener("click", function (e) { if (e.target === bg) closeModal(); });
    $("modalHost").appendChild(bg);
    modalEl = bg;

    /* --- 드래그로 영역 선택 --- */
    var start = null, rect = null;
    function pos(e) {
      var r = img.getBoundingClientRect();
      var p = (e.touches && e.touches[0]) ? e.touches[0] : e;
      return {
        x: Math.max(0, Math.min(r.width, p.clientX - r.left)),
        y: Math.max(0, Math.min(r.height, p.clientY - r.top))
      };
    }
    function paintSel() {
      if (!rect) { sel.style.display = "none"; useSel.disabled = true; return; }
      sel.style.display = "block";
      sel.style.left = rect.x + "px"; sel.style.top = rect.y + "px";
      sel.style.width = rect.w + "px"; sel.style.height = rect.h + "px";
      var s = full.width / img.clientWidth;
      sizeTag.textContent = Math.round(rect.w * s) + " × " + Math.round(rect.h * s) + " px";
      useSel.disabled = rect.w < 8 || rect.h < 8;
    }
    function down(e) {
      e.preventDefault();
      start = pos(e); rect = { x: start.x, y: start.y, w: 0, h: 0 }; paintSel();
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
      window.addEventListener("touchmove", move, { passive: false });
      window.addEventListener("touchend", up);
    }
    function move(e) {
      if (!start) return;
      e.preventDefault();
      var p = pos(e);
      rect = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) };
      paintSel();
    }
    function up() {
      start = null;
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      window.removeEventListener("touchmove", move);
      window.removeEventListener("touchend", up);
    }
    wrap.addEventListener("mousedown", down);
    wrap.addEventListener("touchstart", down, { passive: false });

    useSel.addEventListener("click", function () {
      if (!rect) return;
      var s = full.width / img.clientWidth;
      useRegion(Math.round(rect.x * s), Math.round(rect.y * s), Math.round(rect.w * s), Math.round(rect.h * s));
    });

    function useRegion(sx, sy, sw, sh) {
      sw = Math.max(1, Math.min(sw, full.width - sx));
      sh = Math.max(1, Math.min(sh, full.height - sy));
      var c = document.createElement("canvas");
      c.width = sw; c.height = sh;
      c.getContext("2d").drawImage(full, sx, sy, sw, sh, 0, 0, sw, sh);
      var att = canvasToAttachment(c, srcName);
      if (att.size > MAX_FILE_MB * 1024 * 1024) {
        toast("캡처 이미지가 " + MAX_FILE_MB + "MB 를 넘습니다. 영역을 좁혀 다시 잘라 주세요.");
        return;
      }
      blocks.push(newBlock("image", att));
      renderBlocks();
      closeModal();
      toast("캡처 " + sw + "×" + sh + " 를 추가했습니다. (" + humanSize(att.size) + ")");
      var last = $("blocks").lastElementChild;
      if (last) last.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  /* ---------- [[ 입력하면 뜨는 기록 고르기 ---------- */
  var wikiState = { field: null, start: -1, items: [], sel: 0 };

  function hideWikiPop() {
    $("wikiPop").classList.add("hidden");
    wikiState.field = null;
  }
  // 커서 바로 앞에 아직 닫히지 않은 "[[" 가 있는지
  function activeWikiQuery(field) {
    var v = field.value.slice(0, field.selectionStart);
    var i = v.lastIndexOf("[[");
    if (i < 0) return null;
    var after = v.slice(i + 2);
    if (after.indexOf("]]") >= 0 || after.indexOf("\n") >= 0 || after.length > 40) return null;
    return { start: i, q: after };
  }
  function paintWikiPop() {
    var pop = $("wikiPop");
    pop.innerHTML = "";
    pop.appendChild(el("div", "cap", "기록 고르기 — ↑↓ 이동, Enter 넣기, Esc 닫기"));
    wikiState.items.forEach(function (it, i) {
      var b = el("button", "wp" + (i === wikiState.sel ? " on" : ""));
      b.type = "button";
      b.appendChild(document.createTextNode(it.label));
      b.appendChild(el("small", null, it.sub));
      b.addEventListener("mousedown", function (e) { e.preventDefault(); applyWikiPick(i); });
      pop.appendChild(b);
    });
    pop.classList.remove("hidden");
    var r = wikiState.field.getBoundingClientRect();
    var top = r.bottom + window.scrollY + 4;
    var left = r.left + window.scrollX;
    pop.style.top = top + "px";
    pop.style.left = Math.min(left, window.innerWidth - 260) + "px";
    pop.style.width = Math.min(r.width, 340) + "px";
  }
  function updateWikiPop(field) {
    var a = activeWikiQuery(field);
    if (!a) { hideWikiPop(); return; }
    var q = normTitle(a.q);
    var items = entries
      .filter(function (n) { return n.id !== editingId && n.title; })
      .filter(function (n) { return !q || normTitle(n.title).indexOf(q) >= 0; })
      .slice(0, 8)
      .map(function (n) { return { label: n.title, sub: typeOf(n.type).icon + " " + typeOf(n.type).label + " · " + formatDate(n.createdAt) }; });
    if (a.q.trim()) items.push({ label: a.q.trim(), sub: "＋ 이 제목으로 새 기록 연결하기", isNew: true });
    if (!items.length) { hideWikiPop(); return; }
    wikiState = { field: field, start: a.start, items: items, sel: 0 };
    paintWikiPop();
  }
  function applyWikiPick(i) {
    var st = wikiState;
    if (!st.field || !st.items[i]) return;
    var f = st.field, title = st.items[i].label;
    var before = f.value.slice(0, st.start);
    var after = f.value.slice(f.selectionStart);
    var insert = "[[" + title + "]]";
    f.value = before + insert + after;
    var caret = before.length + insert.length;
    f.setSelectionRange(caret, caret);
    f.dispatchEvent(new Event("input", { bubbles: true }));
    hideWikiPop();
    f.focus();
  }
  function wikiKeydown(e) {
    var pop = $("wikiPop");
    if (pop.classList.contains("hidden") || !wikiState.field) return;
    if (e.key === "ArrowDown") { e.preventDefault(); wikiState.sel = (wikiState.sel + 1) % wikiState.items.length; paintWikiPop(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); wikiState.sel = (wikiState.sel - 1 + wikiState.items.length) % wikiState.items.length; paintWikiPop(); }
    else if ((e.key === "Enter" && !e.ctrlKey && !e.metaKey) || e.key === "Tab") {
      e.preventDefault(); e.stopPropagation(); applyWikiPick(wikiState.sel);
    }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); hideWikiPop(); }
  }
  // 글·소제목·인용 칸에 자동완성을 붙인다
  function attachWiki(field) {
    field.addEventListener("input", function () { updateWikiPop(field); });
    field.addEventListener("keydown", wikiKeydown);
    field.addEventListener("click", function () { updateWikiPop(field); });
    field.addEventListener("blur", function () { setTimeout(function () { if (wikiState.field === field) hideWikiPop(); }, 120); });
  }

  function handlePaste(e, afterBlock) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file") { var f = items[i].getAsFile(); if (f) files.push(f); }
    }
    if (!files.length) return;
    e.preventDefault();
    acceptFiles(files, afterBlock);
  }

  function acceptFiles(fileList, afterBlock) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return Promise.resolve();
    var tasks = files.map(function (f) {
      if (f.size > MAX_FILE_MB * 1024 * 1024) {
        toast("「" + f.name + "」 은 " + MAX_FILE_MB + "MB 를 넘어 건너뜁니다.");
        return Promise.resolve(null);
      }
      return fileToDataURL(f).then(function (url) {
        var mime = f.type || mimeOfDataUrl(url);
        return newBlock(/^image\//.test(mime) ? "image" : "file", {
          original: f.name || "file", mime: mime, size: f.size, dataUrl: url
        });
      });
    });
    return Promise.all(tasks).then(function (arr) {
      var made = arr.filter(Boolean);
      if (!made.length) return;
      var at = afterBlock ? blocks.findIndex(function (b) { return b.id === afterBlock.id; }) + 1 : blocks.length;
      blocks.splice.apply(blocks, [at, 0].concat(made));
      renderBlocks();
      toast(made.length + "개를 추가했습니다.");
    });
  }

  function resetComposer() {
    editingId = null;
    currentType = settings.types[0] ? settings.types[0].key : "";
    $("title").value = ""; $("tags").value = "";
    blocks = [];
    renderTypeChips(); renderBlocks();

  function loadIntoComposer(n) {
    editingId = n.id;
    currentType = n.type;
    $("title").value = n.title || "";
    $("tags").value = (n.tags || []).join(", ");
    blocks = JSON.parse(JSON.stringify(n.blocks || []));
    renderTypeChips(); renderBlocks();
    $("composerTitle").textContent = "✏️ 기록 편집";
    $("btnSave").textContent = "수정 저장";
    $("btnCancelEdit").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function hasContent() {
    return blocks.some(function (b) {
      if (b.kind === "image" || b.kind === "file") return true;
      if (b.kind === "link") return !!b.url;
      if (b.kind === "divider") return false;
      return !!(b.text && b.text.trim());
    });
  }

  function saveEntry() {
    var title = $("title").value.trim();
    if (!title && !hasContent()) { toast("제목이나 내용을 입력해 주세요."); return; }

    var now = Date.now(), n;
    if (editingId) {
      n = entries.filter(function (x) { return x.id === editingId; })[0];
      if (!n) { resetComposer(); return; }
      var keep = {}, keepIds = {};
      blocks.forEach(function (b) { if (b.fileId) keep[b.fileId] = 1; keepIds[b.id] = 1; });
      (n.blocks || []).forEach(function (b) {
        if (b.fileId && !keep[b.fileId]) trashFile(b.fileId);
        if (!b.fileId && !keepIds[b.id]) idbDel(b.id);   // 빠진 대기 첨부 정리
      });
    } else {
      n = { id: uid("k_"), createdAt: now };
      entries.unshift(n);
    }

    n.type = currentType;
    n.title = title || "(제목 없음)";
    n.tags = $("tags").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    n.updatedAt = now;
    n._dirty = true;

    // 빈 블록 제거 + 링크 정규화 + 첨부 최종 이름 확정
    var order = 0;
    n.blocks = blocks.filter(function (b) {
      if (b.kind === "divider") return true;
      if (b.kind === "image" || b.kind === "file") return true;
      if (b.kind === "link") return !!(b.url && b.url.trim());
      return !!(b.text && b.text.trim());
    }).map(function (b) {
      var c = JSON.parse(JSON.stringify(b));
      if (c.kind === "link" && !/^(https?:|mailto:)/i.test(c.url)) c.url = "https://" + c.url.replace(/^\/+/, "");
      if (c.kind === "image" || c.kind === "file") {
        order++;
        if (!c.name) c.name = attachName(n, order, c.original || "file");
      }
      return c;
    });
    // dataUrl 은 JSON 복제로 유지되므로 원본 blocks 의 것을 다시 붙여 준다
    n.blocks.forEach(function (c) {
      var src = blocks.filter(function (b) { return b.id === c.id; })[0];
      if (src && src.dataUrl && !c.fileId) c.dataUrl = src.dataUrl;
    });

    saveLocal();
    resetComposer();
    render();
    toast(connected ? "저장했습니다. 드라이브에 올리는 중…" : "이 기기에 저장했습니다. (드라이브 미연결)");
    if (connected) syncPending();
  }

  function removeEntry(id) {
    var n = entries.filter(function (x) { return x.id === id; })[0];
    if (!n) return;
    confirmModal("기록을 삭제할까요?",
      "「" + (n.title || "") + "」" + (connected
        ? "\n\n드라이브의 .md 파일과 첨부 자료도 함께 휴지통으로 이동합니다."
        : "\n\n이 기기에서 삭제됩니다."),
      function () {
        if (connected) {
          trashFile(n.mdId);
          (n.blocks || []).forEach(function (b) { if (b.fileId) trashFile(b.fileId); });
        }
        (n.blocks || []).forEach(function (b) { if (!b.fileId) idbDel(b.id); });
        addTomb(id);
        entries = entries.filter(function (x) { return x.id !== id; });
        saveLocal(); render();
        if (connected) saveIndex().catch(function () {});
        if (editingId === id) resetComposer();
        toast("삭제했습니다.");
      });
  }

  function loadDriveImage(fileId, imgEl) {
    if (!fileId || !accessToken) return;
    if (imgUrlCache[fileId]) { imgEl.src = imgUrlCache[fileId]; return; }
    driveFetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media&supportsAllDrives=true")
      .then(function (r) { return r.ok ? r.blob() : null; })
      .then(function (b) {
        if (!b) return;
        var u = URL.createObjectURL(b);
        imgUrlCache[fileId] = u;
        imgEl.src = u;
      }).catch(function () {});
  }

  function entryText(n) {
    return [n.title, (n.tags || []).join(" ")].concat((n.blocks || []).map(function (b) {
      return [b.text, b.url, b.label, b.caption, b.name, b.original].filter(Boolean).join(" ");
    })).join(" ").toLowerCase();
  }
  function matches(n) {
    if (filterType !== "all" && n.type !== filterType) return false;
    if (!searchQ) return true;
    return entryText(n).indexOf(searchQ.toLowerCase()) >= 0;
  }

  function renderContent(n, host) {
    var imgCount = 0;
    (n.blocks || []).forEach(function (b) {
      if (b.kind === "text") {
        var p = el("p"); appendRichText(p, b.text); host.appendChild(p);
      } else if (b.kind === "heading") {
        var h = el("h4"); appendRichText(h, b.text); host.appendChild(h);
      } else if (b.kind === "quote") {
        var q = el("blockquote"); appendRichText(q, b.text); host.appendChild(q);
      } else if (b.kind === "divider") {
        host.appendChild(el("hr"));
      } else if (b.kind === "image") {
        var fig = el("figure");
        var img = el("img");
        img.alt = b.caption || b.original || "";
        img.loading = "lazy";
        if (b.dataUrl) img.src = b.dataUrl;
        else if (b.fileId && imgCount < THUMB_LIMIT) { imgCount++; loadDriveImage(b.fileId, img); }
        fig.appendChild(img);
        var capText = (b.caption || "") + (b.name ? (b.caption ? " · " : "") + b.name : "");
        if (capText) fig.appendChild(el("figcaption", null, capText));
        host.appendChild(fig);
      } else if (b.kind === "file") {
        var a = el("a", "fileline", fileIcon(b.mime, b.name) + " " + (b.caption || b.name || b.original) +
          (b.fileId ? "" : " · 업로드 대기"));
        if (b.fileId) { a.href = driveLink(b.fileId); a.target = "_blank"; a.rel = "noopener noreferrer"; }
        else a.href = "javascript:void(0)";
        var w1 = el("div"); w1.appendChild(a); host.appendChild(w1);
      } else if (b.kind === "link") {
        var la = el("a", "linkline", "🔗 " + (b.label || b.url));
        la.href = b.url; la.target = "_blank"; la.rel = "noopener noreferrer";
        var w2 = el("div"); w2.appendChild(la); host.appendChild(w2);
      }
    });
  }

  function render() {
    invalidateLinks();
    renderFilters();
    var host = $("list");
    host.innerHTML = "";
    var shown = entries.filter(matches);
    $("countText").textContent = entries.length
      ? (shown.length === entries.length ? entries.length + "개" : shown.length + " / " + entries.length + "개") : "";

    if (!shown.length) {

      }
      host.appendChild(e);

    }

    shown.forEach(function (n) {
      var t = typeOf(n.type);
      var card = el("article", "card entry");

      var body = el("div", "content" + (expanded[n.id] ? "" : " collapsed"));
